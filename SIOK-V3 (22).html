        <button onClick={analyser} disabled={loading||visites.length===0}
          style={{padding:"8px 16px",borderRadius:12,border:"none",background:"#7C3AED",color:"white",fontSize:12,fontWeight:700,cursor:loading||visites.length===0?"default":"pointer",fontFamily:"inherit",opacity:visites.length===0?0.5:1}}>
          {loading?"⏳ Analyse…":"✨ Analyser"}
        </button>
      </div>

      {visites.length===0&&<div style={{color:C.muted,fontSize:12,textAlign:"center",padding:"8px 0"}}>Pas encore assez de données. Attendez vos premières visites.</div>}

      {error&&<div style={{color:"#ef4444",fontSize:12,background:"rgba(239,68,68,0.08)",borderRadius:8,padding:"8px 12px"}}>{error}</div>}

      {conseil&&(
        <div style={{display:"flex",flexDirection:"column",gap:10,animation:"fadeUp 0.3s ease"}}>
          {/* Meilleure offre */}
          <div style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px"}}>
            <div style={{color:"#22C55E",fontWeight:700,fontSize:12,marginBottom:4}}>🏆 Meilleure offre</div>
            <div style={{color:C.text,fontWeight:700,fontSize:14}}>{conseil.meilleure_offre?.titre}</div>
            <div style={{color:C.muted,fontSize:12,marginTop:2}}>{conseil.meilleure_offre?.raison}</div>
            <div style={{color:"#22C55E",fontSize:11,fontWeight:700,marginTop:4}}>Taux de conversion : {conseil.meilleure_offre?.taux_conversion}</div>
          </div>

          {/* Meilleur moment */}
          <div style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px"}}>
            <div style={{color:"#0066FF",fontWeight:700,fontSize:12,marginBottom:4}}>⏰ Meilleur moment</div>
            <div style={{color:C.text,fontWeight:700,fontSize:14}}>{conseil.meilleur_moment?.jour} à {conseil.meilleur_moment?.heure}</div>
            <div style={{color:C.muted,fontSize:12,marginTop:2}}>{conseil.meilleur_moment?.conseil}</div>
          </div>

          {/* Chiffrage */}
          <div style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px"}}>
            <div style={{color:"#F59E0B",fontWeight:700,fontSize:12,marginBottom:4}}>💶 Chiffrage estimé</div>
            <div style={{color:"#F59E0B",fontWeight:900,fontSize:20}}>{conseil.chiffrage?.ca_estime}</div>
            <div style={{color:C.muted,fontSize:11,marginTop:2}}>{conseil.chiffrage?.methode}</div>
          </div>

          {/* Recommandations */}
          <div style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px"}}>
            <div style={{color:"#7C3AED",fontWeight:700,fontSize:12,marginBottom:8}}>💡 Recommandations</div>
            {conseil.recommandations?.map((r,i)=>(
              <div key={i} style={{display:"flex",gap:8,marginBottom:6,alignItems:"flex-start"}}>
                <span style={{color:"#7C3AED",fontWeight:700,fontSize:12,flexShrink:0}}>{i+1}.</span>
                <span style={{color:C.text,fontSize:12,lineHeight:1.5}}>{r}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══ DASHBOARD PRESTATAIRE ═══════════════════════════ */
function PrestataireDashboard({user,onLogout,onHome}){
  const [prestataires,setPrestataires]=useState([]);
  const [active,setActive]=useState(null);
  const [offres,setOffres]=useState([]);
  const [visites,setVisites]=useState([]);
  const [vuesMap,setVuesMap]=useState({});
  const [vuesData,setVuesData]=useState([]);
  const [impressionsMap,setImpressionsMap]=useState({});
  const [impressionsData,setImpressionsData]=useState([]);
  const [view,setView]=useState("dashboard");
  const [showProfile,setShowProfile]=useState(false);
  const [showChangePwd,setShowChangePwd]=useState(false);
  const [drillKpi,setDrillKpi]=useState(null);
  const [editingOffre,setEditingOffre]=useState(null);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [dashTab,setDashTab]=useState("offres");
  const [bgColor,setBgColor]=useState(window.SIOK_PARAMS?.fond_couleur_presta||"#0C0D0F");
  const [headerColor,setHeaderColor]=useState(window.SIOK_PARAMS?.fond_header_presta||null);

  const activeRef = useRef(null);
  useEffect(()=>{ activeRef.current = active; },[active]);

  useEffect(()=>{
    loadParams().then(()=>{
      setBgColor(window.SIOK_PARAMS?.fond_couleur_presta||"#0C0D0F");
      setHeaderColor(window.SIOK_PARAMS?.fond_header_presta||null);
    });
    loadPrestataires();
    const onFocus=()=>{
      const a = activeRef.current;
      if(a){ loadVisitesPrest(a.id); loadVues(a.id); }
    };
    window.addEventListener("focus", onFocus);
    return ()=>window.removeEventListener("focus", onFocus);
  },[]);

  const loadPrestataires=async()=>{
    setLoading(true);
    try{
      const {data}=await db().from("prestataires").select("*").eq("auth_id",user.id);
      if(data&&data.length>0){
        setPrestataires(data);
        setActive(data[0]);
        await loadOffres(data[0].id);
        await loadVisitesPrest(data[0].id);
        await loadVues(data[0].id);
      }
    }catch(e){console.error(e);}
    setLoading(false);
  };

  const loadOffres=async(prestId)=>{
    const {data}=await db().from("offres").select("*").eq("prestataire_id",prestId).order("created_at",{ascending:false});
    setOffres(data||[]);
  };

  const loadVisitesPrest=async(prestId)=>{
    const {data}=await db().from("visites")
      .select("*, offres(titre,type_offre,promo_pct,prix)")
      .eq("prestataire_id",prestId)
      .order("created_at",{ascending:false}).limit(200);
    if(data) setVisites(data);
  };

  const loadVues=async(prestId)=>{
    if(!prestId)return;
    const {data:offresData}=await db().from("offres").select("id").eq("prestataire_id",prestId);
    if(!offresData||offresData.length===0) return;
    const ids=offresData.map(o=>o.id);
    const [{data:vuesRaw},{data:impRaw}]=await Promise.all([
      db().from("vues_offres").select("offre_id,created_at").in("offre_id",ids).order("created_at",{ascending:false}).limit(2000),
      db().from("impressions_offres").select("offre_id,created_at").in("offre_id",ids).order("created_at",{ascending:false}).limit(5000),
    ]);
    if(vuesRaw){
      const map={};
      vuesRaw.forEach(v=>{map[v.offre_id]=(map[v.offre_id]||0)+1;});
      setVuesMap(map);
      setVuesData(vuesRaw);
    }
    if(impRaw){
      const map={};
      impRaw.forEach(v=>{map[v.offre_id]=(map[v.offre_id]||0)+1;});
      setImpressionsMap(map);
      setImpressionsData(impRaw);
    }
  };

  const toggleOffre=async(offre)=>{
    const next=!offre.active;
    await db().from("offres").update({active:next}).eq("id",offre.id);
    setOffres(os=>os.map(o=>o.id===offre.id?{...o,active:next}:o));
    setToast({msg:next?"Offre activée ✅":"Offre désactivée",type:next?"success":"info"});
    setTimeout(()=>setToast(null),2500);
  };

  if(loading) return <div style={{background:bgColor||C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.muted}}>Chargement…</div>;

  if(!active) return(
    <PrestPageShell onBack={onLogout} backLabel="Déconnexion" bgColor={bgColor} headerColor={headerColor}>
      <div style={{padding:24,textAlign:"center",color:C.muted}}>
        <div style={{fontSize:48,marginBottom:16}}>🏪</div>
        <div style={{color:C.text,fontSize:18,fontWeight:700,marginBottom:8}}>Aucun profil prestataire</div>
        <div style={{fontSize:13,marginBottom:24}}>Votre compte n'est pas encore associé à un prestataire. Contactez l'administrateur IOK'S.</div>
        <Btn variant="outline" onClick={onLogout}>Se déconnecter</Btn>
      </div>
    </PrestPageShell>
  );

  if(view==="scanner") return(
    <QRScanner
      prestataireId={active.id}
      onScanned={async()=>{
        await loadOffres(active.id);
        await loadVisitesPrest(active.id);
        await loadVues(active.id);
        setToast({msg:"✅ Visite validée !",type:"success"});
        setTimeout(()=>setToast(null),3000);
      }}
      onClose={()=>setView("dashboard")}
    />
  );

  if(view==="edit-offre"||view==="new-offre") return(
    <OffreEditor
      offre={editingOffre}
      prestataireId={active.id}
      onBack={()=>{setView("dashboard");setEditingOffre(null);}}
      onSaved={async()=>{await loadOffres(active.id);setView("dashboard");setEditingOffre(null);setToast({msg:"Offre sauvegardée ✅",type:"success"});setTimeout(()=>setToast(null),2500);}}
    />
  );

  const type=getTypeMetier(active.type_metier);

  return(
    <PrestPageShell onBack={dashTab==="offres"?onLogout:()=>setDashTab("offres")} backLabel={dashTab==="offres"?"Déconnexion":"← Offres"} onHome={onHome} bgColor={bgColor} headerColor={headerColor} topSlot={
      <div>
        {toast&&<div style={{background:toast.type==="success"?"rgba(34,197,94,0.15)":"rgba(0,102,255,0.1)",border:`1px solid ${toast.type==="success"?"rgba(34,197,94,0.4)":C.accent}`,borderRadius:10,padding:"8px 14px",marginBottom:8,color:toast.type==="success"?"#22c55e":C.accent,fontSize:13,fontWeight:600}}>{toast.msg}</div>}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <div style={{fontSize:28}}>{type.emoji}</div>
          <div style={{flex:1}}>
            <div style={{color:C.text,fontWeight:800,fontSize:16}}>{active.nom}</div>
            <div style={{color:C.muted,fontSize:12}}>{type.label} · {active.ville}</div>
          </div>
          <BoutonSuggestion nom={active.nom} type="prestataire"/>
        </div>
        <div style={{display:"flex",gap:8}}>
          {[{v:"offres",l:"🎯 Offres"},{v:"stats",l:"📊 Stats",locked:!planHasStats(active?.plan)},{v:"profil",l:"👤 Profil"}].map(t=>(
            <button key={t.v} onClick={()=>t.locked?null:setDashTab(t.v)}
              title={t.locked?"Disponible en plan Standard ou Premium":""}
              style={{flex:1,padding:"9px 0",borderRadius:10,border:`1px solid ${dashTab===t.v?C.accent:C.border}`,background:dashTab===t.v?C.accentSoft:t.locked?"rgba(107,114,128,0.05)":"transparent",color:dashTab===t.v?C.accent:t.locked?C.muted:C.muted,fontSize:11,fontWeight:dashTab===t.v?700:400,cursor:t.locked?"default":"pointer",fontFamily:"inherit",opacity:t.locked?0.5:1}}>
              {t.locked?"🔒 ":""}{t.l}
            </button>
          ))}

        </div>
      </div>
    }>
      <div style={{padding:"16px 20px"}}>

        {dashTab==="offres"&&(
          <div>
            <button onClick={()=>setView("scanner")}
              style={{width:"100%",padding:"16px",borderRadius:14,border:"none",background:"linear-gradient(135deg,#22C55E,#16A34A)",color:"white",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",marginBottom:12,boxShadow:"0 4px 16px rgba(34,197,94,0.4)",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
              <span style={{fontSize:22}}>📷</span>
              <span>Scanner le QR code étudiant</span>
            </button>
            <div style={{display:"flex",gap:10,marginBottom:16}}>
              {(()=>{
                const nbActives=offres.filter(o=>isOffreActive(o)).length;
                const maxO=planMaxOffres(active?.plan);
                const blocked=nbActives>=maxO;
                return(
                  <button onClick={()=>{if(!blocked){setEditingOffre(null);setView("new-offre");}}}
                    title={blocked?`Limite ${maxO} offres actives (plan ${getPlanInfo(active?.plan)?.name})`:""}
                    style={{flex:1,padding:"12px",borderRadius:14,border:"none",
                      background:blocked?"rgba(107,114,128,0.15)":"linear-gradient(135deg,#0066FF,#3399FF)",
                      color:blocked?"#6b7280":"white",fontSize:13,fontWeight:700,
                      cursor:blocked?"not-allowed":"pointer",fontFamily:"inherit",
                      boxShadow:blocked?"none":"0 3px 12px rgba(0,102,255,0.3)"}}>
                    {blocked?`🔒 Limite atteinte (${nbActives}/${maxO})`:"+  Nouvelle offre"}
                  </button>
                );
              })()}
            </div>

            {offres.length===0&&(
              <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
                <div style={{fontSize:48,marginBottom:12}}>🎯</div>
                <div style={{color:C.text,fontWeight:700,marginBottom:6}}>Aucune offre</div>
                <div style={{fontSize:13}}>Créez votre première offre promotionnelle</div>
              </div>
            )}
            {offres.map(o=>{
              const ot=getTypeMetier(o.type_offre);
              const nbVues=vuesMap[o.id]||0;
              const nbVisites=visites.filter(v=>v.offre_id===o.id).length;
              const nbImpressions=impressionsMap[o.id]||0;
              const conv=nbVues>0?Math.round(nbVisites/nbVues*100):0;
              return(
                <div key={o.id} style={{background:C.card,border:`1px solid ${o.active?"rgba(34,197,94,0.3)":C.border}`,borderRadius:14,padding:"14px 16px",marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <span style={{fontSize:24}}>{ot.emoji}</span>
                    <div style={{flex:1}}>
                      <div style={{color:C.text,fontWeight:700,fontSize:15}}>{o.titre}</div>
                      <div style={{color:C.muted,fontSize:12}}>{o.prix?`${o.prix}€ · `:""}{o.permanente?"Permanente":"Temporaire"}</div>
                    </div>
                    <div style={{display:"flex",gap:6,alignItems:"center"}}>
                      <div style={{textAlign:"center"}}>
                        <div style={{color:"#9CA3AF",fontWeight:700,fontSize:12}}>{impressionsMap[o.id]||0}</div>
                        <div style={{color:C.muted,fontSize:8}}>impr.</div>
                      </div>
                      <div style={{textAlign:"center"}}>
                        <div style={{color:C.muted,fontWeight:700,fontSize:12}}>{nbVues}</div>
                        <div style={{color:C.muted,fontSize:8}}>vues</div>
                      </div>
                      <div style={{textAlign:"center"}}>
                        <div style={{color:"#0066FF",fontWeight:800,fontSize:13}}>{nbVisites}</div>
                        <div style={{color:C.muted,fontSize:8}}>visit.</div>
                      </div>
                      {nbVues>0&&<div style={{textAlign:"center"}}>
                        <div style={{color:"#22c55e",fontWeight:700,fontSize:11}}>{conv}%</div>
                        <div style={{color:C.muted,fontSize:8}}>conv.</div>
                      </div>}
                    </div>
                    <div style={{background:isOffreActive(o)?"rgba(34,197,94,0.15)":"rgba(107,114,128,0.15)",color:isOffreActive(o)?"#22c55e":"#6b7280",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>
                      {isOffreActive(o)?"Active":"Expirée"}
                    </div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                    <div style={{background:C.accentSoft,color:C.accent,fontWeight:900,fontSize:16,padding:"4px 14px",borderRadius:20}}>-{o.promo_pct}%</div>
                    {!o.permanente&&o.date_fin&&<div style={{color:C.muted,fontSize:11}}>⏰ jusqu'au {fmtDate(o.date_fin)}</div>}
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>toggleOffre(o)}
                      style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${o.active?"rgba(239,68,68,0.3)":"rgba(34,197,94,0.3)"}`,background:o.active?"rgba(239,68,68,0.06)":"rgba(34,197,94,0.06)",color:o.active?"#ef4444":"#22c55e",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                      {o.active?"Désactiver":"Activer"}
                    </button>
                    <button onClick={()=>{setEditingOffre(o);setView("edit-offre");}}
                      style={{flex:1,padding:"8px 0",borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                      ✏️ Modifier
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {dashTab==="stats"&&(
          <div>
            {/* Vérif plan */}
            {!planHasStats(active?.plan)&&(
              <div style={{background:"linear-gradient(135deg,rgba(0,102,255,0.08),rgba(124,58,237,0.08))",border:"1px solid rgba(0,102,255,0.2)",borderRadius:16,padding:"24px 20px",textAlign:"center",marginBottom:16}}>
                <div style={{fontSize:40,marginBottom:12}}>🔒</div>
                <div style={{color:C.text,fontWeight:800,fontSize:16,marginBottom:6}}>Statistiques disponibles en Standard</div>
                <div style={{color:C.muted,fontSize:13,marginBottom:16,lineHeight:1.6}}>Passez en plan Standard pour accéder aux statistiques détaillées, historique mensuel et graphe d'activité.</div>
                <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                  <div style={{background:"#0066FF",color:"white",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700}}>Standard 39,90€/mois (annuel)</div>
                  <div style={{background:"#7C3AED",color:"white",padding:"6px 16px",borderRadius:20,fontSize:12,fontWeight:700}}>Premium 59,90€/mois (annuel)</div>
                </div>
              </div>
            )}
            {planHasStats(active?.plan)&&<>
            {/* Bouton actualiser */}
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}>
              <button onClick={async()=>{if(!active)return;await loadVisitesPrest(active.id);await loadVues(active.id);}}
                style={{padding:"7px 14px",borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.accent,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
                🔄 Actualiser
              </button>
            </div>

            {/* KPIs ligne 1 */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:8,marginBottom:16}}>
              {[
                {l:"Impr.",    v:Object.values(impressionsMap).reduce((s,n)=>s+n,0),                                          icon:"ti-eye",           color:"#9CA3AF"},
                {l:"Vues",     v:Object.values(vuesMap).reduce((s,n)=>s+n,0),                                                 icon:"ti-eye",           color:"#6B7280"},
                {l:"Honorées", v:visites.length,                                                                               icon:"ti-circle-check",  color:"#22C55E"},
                {l:"CA €",     v:visites.reduce((s,v)=>s+(v.montant_remise||0),0).toFixed(0)+"€",                             icon:"ti-currency-euro", color:"#F59E0B"},
                {l:"Éco. €",   v:visites.reduce((s,v)=>s+((v.montant_normal||0)-(v.montant_remise||0)),0).toFixed(0)+"€",    icon:"ti-currency-euro", color:"#22C55E"},
              ].map(s=>(
                <div key={s.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 6px",textAlign:"center"}}>
                  <i className={`ti ${s.icon}`} style={{fontSize:18,color:s.color,display:"block",marginBottom:3}}/>
                  <div style={{color:s.color,fontWeight:800,fontSize:20}}>{s.v}</div>
                  <div style={{color:C.muted,fontSize:9,marginTop:1}}>{s.l}</div>
                </div>
              ))}
            </div>

            {/* Historique mensuel — 3 lignes : vues / anonymes / comptes */}
            {(()=>{
              const moisAvecData=[];
              const now=new Date();
              for(let i=0;i<12;i++){
                const d=new Date(now.getFullYear(),now.getMonth()-i,1);
                const m=d.getMonth(),y=d.getFullYear();
                const label=d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
                const imp=(impressionsData||[]).filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
                const vues=vuesData.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
                const visAnon=visites.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y&&v.etudiant_anon_id;}).length;
                const visCompte=visites.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y&&!v.etudiant_anon_id;}).length;
                if(imp>0||vues>0||visAnon>0||visCompte>0||i===0) moisAvecData.push({label,imp,vues,visAnon,visCompte});
                else if(moisAvecData.length>0) break;
              }
              return moisAvecData.length>0&&(
                <div style={{marginBottom:16}}>
                  <div style={{color:C.sub,fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>Historique mensuel</div>
                  {/* En-tête colonnes */}
                  <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4}}>
                    {/* Légende */}
                    <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0,paddingTop:24,paddingRight:4}}>
                      <div style={{fontSize:9,color:"#E5E7EB",fontWeight:600,height:28,display:"flex",alignItems:"center",color:"#9CA3AF"}}>👁️ Impr.</div>
                      <div style={{fontSize:9,color:"#6B7280",fontWeight:600,height:28,display:"flex",alignItems:"center"}}>👁️ Vues</div>
                      <div style={{fontSize:9,color:"#9CA3AF",fontWeight:600,height:28,display:"flex",alignItems:"center"}}>€ Anon.</div>
                      <div style={{fontSize:9,color:"#22C55E",fontWeight:600,height:28,display:"flex",alignItems:"center"}}>€ Compte</div>
                    </div>
                    {/* Colonnes mois */}
                    {moisAvecData.map(({label,imp,vues,visAnon,visCompte})=>(
                      <div key={label} style={{flexShrink:0,minWidth:54,textAlign:"center"}}>
                        <div style={{color:C.sub,fontSize:10,fontWeight:700,marginBottom:4,height:20,display:"flex",alignItems:"center",justifyContent:"center"}}>{label}</div>
                        {[
                          {v:imp,bg:"rgba(229,231,235,0.5)",color:"#9CA3AF"},
                          {v:vues,bg:"rgba(107,114,128,0.1)",color:"#6B7280"},
                          {v:visAnon,bg:"rgba(156,163,175,0.12)",color:"#9CA3AF"},

/* ══ PHOTOS MANAGER OFFRE ═══════════════════════════ */
function OffrePhotosManager({offreId, photos, onUpdate}){
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState("");
  const MAX = 5;
  const list = Array.isArray(photos) ? photos : [];

  const compressAndUpload = async(file) => {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      img.onload = () => {
        const MAX_PX = 1200;
        let w = img.width, h = img.height;
        if(w > MAX_PX){ h = Math.round(h * MAX_PX / w); w = MAX_PX; }
        if(h > MAX_PX){ w = Math.round(w * MAX_PX / h); h = MAX_PX; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob) return reject(new Error("Compression échouée"));
          resolve(blob);
        }, "image/jpeg", 0.82);
      };
      img.onerror = () => reject(new Error("Image invalide"));
      reader.readAsDataURL(file);
    });
  };

  const handleFiles = async(files) => {
    setError(""); setUploading(true);
    try{
      let current = [...list];
      for(const file of Array.from(files)){
        if(current.length >= MAX){ setError(`Maximum ${MAX} photos`); break; }
        if(!file.type.startsWith("image/")) continue;
        const blob = await compressAndUpload(file);
        const path = `${offreId||"new"}/${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi,"_")}`;
        const {error:upErr} = await db().storage.from("siok-offer-photos").upload(path, blob, {contentType:"image/jpeg",upsert:false});
        if(upErr) throw new Error(upErr.message);
        const publicUrl = `${window.SUPABASE_URL}/storage/v1/object/public/siok-offer-photos/${path}`;
        current.push({url:publicUrl, path, ordre:current.length});
      }
      current = current.map((p,i)=>({...p,ordre:i}));
      if(offreId){
        await db().from("offres").update({photos:current}).eq("id",offreId);
      }
      onUpdate(current);
    }catch(e){ setError(e.message); }
    setUploading(false);
  };

  const remove = async(idx) => {
    if(!window.confirm("Supprimer cette photo ?")) return;
    setUploading(true);
    try{
      const p = list[idx];
      if(p.path) await db().storage.from("siok-offer-photos").remove([p.path]);
      const next = list.filter((_,i)=>i!==idx).map((x,i)=>({...x,ordre:i}));
      if(offreId) await db().from("offres").update({photos:next}).eq("id",offreId);
      onUpdate(next);
    }catch(e){ setError(e.message); }
    setUploading(false);
  };

  const move = async(idx, dir) => {
    const next = [...list];
    const swap = idx + dir;
    if(swap < 0 || swap >= next.length) return;
    [next[idx], next[swap]] = [next[swap], next[idx]];
    const reindexed = next.map((x,i)=>({...x,ordre:i}));
    if(offreId) await db().from("offres").update({photos:reindexed}).eq("id",offreId);
    onUpdate(reindexed);
  };

  return(
    <div style={{marginBottom:14}}>
      <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
        📸 Photos de l'offre ({list.length}/{MAX})
      </div>
      {list.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
          {list.map((p,i)=>(
            <div key={p.url} style={{display:"flex",alignItems:"center",gap:8,background:C.surface,borderRadius:10,padding:6,border:`1px solid ${C.border}`}}>
              <img src={p.url} alt="" onError={e=>e.target.style.display="none"} style={{width:64,height:46,objectFit:"cover",borderRadius:6,flexShrink:0}}/>
              <div style={{flex:1,color:C.sub,fontSize:11}}>{i===0?"⭐ Principale":"Photo "+(i+1)}</div>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>move(i,-1)} disabled={i===0||uploading} style={{width:26,height:26,borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,cursor:"pointer",fontSize:12,opacity:i===0?0.3:1}}>↑</button>
                <button onClick={()=>move(i,1)} disabled={i===list.length-1||uploading} style={{width:26,height:26,borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.sub,cursor:"pointer",fontSize:12,opacity:i===list.length-1?0.3:1}}>↓</button>
                <button onClick={()=>remove(i)} disabled={uploading} style={{width:26,height:26,borderRadius:6,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#ef4444",cursor:"pointer",fontSize:12}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {list.length < MAX && (
        <label style={{display:"block",border:`2px dashed ${C.accent}`,borderRadius:12,padding:"14px 0",textAlign:"center",cursor:"pointer",background:"rgba(0,102,255,0.04)"}}>
          <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>handleFiles(e.target.files)}/>
          <div style={{fontSize:24,marginBottom:4}}>📷</div>
          <div style={{color:C.accent,fontWeight:700,fontSize:12}}>{uploading?"Envoi…":"Ajouter des photos"}</div>
          <div style={{color:C.muted,fontSize:10,marginTop:2}}>JPG, PNG · max 500ko · {MAX-list.length} restant{MAX-list.length>1?"s":""}</div>
        </label>
      )}
      {error&&<div style={{color:"#ef4444",fontSize:11,marginTop:4}}>⚠️ {error}</div>}
    </div>
  );
}

/* ══ HELPERS DATES OFFRE ═════════════════════════════ */
function toLocalDateTimeInput(d){
  if(!d)return "";
  const dt=new Date(d);
  const pad=n=>String(n).padStart(2,"0");
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}
function defaultDebut(){ return toLocalDateTimeInput(new Date()); }
function defaultFin(){
  const d=new Date(); d.setHours(d.getHours()+2); return toLocalDateTimeInput(d);
}
function maxFin(debut){
  if(!debut)return "";
  const maxJ=window.SIOK_PARAMS?.duree_max_offre_jours||7;
  const d=new Date(debut); d.setDate(d.getDate()+maxJ); return toLocalDateTimeInput(d);
}
function prixRemise(prixNormal,pct){
  if(!prixNormal||!pct)return null;
  return Math.round(parseFloat(prixNormal)*(1-pct/100)*100)/100;
}

/* ══ ÉDITEUR D'OFFRE ═════════════════════════════════ */
function OffreEditor({offre,prestataireId,onBack,onSaved}){
  const isNew=!offre;
  const now=new Date();
  const [form,setForm]=useState({
    titre:offre?.titre||"",
    description:offre?.description||"",
    type_offre:offre?.type_offre||"",
    prix_normal:offre?.prix_normal||"",
    mode_remise:offre?.mode_remise||"pct", // pct | fixe
    promo_pct:offre?.promo_pct||10,
    prix:offre?.prix||"", // prix final remisé
    menu_url:offre?.menu_url||"",
    date_debut:offre?.date_debut?toLocalDateTimeInput(offre.date_debut):defaultDebut(),
    date_fin:offre?.date_fin?toLocalDateTimeInput(offre.date_fin):defaultFin(),
  });
  const [photos,setPhotos]=useState(Array.isArray(offre?.photos)?offre.photos:[]);
  const [savedId,setSavedId]=useState(offre?.id||null);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [typeSearch,setTypeSearch]=useState("");

  // Calcul prix remisé auto
  const prixCalcule=form.mode_remise==="pct"
    ?prixRemise(form.prix_normal,form.promo_pct)
    :(form.prix?parseFloat(form.prix):null);

  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  // Validation date fin max 1 semaine
  const handleDateFin=(v)=>{
    const max=maxFin(form.date_debut);
    if(max&&v>max){
      setError("La durée maximum est 1 semaine.");
      F("date_fin",max);
    }else{
      setError("");
      F("date_fin",v);
    }
  };

  const handleDateDebut=(v)=>{
    F("date_debut",v);
    // Recalculer fin par défaut = début + 2h
    const d=new Date(v); d.setHours(d.getHours()+2);
    F("date_fin",toLocalDateTimeInput(d));
  };

  const save=async()=>{
    if(!form.titre)return setError("Le titre est obligatoire");
    if(!form.type_offre)return setError("Le type d'offre est obligatoire");
    if(!form.date_debut||!form.date_fin)return setError("Les dates sont obligatoires");
    const debut=new Date(form.date_debut);
    const fin=new Date(form.date_fin);
    if(fin<=debut)return setError("La date de fin doit être après la date de début");
    const diffDays=(fin-debut)/(1000*60*60*24);
    const maxJours=window.SIOK_PARAMS?.duree_max_offre_jours||7;
    if(diffDays>maxJours)return setError(`La durée ne peut pas dépasser ${maxJours} jour${maxJours>1?"s":""}`);

    setSaving(true);setError("");
    try{
      const prixFinal=form.mode_remise==="pct"
        ?prixRemise(form.prix_normal,form.promo_pct)
        :(form.prix?parseFloat(form.prix):null);

      const payload={
        titre:form.titre,
        description:form.description||null,
        type_offre:form.type_offre,
        prix_normal:form.prix_normal?parseFloat(form.prix_normal):null,
        mode_remise:form.mode_remise,
        promo_pct:form.promo_pct,
        prix:prixFinal,
        menu_url:form.menu_url||null,
        date_debut:debut.toISOString(),
        date_fin:fin.toISOString(),
        permanente:false,
        active:true,
        prestataire_id:prestataireId,
        photos:photos,
      };
      if(isNew){
        const {data:inserted,error:err}=await db().from("offres").insert(payload).select("id").single();
        if(err)throw err;
        setSavedId(inserted.id);
      }else{
        const {error:err}=await db().from("offres").update(payload).eq("id",offre.id);
        if(err)throw err;
      }
      onSaved();
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  const allTypes=getTypesMetier();
  const filteredTypes=typeSearch
    ?allTypes.filter(t=>t.label.toLowerCase().includes(typeSearch.toLowerCase())||t.categorie?.toLowerCase().includes(typeSearch.toLowerCase()))
    :allTypes;
  const selectedType=allTypes.find(t=>t.id===form.type_offre);

    <PrestPageShell onBack={onBack} backLabel="← Mes offres" stickyHeader={false}>

        <FInput label="Titre de l'offre" value={form.titre} onChange={v=>F("titre",v)} placeholder="Ex: Coupe étudiant, Repas du jour…" required={true}/>
        <FInput label="Description (optionnel)" value={form.description} onChange={v=>F("description",v)} placeholder="Décrivez votre offre…"/>
        <FInput label="URL détail (optionnel)" value={form.menu_url} onChange={v=>F("menu_url",v)} placeholder="https://…"/>

          <div style={{maxHeight:180,overflowY:"auto",background:C.surface,borderRadius:10,border:`1px solid ${C.border}`}}>

        <div style={{marginBottom:14}}>
          <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>
            Période de l'offre * <span style={{color:C.muted,fontWeight:400,fontSize:10,letterSpacing:0}}>(max 1 semaine)</span>
          </div>
          <div style={{display:"flex",gap:10}}>
            <div style={{flex:1}}>
              <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Début</div>
              <input type="datetime-local" value={form.date_debut} onChange={e=>handleDateDebut(e.target.value)}
                style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
            </div>
            <div style={{flex:1}}>
              <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Fin</div>
              <input type="datetime-local" value={form.date_fin}
                min={form.date_debut}
                max={maxFin(form.date_debut)}
                onChange={e=>handleDateFin(e.target.value)}
                style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:12,fontFamily:"inherit",outline:"none"}}/>
            </div>
          </div>
          {form.date_debut&&form.date_fin&&(()=>{
            const debut=new Date(form.date_debut);
            const fin=new Date(form.date_fin);
            const diff=(fin-debut)/(1000*60*60);
            const jours=Math.floor(diff/24);
            const heures=Math.round(diff%24);
            return diff>0&&<div style={{color:C.muted,fontSize:11,marginTop:6}}>
              ⏱️ Durée : {jours>0?`${jours}j `:""}{ heures>0?`${heures}h`:""} 
              {diff>168&&<span style={{color:"#ef4444",fontWeight:700}}> ⚠️ Dépasse 1 semaine</span>}
            </div>;
          })()}
        </div>

        {/* Photos */}
        <OffrePhotosManager offreId={savedId} photos={photos} onUpdate={setPhotos}/>

        {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:10,padding:"10px 14px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}

        <Btn onClick={save} loading={saving}>
          {isNew?"Créer l'offre":"Sauvegarder les modifications"}
        </Btn>
      </div>
    </PrestPageShell>
  );
}

/* ══ ROOT ════════════════════════════════════════════ */
function App(){
  // Restaurer session depuis localStorage
  const savedEt=(()=>{try{const s=localStorage.getItem("stu10_etudiant");return s?JSON.parse(s):null;}catch(e){return null;}})();
  const savedScreen=(()=>{try{return localStorage.getItem("stu10_screen")||"explorer";}catch(e){return "explorer";}})();

  const [screen,setScreen]=useState(savedEt?savedScreen:"explorer");
  const [user,setUser]=useState(null);
  const [etudiant,setEtudiant]=useState(savedEt);
  const [resetMode,setResetMode]=useState(false);

  // Persister étudiant + screen à chaque changement
  const setEtudiantPersist=(et)=>{
    setEtudiant(et);
    try{
      if(et) localStorage.setItem("stu10_etudiant",JSON.stringify(et));
      else { localStorage.removeItem("stu10_etudiant"); localStorage.removeItem("stu10_screen"); }
    }catch(e){}
  };

  const setScreenPersist=(s)=>{
    setScreen(s);
    try{ localStorage.setItem("stu10_screen",s); }catch(e){}
  };

  useEffect(()=>{
    // Gérer le code PKCE dans l'URL (nouveau flow Supabase)
    const params=new URLSearchParams(window.location.search);
    const hashParams=new URLSearchParams(window.location.hash.replace("#",""));
    const code=params.get("code");
    const type=params.get("type")||hashParams.get("type");
    const errorDesc=params.get("error_description")||hashParams.get("error_description");

    if(errorDesc){
      console.warn("Auth error:",errorDesc);
      window.history.replaceState(null,"",window.location.pathname);
      return;
    }

    if(code){
      db().auth.exchangeCodeForSession(code).then(({data,error})=>{
        if(!error&&data?.session){
          setResetMode(true);
        }
        window.history.replaceState(null,"",window.location.pathname);
      });
      return;
    }

    // Ancien flow hash
    if(type==="recovery"||hashParams.get("access_token")){
      db().auth.getSession().then(({data:{session}})=>{
        if(session) setResetMode(true);
      });
      window.history.replaceState(null,"",window.location.pathname);
    }

    // Écouter PASSWORD_RECOVERY
    const {data:{subscription}}=db().auth.onAuthStateChange((event)=>{
      if(event==="PASSWORD_RECOVERY") setResetMode(true);
    });
    return ()=>subscription.unsubscribe();
  },[]);

  // Écran réinitialisation mot de passe
  if(resetMode) return(
    <div style={{minHeight:"100vh",background:CS.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#FFFFFF",borderRadius:24,padding:"32px 24px",width:"100%",maxWidth:360,textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>🔒</div>
        <div style={{color:CS.text,fontSize:20,fontWeight:800,marginBottom:4}}>Nouveau mot de passe</div>
        <div style={{color:CS.muted,fontSize:13,marginBottom:20}}>Choisissez votre nouveau mot de passe</div>
        <ChangePassword onClose={async()=>{
          await db().auth.signOut();
          setResetMode(false);
          setScreen("auth");
          window.location.hash="";
        }}/>
      </div>
    </div>
  );

  // Écran explorateur = carte non connectée (premier écran)
  if(screen==="explorer") return(
    <MapExplorer
      onConnecte={()=>setScreen("auth")}
      onPrestataire={()=>setScreen("prestataire-login")}
    />
  );

  // Auth étudiant
  if(screen==="auth") return(
    <EtudiantDashboard
      onBack={()=>setScreenPersist("explorer")}
      onConnecte={(e)=>{setEtudiantPersist(e);setScreenPersist("etudiant-app");}}
    />
  );

  // App étudiant connecté
  if(screen==="etudiant-app") return(
    <EtudiantApp
      etudiant={etudiant}
      onLogout={()=>{setEtudiantPersist(null);setScreenPersist("explorer");}}
      onHome={()=>setScreenPersist("etudiant-app")}
    />
  );

  // Prestataire
  if(screen==="prestataire-login") return(
    <PrestataireLogin
      onSuccess={(u)=>{setUser(u);setScreen("prestataire-dashboard");}}
      onBack={()=>setScreenPersist("explorer")}
    />
  );

  if(screen==="prestataire-dashboard") return(
    <PrestataireDashboard
      user={user}
      onLogout={()=>{setUser(null);setScreenPersist("explorer");}}
      onHome={()=>setScreenPersist("explorer")}
    />
  );

  return <MapExplorer onConnecte={()=>setScreen("auth")} onPrestataire={()=>setScreen("prestataire-login")}/>;
}

function mountApp(){
  const loader=document.getElementById("splash-loader");
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);
  if(loader){
    loader.style.transition="opacity 0.5s";
    loader.style.opacity="0";
    setTimeout(()=>loader.style.display="none",600);
  }
}
