  const [partenaires,setPartenaires]=useState([]);
  const [selected,setSelected]=useState(null); // {palier, partenaire}
  const [loading,setLoading]=useState(false);
  const [bonCode,setBonCode]=useState(null);
  const [error,setError]=useState("");

  useEffect(()=>{
    db().from("partenaires_cadeaux").select("*").eq("actif",true).order("nom")
      .then(({data})=>{ if(data) setPartenaires(data); });
  },[]);

  const palierDispo=(p)=>totalPoints>=p.pts;

  const genCode=()=>{
    const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code="STU-";
    for(let i=0;i<8;i++){
      if(i===4) code+="-";
      code+=chars[Math.floor(Math.random()*chars.length)];
    }
    return code;
  };

  const reclamer=async()=>{
    if(!selected) return setError("Choisissez un partenaire et un palier");
    setLoading(true);setError("");
    try{
      const code=genCode();
      const {error:e}=await db().from("bons_cadeaux").insert({
        etudiant_id:etudiant.id,
        partenaire_id:selected.partenaire.id,
        montant:selected.palier.montant,
        points_utilises:selected.palier.pts,
        code:code,
        statut:"en_attente",
      });
      if(e) throw new Error(e.message);
      setBonCode(code);
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:2900,display:"flex",flexDirection:"column",justifyContent:"flex-end",paddingBottom:64}}
      onClick={onClose}>
      <div style={{background:"#FFFFFF",borderRadius:"24px 24px 0 0",width:"100%",maxWidth:480,alignSelf:"center",display:"flex",flexDirection:"column",maxHeight:"85vh"}}
        onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{padding:"20px 24px 0",flexShrink:0,position:"relative"}}>
          <button onClick={onClose} style={{position:"absolute",top:16,right:16,width:32,height:32,borderRadius:"50%",border:"none",background:"#F0F0F0",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          <div style={{fontWeight:900,fontSize:18,color:"#1A1A2E",marginBottom:4}}>🎁 Mes cadeaux</div>
          <div style={{display:"inline-flex",alignItems:"center",gap:6,background:"linear-gradient(135deg,#F59E0B,#FBBF24)",borderRadius:50,padding:"4px 14px",marginBottom:12}}>
            <span style={{color:"white",fontWeight:900,fontSize:16}}>{totalPoints} ⭐</span>
            <span style={{color:"rgba(255,255,255,0.8)",fontSize:12}}>points disponibles</span>
          </div>
        </div>

        <div style={{overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"8px 24px 24px",flex:1}}>

          {bonCode?(
            /* Confirmation */
            <div style={{textAlign:"center",padding:"16px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>🎉</div>
              <div style={{fontWeight:900,fontSize:18,color:"#1A1A2E",marginBottom:8}}>Demande envoyée !</div>
              <div style={{background:"#F0F6FF",borderRadius:14,padding:"16px",marginBottom:12}}>
                <div style={{color:"#6B7280",fontSize:12,marginBottom:6}}>Ton code de bon cadeau</div>
                <div style={{fontFamily:"monospace",fontWeight:900,fontSize:22,color:"#0066FF",letterSpacing:2}}>{bonCode}</div>
                <div style={{color:"#6B7280",fontSize:11,marginTop:8,lineHeight:1.5}}>Présente ce code à l'admin pour validation.<br/>Tes points seront déduits après validation.</div>
              </div>
              <div style={{background:"#FEF3C7",borderRadius:10,padding:"10px 14px",fontSize:12,color:"#92400E"}}>
                ⏳ En attente de validation — tu recevras une confirmation
              </div>
            </div>
          ):(
            <>
              {/* Paliers */}
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:14,color:"#1A1A2E",marginBottom:10}}>Choisis ton bon cadeau</div>
                {PALIERS.map(p=>{
                  const dispo=palierDispo(p);
                  const sel=selected?.palier?.pts===p.pts;
                  return(
                    <div key={p.pts} onClick={()=>dispo&&setSelected(s=>s?.palier?.pts===p.pts?null:{...s,palier:p})}
                      style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                        padding:"12px 14px",borderRadius:12,marginBottom:8,cursor:dispo?"pointer":"not-allowed",
                        background:sel?"rgba(0,102,255,0.06)":"#F8F8F8",
                        border:`1.5px solid ${sel?"#0066FF":dispo?"#E5E7EB":"#F0F0F0"}`,
                        opacity:dispo?1:0.45,transition:"all 0.15s"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14,color:"#1A1A2E"}}>{p.label}</div>
                        <div style={{color:"#9CA3AF",fontSize:12}}>{p.pts} points requis</div>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        {!dispo&&<span style={{fontSize:11,color:"#9CA3AF"}}>il manque {p.pts-totalPoints} pts</span>}
                        <div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${sel?"#0066FF":"#D1D5DB"}`,background:sel?"#0066FF":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                          {sel&&<span style={{color:"white",fontSize:12}}>✓</span>}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Partenaires */}
              {selected?.palier&&(
                <div style={{marginBottom:16}}>
                  <div style={{fontWeight:700,fontSize:14,color:"#1A1A2E",marginBottom:10}}>Choisis un partenaire</div>
                  {partenaires.length===0
                    ?<div style={{color:"#9CA3AF",fontSize:13,textAlign:"center",padding:"20px 0"}}>Aucun partenaire disponible</div>
                    :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                      {partenaires.map(p=>{
                        const sel=selected?.partenaire?.id===p.id;
                        return(
                          <div key={p.id} onClick={()=>setSelected(s=>({...s,partenaire:sel?null:p}))}
                            style={{padding:"12px",borderRadius:12,textAlign:"center",cursor:"pointer",
                              background:sel?"rgba(0,102,255,0.06)":"#F8F8F8",
                              border:`1.5px solid ${sel?"#0066FF":"#E5E7EB"}`,transition:"all 0.15s"}}>
                            <div style={{fontSize:28,marginBottom:4}}>{p.emoji}</div>
                            <div style={{fontWeight:700,fontSize:12,color:sel?"#0066FF":"#1A1A2E"}}>{p.nom}</div>
                          </div>
                        );
                      })}
                    </div>
                  }
                </div>
              )}

              {error&&<div style={{color:"#EF4444",fontSize:12,marginBottom:8,textAlign:"center"}}>{error}</div>}

              {/* Bouton réclamer */}
              <button onClick={reclamer} disabled={!selected?.palier||!selected?.partenaire||loading}
                style={{width:"100%",padding:"14px",borderRadius:14,border:"none",
                  background:selected?.palier&&selected?.partenaire?"linear-gradient(135deg,#0066FF,#3399FF)":"#E5E7EB",
                  color:selected?.palier&&selected?.partenaire?"white":"#9CA3AF",
                  fontSize:14,fontWeight:800,cursor:selected?.palier&&selected?.partenaire?"pointer":"default",fontFamily:"inherit"}}>
                {loading?"...":"🎁 Réclamer mon bon cadeau"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function EtudiantApp({etudiant,onLogout,onHome}){
  const [tab,setTab]=useState("offres");
  const [viewMode,setViewMode]=useState("list");
  const [userLocation,setUserLocation]=useState(null);
  const [city,setCity]=useState("annecy");
  const [filterCat,setFilterCat]=useState(null);
  const [filterType,setFilterType]=useState(null);
  const [tri,setTri]=useState("distance");
  const [selected,setSelected]=useState(null);
  const selectedRef=useRef(null);
  const [showProfile,setShowProfile]=useState(false);
  const [showChangePwd,setShowChangePwd]=useState(false);
  const [profileTab,setProfileTab]=useState("Détails");
  const [showSuggestion,setShowSuggestion]=useState(false);
  const [showCadeaux,setShowCadeaux]=useState(false);
  const [search,setSearch]=useState("");
  const [fondPerso,setFondPerso]=useState(()=>{try{return localStorage.getItem("stu10_fond_etudiant")||null;}catch(e){return null;}});
  const [drillKpi,setDrillKpi]=useState(null);

  // Recharger visites quand onglet Mes points ouvert
  useEffect(()=>{
    if(profileTab==="Mes points") loadVisites();
  },[profileTab]);
  const [vuesEtudiant,setVuesEtudiant]=useState([]);
  const [showReco,setShowReco]=useState(false);
  const [favoris,setFavoris]=useState([]);
  const [favIds,setFavIds]=useState(new Set());
  const [favLoading,setFavLoading]=useState(false);
  const [showQR,setShowQR]=useState(false);
  const [qrOffre,setQrOffre]=useState(null);
  const [visites,setVisites]=useState([]);
  const [vuesMap,setVuesMap]=useState({});
  const [vuesData,setVuesData]=useState([]);
  const [impressionsMap,setImpressionsMap]=useState({});
  const [impressionsData,setImpressionsData]=useState([]); // vues avec dates pour le graphe
  const [showModal,setShowModal]=useState(false);
  const {offres,loading}=useOffres(city,userLocation);

  useEffect(()=>{
    navigator.geolocation?.getCurrentPosition(p=>setUserLocation({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{});
    loadFavoris();
    loadVisites();
    loadVuesEtudiant();
  },[]);

  const loadVisites=async()=>{
    if(!etudiant)return;
    const {data}=await db().from("visites")
      .select("*, offres(titre,prix,promo_pct,type_offre,prestataire_id), prestataires(nom)")
      .eq("etudiant_id",etudiant.id)
      .order("created_at",{ascending:false})
      .limit(50);
    if(data) setVisites(data);
  };

  const loadVuesEtudiant=async()=>{
    if(!etudiant?.id) return;
    try{
      const {data}=await db().from("vues_offres").select("offre_id").eq("etudiant_id",etudiant.id);
      if(data) setVuesEtudiant(data);
    }catch(e){}
  };

  const loadFavoris=async()=>{
    if(!etudiant)return;
    setFavLoading(true);
    try{
      const {data}=await db().from("favoris").select("offre_id").eq("etudiant_id",etudiant.id);
      if(data) setFavIds(new Set(data.map(f=>f.offre_id)));
    }catch(e){console.error(e);}
    setFavLoading(false);
  };

  const toggleFavori=async(offre)=>{
    if(!etudiant)return;
    const isFav=favIds.has(offre.id);
    if(isFav){
      await db().from("favoris").delete().eq("etudiant_id",etudiant.id).eq("offre_id",offre.id);
      setFavIds(s=>{const n=new Set(s);n.delete(offre.id);return n;});
    }else{
      await db().from("favoris").insert({etudiant_id:etudiant.id,offre_id:offre.id});
      setFavIds(s=>new Set([...s,offre.id]));
    }
  };

  const filtered=offres.filter(o=>{
    if(filterType) return o.type_offre===filterType;
    if(filterCat){
      const cat=buildCategoriesOffre().find(c=>c.id===filterCat);
      if(cat&&!cat.types.includes(o.type_offre)) return false;
    }
    if(search&&search.trim()){
      const q=search.trim().toLowerCase();
      const type=getTypeMetier(o.type_offre);
      const cat=getCategorieForType(o.type_offre);
      return (o.titre||"").toLowerCase().includes(q)
        ||(o.prestataire_nom||"").toLowerCase().includes(q)
        ||(type?.label||"").toLowerCase().includes(q)
        ||(cat?.label||"").toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b)=>{
    if(tri==="remise"||tri==="remisePct") return (b.promo_pct||0)-(a.promo_pct||0);
    if(!userLocation) return 0;
    return distanceM(userLocation.lat,userLocation.lng,a.lat||0,a.lng||0)-distanceM(userLocation.lat,userLocation.lng,b.lat||0,b.lng||0);
  });
  const offresAffichees=tab==="favoris"?offres.filter(o=>favIds.has(o.id)):filtered;
  const totalPoints=(()=>{
    try{const s=localStorage.getItem("stu10_etudiant");if(s){const e=JSON.parse(s);return e.points||0;}}catch(ex){}
    return etudiant?.points||0;
  })();

  return(
    <div data-ea-fond style={{minHeight:"100vh",background:fondPerso||(window.SIOK_PARAMS?.fond_couleur||"#F5F5F5"),display:"flex",flexDirection:"column"}}>
      {/* Header blanc */}
      <div data-siok-header style={{background:"#FFFFFF",boxShadow:"0 2px 8px rgba(0,0,0,0.06)",padding:"env(safe-area-inset-top, 12px) 12px 10px",position:"sticky",top:0,zIndex:100}}>
        {tab==="offres"&&(
          <NavFiltres nbOffres={filtered.filter(o=>o.active!==false).length}
            tri={tri} setTri={setTri} showReco={showReco} setShowReco={setShowReco}
            filterCat={filterCat} setFilterCat={setFilterCat}
            filterType={filterType} setFilterType={setFilterType}
            offres={offres} showPerso={true}
            search={search} setSearch={setSearch}/>
        )}
      </div>

      {/* Drill KPI Favoris */}
      {drillKpi==="favoris"&&(
        <div style={{background:"#FFFFFF",borderRadius:16,margin:"8px 16px 0",padding:16,border:`1px solid ${CS.border}`,zIndex:40,position:"relative"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{color:CS.text,fontWeight:700,fontSize:14}}>❤️ Mes favoris ({favIds.size})</div>
            <button onClick={()=>setDrillKpi(null)} style={{padding:"3px 10px",borderRadius:8,border:`1px solid ${CS.border}`,background:"transparent",color:CS.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
          </div>
          {offres.filter(o=>favIds.has(o.id)).map(o=>{
            const cat=getCategorieForType(o.type_offre);
            return(
              <div key={o.id} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${CS.border}`}}>
                {cat?.icon?<i className={`ti ${cat.icon}`} style={{fontSize:18,color:cat.color,flexShrink:0}}/>:<span style={{fontSize:18}}>{cat?.emoji}</span>}
                <div style={{flex:1}}>
                  <div style={{color:CS.text,fontWeight:600,fontSize:13}}>{o.titre}</div>
                  <div style={{color:CS.muted,fontSize:11}}>{o.prestataire_nom}</div>
                </div>
                <span style={{color:"#EF4444",fontWeight:800,fontSize:13}}>-{o.promo_pct}%</span>
              </div>
            );
          })}
          {favIds.size===0&&<div style={{color:CS.muted,fontSize:13,textAlign:"center",padding:"12px 0"}}>Aucun favori — cliquez sur ❤️ dans une offre</div>}
        </div>
      )}

      {/* Drill KPI Points */}
      {drillKpi==="points"&&(
        <div style={{background:"#FFFFFF",borderRadius:16,margin:"8px 16px 0",padding:16,border:`1px solid ${CS.border}`,zIndex:40,position:"relative"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{color:CS.text,fontWeight:700,fontSize:14}}>⭐ Mes points ({totalPoints})</div>
            <button onClick={()=>setDrillKpi(null)} style={{padding:"3px 10px",borderRadius:8,border:`1px solid ${CS.border}`,background:"transparent",color:CS.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
          </div>
          <div style={{background:"rgba(245,158,11,0.08)",borderRadius:12,padding:"10px 14px",marginBottom:8}}>
            <div style={{color:"#F59E0B",fontWeight:900,fontSize:24}}>{totalPoints} ⭐</div>
            <div style={{color:CS.muted,fontSize:12,marginTop:2}}>+1 par visite · +2 avis · +2 photo</div>
          </div>
          {(()=>{
            const now=new Date();
            const moisCourant=now.getMonth(), annee=now.getFullYear();
            const moisPrec=moisCourant===0?11:moisCourant-1;
            const anneePrec=moisCourant===0?annee-1:annee;
            const eco=(vlist)=>vlist.reduce((s,v)=>s+((v.montant_normal||0)-(v.montant_remise||0)),0);
            const visMois=visites.filter(v=>{const d=new Date(v.created_at);return d.getMonth()===moisCourant&&d.getFullYear()===annee;});
            const visPrec=visites.filter(v=>{const d=new Date(v.created_at);return d.getMonth()===moisPrec&&d.getFullYear()===anneePrec;});
            const ecoMois=eco(visMois);
            const ecoPrec=eco(visPrec);
            const ecoTotal=eco(visites);
            const nomMois=now.toLocaleDateString("fr-FR",{month:"long"});
            const nomPrec=new Date(anneePrec,moisPrec,1).toLocaleDateString("fr-FR",{month:"long"});
            return(
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                {[
                  {label:`💰 Ce mois (${nomMois})`, val:ecoMois, color:"#22C55E"},
                  {label:`📅 Mois dernier (${nomPrec})`, val:ecoPrec, color:"#3B82F6"},
                  {label:"🏆 Total économisé", val:ecoTotal, color:"#F59E0B"},
                ].map(({label,val,color})=>(
                  <div key={label} style={{background:`${color}0D`,borderRadius:10,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{color:CS.muted,fontSize:12}}>{label}</span>
                    <span style={{color,fontWeight:800,fontSize:15}}>{val>0?`${val.toFixed(2)}€`:"—"}</span>
                  </div>
                ))}
              </div>
            );
          })()}
          {visites.slice(0,8).map(v=>(
            <div key={v.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${CS.border}`}}>
              <div>
                <div style={{color:CS.text,fontWeight:600,fontSize:12}}>{v.offres?.titre||"Offre"}</div>
                <div style={{color:CS.muted,fontSize:10}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div>
              </div>
              <span style={{color:"#F59E0B",fontWeight:700}}>+{v.points||0}⭐</span>
            </div>
          ))}
        </div>
      )}

      {/* Contenu */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Carte plein écran */}
        {viewMode==="map"&&(
          <MapContainer offres={offresAffichees} selected={selected}
            onSelect={setSelected} city={city} userLocation={userLocation}/>
        )}
        <div data-ea-list style={{display:viewMode==="list"||tab!=="offres"?"flex":"none",flexDirection:"column",flex:1,overflowY:"auto",paddingBottom:20}}>

        {/* Loading */}
        {loading&&(
          <div style={{textAlign:"center",padding:"40px 0",color:CS.muted}}>
            <div style={{width:32,height:32,border:"3px solid #E8E8E8",borderTopColor:CS.accent,borderRadius:"50%",margin:"0 auto 12px",animation:"spin 0.8s linear infinite"}}/>
            Chargement…
          </div>
        )}

        {/* Liste */}
        {!loading&&viewMode==="list"&&(tab==="offres"||tab==="favoris")&&!drillKpi&&(
          <div style={{padding:"12px 16px 0"}}>

            {/* Recommandations Populaires — exclusif */}
            {tab==="offres"&&showReco==="pop"&&(
              <TopOffresParCategorie offres={offres} userLocation={userLocation}
                onSelect={o=>{setSelected(o);setShowReco(false);}}/>
            )}
            {/* Recommandations Pour toi — exclusif */}
            {tab==="offres"&&showReco==="perso"&&(
              <RecommandationsPerso offres={offres} etudiant={etudiant} visites={visites} vues={vuesEtudiant}/>
            )}
            {/* Compteur offres — comme anonyme */}
            {!showReco&&tab==="offres"&&offresAffichees.length>0&&(
              <div style={{marginBottom:12,paddingLeft:4}}>
                <span style={{fontSize:13,fontWeight:700,color:"#1A1A2E",background:"rgba(255,255,255,0.85)",padding:"2px 10px",borderRadius:20}}>{offresAffichees.length} offre{offresAffichees.length>1?"s":""} disponible{offresAffichees.length>1?"s":""}</span>
              </div>
            )}
            {/* Liste normale masquée si showReco actif */}
            {!showReco&&offresAffichees.length===0&&(
              <div style={{textAlign:"center",padding:"48px 20px",color:CS.muted}}>
                <div style={{fontSize:48,marginBottom:12}}>{tab==="favoris"?"❤️":"🎯"}</div>
                <div style={{color:CS.text,fontWeight:700,fontSize:15,marginBottom:6}}>
                  {tab==="favoris"?"Aucun favori":"Aucune offre disponible"}
                </div>
                <div style={{fontSize:13}}>{tab==="favoris"?"Sauvegardez des offres depuis la liste":"Essayez une autre ville"}</div>
              </div>
            )}
            {/* Grille 2 colonnes */}
            {!showReco&&offresAffichees.length>0&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,paddingBottom:8}}>
                {offresAffichees.map(o=>{
              const type=getTypeMetier(o.type_offre);
              const isFav=favIds.has(o.id);
              return(
                <div key={o.id} onClick={()=>{setSelected(o);trackVue(o.id,etudiant?.id||null);}}
                  style={{background:"#FFFFFF",borderRadius:16,overflow:"hidden",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column"}}>
                  <div style={{position:"relative",flexShrink:0}}>
                    <PhotoCarousel photos={o.photos} height={120} emoji={type.emoji} gradient={bannerGradient(o.type_offre)}/>
                    <div style={{position:"absolute",top:8,right:8,background:"#EF4444",color:"white",fontSize:12,fontWeight:900,padding:"3px 10px",borderRadius:50,zIndex:3}}>
                      -{o.promo_pct}%
                    </div>
                    <button onClick={e=>{e.stopPropagation();toggleFavori(o);}}
                      style={{position:"absolute",top:8,left:8,width:28,height:28,borderRadius:"50%",background:"rgba(255,255,255,0.9)",border:"1.5px solid rgba(0,0,0,0.25)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,zIndex:3}}>
                      {isFav?"❤️":"🤍"}
                    </button>
                  </div>
                  <div style={{padding:"8px 10px 10px",flex:1,display:"flex",flexDirection:"column",gap:3}}>
                    <div style={{color:CS.text,fontWeight:800,fontSize:13,lineHeight:1.3}}>{o.titre}</div>
                    <div style={{color:CS.muted,fontSize:11}}>{o.prestataire_nom}</div>
                    <div style={{display:"flex",alignItems:"center",gap:4,marginTop:2,flexWrap:"wrap"}}>
                      {o.prix&&<span style={{color:"#22C55E",fontWeight:900,fontSize:14}}>{parseFloat(o.prix).toFixed(2)}€</span>}
                      {o.prix_normal&&<span style={{color:"#C0C0C0",fontSize:11,textDecoration:"line-through"}}>{parseFloat(o.prix_normal).toFixed(2)}€</span>}
                    </div>

/* ══ AVIS OFFRE — notes + avis + photos ═════════════ */
function AvisOffre({offreId, nbAvis}){
  const [avis, setAvis] = useState([]);
  const [loading, setLoading] = useState(false);
  const [open, setOpen] = useState(false);

  const load = async()=>{
    if(loading||avis.length>0) return;
    setLoading(true);
    const {data}=await db().from("visites")
      .select("id,note,avis,photo_url,created_at,etudiants(prenom)")
      .eq("offre_id",offreId)
      .not("note","is",null)
      .order("created_at",{ascending:false})
      .limit(20);
    if(data) setAvis(data);
    setLoading(false);
  };

  if(!nbAvis||nbAvis===0) return null;

  return(
    <div style={{marginTop:8,marginBottom:12}}>
      <button onClick={()=>{setOpen(!open);if(!open)load();}}
        style={{width:"100%",padding:"10px 14px",borderRadius:12,border:"1.5px solid #E5E7EB",background:"#F8F8F8",cursor:"pointer",fontFamily:"inherit",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"#1A1A2E",fontWeight:700,fontSize:13}}>💬 Voir les avis ({nbAvis})</span>
        <span style={{color:"#9CA3AF",fontSize:14}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:10}}>
          {loading&&<div style={{textAlign:"center",padding:"16px 0",color:"#9CA3AF",fontSize:13}}>Chargement…</div>}
          {avis.map(v=>(
            <div key={v.id} style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontWeight:700,fontSize:13,color:"#1A1A2E"}}>{v.etudiants?.prenom||"Étudiant"}</span>
                  {v.note&&<div style={{display:"flex",gap:2}}>
                    {[1,2,3,4,5].map(s=>(
                      <span key={s} style={{color:s<=v.note?"#F59E0B":"#E5E7EB",fontSize:12}}>★</span>
                    ))}
                  </div>}
                </div>
                <span style={{color:"#9CA3AF",fontSize:11}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</span>
              </div>
              {v.avis&&<p style={{color:"#374151",fontSize:13,lineHeight:1.5,margin:0,marginBottom:v.photo_url?8:0}}>{v.avis}</p>}
              {v.photo_url&&(
                <img src={v.photo_url} alt="Photo visite"
                  style={{width:"100%",maxHeight:180,objectFit:"cover",borderRadius:8,marginTop:4}}
                  onError={e=>e.target.style.display="none"}/>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ══ COMPTE ÉTUDIANT ═════════════════════════════════ */
function EtudiantDashboard({onBack,onHome,onConnecte}){
  const [authStep,setAuthStep]=useState("email");
  const [showPwd,setShowPwd]=useState(false);
  const [email,setEmail]=useState("");
  const [otp,setOtp]=useState(["","","","","",""]);
  const [pwd,setPwd]=useState("");
  const [pwd2,setPwd2]=useState("");
  const [etudiant,setEtudiant]=useState(null);
  const [offres,setOffres]=useState([]);
  const [favoris,setFavoris]=useState([]);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [tab,setTab]=useState("favoris");
  const [isNewUser,setIsNewUser]=useState(false);
  const otpRefs=useRef([]);

  const sendOtp=async()=>{
    if(!email||!email.includes("@")) return setError("Email invalide");
    setError(""); setLoading(true);
    try{
      const {data:et}=await db().from("etudiants").select("id,auth_id,prenom,statut_validation").eq("email",email).maybeSingle();
      if(!et) return setError("Email non reconnu. Créez un compte étudiant.");
      setEtudiant(et);
      if(et.auth_id){
        setIsNewUser(false);
        setAuthStep("pwd_login");
      } else {
        const {error:e}=await db().auth.signInWithOtp({email, options:{shouldCreateUser:true, emailRedirectTo:undefined}});
        if(e) throw new Error(e.message);
        setIsNewUser(true);
        setAuthStep("otp");
      }
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const verifyOtp=async()=>{
    const code=otp.join("");
    if(code.length<6) return setError("Code à 6 chiffres requis");
    setLoading(true); setError("");
    try{
      const {error:e}=await db().auth.verifyOtp({email, token:code, type:"email"});
      if(e) throw new Error("Code incorrect ou expiré");
      if(isNewUser) setAuthStep("pwd_create");
      else { await loadDashboard(etudiant.id); if(onConnecte) onConnecte(etudiant); else setAuthStep("dashboard"); }
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const createPassword=async()=>{
    if(pwd.length<8) return setError("8 caractères minimum");
    if(pwd!==pwd2) return setError("Les mots de passe ne correspondent pas");
    setLoading(true); setError("");
    try{
      const {error:e}=await db().auth.updateUser({password:pwd});
      if(e){
        // Supabase bloque si même mdp qu'avant — on contourne en déconnectant/reconnectant
        if(e.message&&(e.message.includes("same")||e.message.includes("different")||e.message.includes("previously"))){
          // Forcer avec signInWithPassword puis updateUser ne fonctionne pas
          // On informe l'utilisateur de choisir un autre mot de passe
          throw new Error("Choisissez un mot de passe différent de celui utilisé précédemment.");
        }
        throw new Error(e.message);
      }
      const {data:{user}}=await db().auth.getUser();
      await db().from("etudiants").update({auth_id:user.id}).eq("email",email);
      const {data:et}=await db().from("etudiants").select("*").eq("email",email).single();
      setEtudiant(et);
      if(onConnecte) onConnecte(et); else { await loadDashboard(et.id); setAuthStep("dashboard"); }
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const loginPassword=async()=>{
    if(!pwd) return setError("Mot de passe requis");
    setLoading(true); setError("");
    try{
      const {error:e}=await db().auth.signInWithPassword({email, password:pwd});
      if(e) throw new Error("Mot de passe incorrect");
      const {data:et}=await db().from("etudiants").select("*").eq("email",email).single();
      setEtudiant(et);
      if(onConnecte) onConnecte(et); else { await loadDashboard(et.id); setAuthStep("dashboard"); }
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const register=async(form,photoFile)=>{
    setLoading(true);setError("");
    try{
      const {data:e,error:err}=await db().from("etudiants").insert({
        prenom:form.prenom,telephone:form.telephone||null,email:email||form.email||null,
        numero_ine:form.ine||null,etablissement:form.etablissement||null,
        photo_carte_url:null,statut_validation:"en_attente",
      }).select().single();
      if(err)throw err;
      let photoUrl=null;
      if(photoFile){
        try{
          const path=`${e.id}/${Date.now()}_${photoFile.name.replace(/[^a-z0-9.]/gi,"_")}`;
          const {error:upErr}=await db().storage.from("student-cards").upload(path,photoFile,{contentType:photoFile.type,upsert:false});
          if(!upErr){
            photoUrl=`${window.SUPABASE_URL}/storage/v1/object/public/student-cards/${path}`;
            await db().from("etudiants").update({photo_carte_url:photoUrl}).eq("id",e.id);
          }
        }catch(photoErr){console.warn("Upload photo ignoré:",photoErr.message);}
      }
      const etudiantComplet={...e,photo_carte_url:photoUrl};
      setEtudiant(etudiantComplet);
      if(onConnecte) onConnecte(etudiantComplet); else{setAuthStep("dashboard"); await loadDashboard(e.id);}
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const loadDashboard=async(id)=>{
    setLoading(true);
    try{
      const {data:favData}=await db().from("favoris")
        .select("*, offres(*, prestataires(nom,adresse,lat,lng,type_metier))")
        .eq("etudiant_id",id);
      if(favData){
        setFavoris(favData.map(f=>({
          ...f.offres,
          prestataire_nom:f.offres?.prestataires?.nom,
          adresse:f.offres?.prestataires?.adresse,
          fav_id:f.id,
        })));
      }
    }catch(e){console.error(e);}
    setLoading(false);
  };

  const inputStyle={width:"100%",padding:"12px 16px",borderRadius:12,border:`1.5px solid ${CS.border}`,fontSize:14,fontFamily:"inherit",outline:"none",marginBottom:12,background:"#F8F8F8",boxSizing:"border-box",color:CS.text};

  if(authStep==="email") return(
    <StudentPageShell onBack={onBack} backLabel="Accueil">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:16}}>🎓</div>
        <div style={{color:CS.text,fontSize:26,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Mon compte</div>
        <div style={{color:CS.muted,fontSize:14,marginBottom:28,lineHeight:1.6}}>Connectez-vous avec votre email étudiant</div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <input value={email} onChange={e=>setEmail(e.target.value.toLowerCase())} placeholder="votre@email.com"
          type="email" onKeyDown={e=>e.key==="Enter"&&sendOtp()} style={inputStyle}/>
        <StudentBtn onClick={sendOtp} disabled={!email.includes("@")} loading={loading}>
          Continuer →
        </StudentBtn>
        <div style={{marginTop:20}}>
          <span style={{color:CS.muted,fontSize:13}}>Pas encore de compte ? </span>
          <button onClick={()=>setAuthStep("register")} style={{color:CS.accent,fontSize:13,fontWeight:700,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>S'inscrire</button>
        </div>
      </div>
    </StudentPageShell>
  );

  if(authStep==="otp") return(
    <StudentPageShell onBack={()=>{setAuthStep("email");setError("");setOtp(["","","","","",""]);}} backLabel="Modifier">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>📧</div>
        <div style={{color:CS.text,fontSize:22,fontWeight:900,marginBottom:6,letterSpacing:-0.5}}>Code envoyé !</div>
        <div style={{color:CS.muted,fontSize:13,marginBottom:24}}>Vérifiez votre email : <strong>{email}</strong></div>
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:28}}>
          {otp.map((d,i)=>(
            <input key={i} ref={el=>otpRefs.current[i]=el} value={d}
              onChange={e=>{const v=e.target.value.replace(/\D/g,"").slice(-1);const nc=[...otp];nc[i]=v;setOtp(nc);if(v&&i<5)otpRefs.current[i+1]?.focus();}}
              onKeyDown={e=>{if(e.key==="Backspace"&&!d&&i>0){otpRefs.current[i-1]?.focus();const nc=[...otp];nc[i-1]="";setOtp(nc);}}}
              maxLength={1} type="number"
              style={{width:48,height:58,borderRadius:14,textAlign:"center",fontSize:24,fontWeight:700,background:"#FFFFFF",border:`2px solid ${d?CS.accent:"#E8E8E8"}`,color:CS.text,outline:"none",fontFamily:"monospace",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}/>
          ))}
        </div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <StudentBtn onClick={verifyOtp} disabled={otp.join("").length<6} loading={loading}>Valider →</StudentBtn>
        <div style={{marginTop:16,color:CS.muted,fontSize:13}}>Pas reçu ? <span style={{color:CS.accent,cursor:"pointer",fontWeight:600}} onClick={sendOtp}>Renvoyer</span></div>
      </div>
    </StudentPageShell>
  );

  if(authStep==="pwd_create") return(
    <StudentPageShell onBack={()=>{setAuthStep("otp");setError("");}} backLabel="Retour">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>🔒</div>
        <div style={{color:CS.text,fontSize:22,fontWeight:900,marginBottom:6}}>Créez votre mot de passe</div>
        <div style={{color:CS.muted,fontSize:13,marginBottom:24}}>Pour vos prochaines connexions</div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <div style={{position:"relative",marginBottom:12}}>
          <input id="pwd1" type={showPwd?"text":"password"} value={pwd} onChange={e=>setPwd(e.target.value)}
            placeholder="Mot de passe (8 car. min)" style={{...inputStyle,marginBottom:0,paddingRight:44}}/>
          <button onClick={()=>setShowPwd(!showPwd)} type="button"
            style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9CA3AF"}}>
            {showPwd?"🙈":"👁️"}
          </button>
        </div>
        <div style={{position:"relative",marginBottom:12}}>
          <input id="pwd2" type={showPwd?"text":"password"} value={pwd2} onChange={e=>setPwd2(e.target.value)}
            placeholder="Confirmer le mot de passe"
            onKeyDown={e=>e.key==="Enter"&&createPassword()}
            style={{...inputStyle,marginBottom:0,paddingRight:44}}/>
        </div>
        <StudentBtn onClick={createPassword} disabled={pwd.length<8} loading={loading}>Créer mon compte ✓</StudentBtn>
      </div>
    </StudentPageShell>
  );

  if(authStep==="pwd_login") return(
    <StudentPageShell onBack={()=>{setAuthStep("email");setError("");setPwd("");}} backLabel="Modifier">
      <div style={{padding:"32px 20px",textAlign:"center"}}>
        <div style={{fontSize:44,marginBottom:12}}>👋</div>
        <div style={{color:CS.text,fontSize:22,fontWeight:900,marginBottom:6}}>Bienvenue {etudiant?.prenom} !</div>
        <div style={{color:CS.muted,fontSize:13,marginBottom:24}}>{email}</div>
        {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"10px",marginBottom:14,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
        <div style={{position:"relative",marginBottom:12}}>
          <input type={showPwd?"text":"password"} value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="Mot de passe"
            onKeyDown={e=>e.key==="Enter"&&loginPassword()} style={{...inputStyle,marginBottom:0,paddingRight:44}}/>
          <button onClick={()=>setShowPwd(!showPwd)} type="button"
            style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:18,color:"#9CA3AF"}}>
            {showPwd?"🙈":"👁️"}
          </button>
        </div>
        <StudentBtn onClick={loginPassword} disabled={!pwd} loading={loading}>Se connecter</StudentBtn>
        <button onClick={async()=>{
          setLoading(true);setError("");
          try{
            const {error:e}=await db().auth.resetPasswordForEmail(email,{
              redirectTo:'https://iok-s.vercel.app/?type=recovery'
            });
            if(e) throw new Error(e.message);
            setError("✅ Email envoyé ! Cliquez sur le lien pour réinitialiser votre mot de passe.");
          }catch(e){setError(e.message);}
          setLoading(false);
        }} style={{width:"100%",marginTop:10,padding:"10px 0",borderRadius:12,border:`1px solid ${CS.border}`,background:"transparent",color:CS.accent,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
          Mot de passe oublié ? Recevoir un lien
        </button>
      </div>
    </StudentPageShell>
  );

  if(authStep==="register") return <EtudiantRegister email={email} onRegister={register} onBack={()=>setAuthStep("email")} loading={loading} error={error}/>;

  // Dashboard
  return(
    <StudentPageShell onBack={onBack} backLabel="Accueil" topSlot={
      <div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,background:"#F0FFF4",borderRadius:10,padding:"8px 12px"}}>
          <span style={{fontSize:16}}>🎓</span>
          <span style={{color:"#22C55E",fontSize:13,fontWeight:700}}>{etudiant?.prenom}</span>
          <FiabiliteBadge statut={etudiant?.statut_validation||"en_attente"} small={true}/>
        </div>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          {[{v:"favoris",l:"❤️ Favoris"},{v:"profil",l:"👤 Profil"}].map(t=>(
            <button key={t.v} onClick={()=>setTab(t.v)}
              style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${tab===t.v?CS.accent:"#E8E8E8"}`,background:tab===t.v?CS.accentSoft:"transparent",color:tab===t.v?CS.accent:CS.muted,fontSize:13,fontWeight:tab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
              {t.l}
            </button>
          ))}
        </div>
      </div>
    }>
      <div style={{padding:"16px 16px 0"}}>
        {etudiant?.statut_validation==="en_attente"&&(
          <div style={{background:"#FFF9E6",border:"1px solid #F5E27A",borderRadius:12,padding:"12px 14px",marginBottom:16,fontSize:13,color:"#B8860B",lineHeight:1.6}}>
            ⏳ Votre compte est en attente de validation. Vous pouvez déjà consulter les offres !
          </div>
        )}

        {tab==="favoris"&&(
          <div>
            {loading&&<div style={{textAlign:"center",padding:32,color:CS.muted}}>Chargement…</div>}
            {!loading&&favoris.length===0&&(
              <div style={{textAlign:"center",padding:"40px 20px",color:CS.muted}}>
                <div style={{fontSize:40,marginBottom:12}}>❤️</div>
                <div style={{color:CS.text,fontWeight:700,marginBottom:6}}>Aucun favori</div>
                <div style={{fontSize:13}}>Sauvegardez des offres depuis la recherche</div>
              </div>
            )}
            {favoris.map(o=>(
              <div key={o.id} style={{background:"#FFFFFF",borderRadius:16,padding:"14px 16px",marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:48,height:48,borderRadius:12,background:bannerGradient(o.type_offre),display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
                    <i className={`ti ${getCategorieForType(o.type_offre)?.icon||"ti-star"}`} style={{fontSize:22,color:"white"}}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{color:CS.text,fontWeight:700,fontSize:14}}>{o.titre}</div>
                    <div style={{color:CS.muted,fontSize:12}}>{o.prestataire_nom}</div>
                  </div>
                  <div style={{background:CS.accentSoft,color:CS.accent,fontWeight:900,fontSize:14,padding:"4px 10px",borderRadius:20}}>-{o.promo_pct}%</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab==="profil"&&(
          <div>
            <div style={{background:"#FFFFFF",borderRadius:16,padding:"16px",marginBottom:12,boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}}>
              {[
                {l:"Prénom",v:etudiant?.prenom},
                {l:"Email",v:etudiant?.email||"—"},
                {l:"Établissement",v:etudiant?.etablissement||"—"},
                {l:"N° INE",v:etudiant?.numero_ine||"—"},
              ].map(({l,v})=>(
                <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #F0F0F0"}}>
                  <span style={{color:CS.muted,fontSize:13}}>{l}</span>
                  <span style={{color:CS.text,fontSize:13,fontWeight:600}}>{v}</span>
                </div>
              ))}
            </div>
            <ChangePassword onClose={()=>setTab("favoris")}/>
            <button onClick={()=>{setEtudiant(null);setAuthStep("email");setPwd("");setOtp(["","","","","",""]);}}
              style={{width:"100%",marginTop:10,padding:"12px",borderRadius:12,border:"1.5px solid #E8E8E8",background:"transparent",color:CS.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
              Se déconnecter
            </button>
          </div>
        )}
      </div>
    </StudentPageShell>
  );
}

  const sendOTP=async()=>{
    setError("");setLoading(true);
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      const {data:e}=await db().from("etudiants").select("*").eq("telephone",tel).maybeSingle();
      setEtudiant(e);
      // Simulation SMS en mode test
      if(TEST_MODE()) console.log("🧪 Code OTP: 123456");
      setAuthStep("otp");
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const verifyOTP=async()=>{
    const code=otp.join("");
    if(!TEST_MODE()&&code!=="123456"){setError("Code incorrect");return;}
    setLoading(true);
    if(!etudiant){
      // Nouveau compte
      setAuthStep("register");
      setLoading(false);
      return;
    }
    await loadDashboard(etudiant.id);
    if(onConnecte){onConnecte(etudiant);}
    else{setAuthStep("dashboard");}
    setLoading(false);
  };

  const register=async(form,photoFile)=>{
    setLoading(true);setError("");
    try{
      const tel=indicatif+phone.replace(/\s/g,"").replace(/^0/,"");
      // 1. Créer le compte étudiant d'abord
      const {data:e,error:err}=await db().from("etudiants").insert({
        prenom:form.prenom,telephone:tel,email:form.email||null,
        numero_ine:form.ine||null,etablissement:form.etablissement||null,
        photo_carte_url:null, // sera mis à jour après l'upload
        statut_validation:"en_attente",
      }).select().single();
      if(err)throw err;

      // 2. Uploader la photo APRÈS que le compte existe (évite les erreurs RLS)
      let photoUrl=null;
      if(photoFile){
        try{
          const path=`${e.id}/${Date.now()}_${photoFile.name.replace(/[^a-z0-9.]/gi,"_")}`;
          const {error:upErr}=await db().storage.from("student-cards").upload(path,photoFile,{contentType:photoFile.type,upsert:false});
          if(!upErr){
            photoUrl=`${window.SUPABASE_URL}/storage/v1/object/public/student-cards/${path}`;
            await db().from("etudiants").update({photo_carte_url:photoUrl}).eq("id",e.id);
          }else{
            console.warn("Upload photo optionnel échoué:",upErr.message);
          }
        }catch(photoErr){
          console.warn("Upload photo ignoré:",photoErr.message);
          // Non bloquant — le compte est créé sans photo
        }
      }

      const etudiantComplet={...e,photo_carte_url:photoUrl};
      setEtudiant(etudiantComplet);
      if(onConnecte){onConnecte(etudiantComplet);}
      else{setAuthStep("dashboard"); await loadDashboard(e.id);}
    }catch(e){setError(e.message);}
    setLoading(false);
  };

  const loadDashboard=async(id)=>{
    setLoading(true);
    try{
      const {data:favData}=await db().from("favoris")
        .select("*, offres(*, prestataires(nom,adresse,lat,lng,type_metier))")
        .eq("etudiant_id",id);
      if(favData){
        setFavoris(favData.map(f=>({
          ...f.offres,

/* ══ TRACKER IMPRESSIONS ════════════════════════════ */
const _impressionsSeen = new Set();

async function trackImpression(offreId, etudiantId){
  const key = `imp_${offreId}_${etudiantId||"anon"}`;
  if(_impressionsSeen.has(key)) return;
  _impressionsSeen.add(key);
  try{
    await db().from("impressions_offres").insert({
      offre_id: offreId,
      etudiant_id: etudiantId||null,
    });
  }catch(e){}
}

function useImpressionTracker(offreId, etudiantId){
  const ref = useRef(null);
  useEffect(()=>{
    if(!offreId||!ref.current) return;
    const observer = new IntersectionObserver(
      (entries)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            trackImpression(offreId, etudiantId);
            observer.unobserve(entry.target);
          }
        });
      },
      {threshold: 0.5}
    );
    observer.observe(ref.current);
    return ()=>observer.disconnect();
  },[offreId]);
  return ref;
}

const _vuesSeen = new Set();

async function trackVue(offreId, etudiantId){
  const key = `${offreId}_${etudiantId||"anon"}`;
  if(_vuesSeen.has(key)) return; // déjà comptée cette session
  _vuesSeen.add(key);
  try{
    await db().from("vues_offres").insert({
      offre_id: offreId,
      etudiant_id: etudiantId||null,
    });
  }catch(e){ /* silencieux */ }
}

/* ══ QR CODE UTILITAIRES ════════════════════════════ */
// Génère un token simple HMAC-like (sans crypto subtile pour compatibilité)
function genQRToken(offreId, etudiantId, ts){
  const str = `${offreId}|${etudiantId||"anon"}|${ts}|SIOK_SECRET`;
  let h = 0;
  for(let i=0; i<str.length; i++){
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36).toUpperCase().padStart(8,"0");
}

function genQRData(offreId, etudiantId){
  const ts = Date.now();
  const token = genQRToken(offreId, etudiantId, ts);
  return JSON.stringify({
    type:"siok_visite",
    offre_id:offreId,
    etudiant_id:etudiantId||null,
    ts,
    token,
    exp:ts + 5*60*1000, // 5 minutes
  });
}

function validateQRData(data){
  try{
    const obj = JSON.parse(data);
    if(obj.type !== "siok_visite") return null;
    if(Date.now() > obj.exp) return {error:"QR code expiré (5 min dépassées)"};
    const expected = genQRToken(obj.offre_id, obj.etudiant_id, obj.ts);
    if(expected !== obj.token) return {error:"QR code invalide"};
    return obj;
  }catch(e){ return null; }
}

/* ══ CARTE LOCALISATION INSCRIPTION ════════════════ */
function LeafletLocator({lat,lng,onMove,city}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const markerRef=useRef(null);
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];
  const initLat=lat||cityData.lat;
  const initLng=lng||cityData.lng;

  useEffect(()=>{
    if(mapObj.current)return;
    mapObj.current=L.map(mapRef.current,{zoomControl:true})
      .setView([initLat,initLng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    const icon=L.divIcon({
      className:"",
      html:'<div style="width:32px;height:32px;border-radius:50%;background:#0066FF;display:flex;align-items:center;justify-content:center;font-size:16px;border:3px solid white;box-shadow:0 2px 8px rgba(0,102,255,0.5);">📍</div>',
      iconSize:[32,32],iconAnchor:[16,32],
    });
    markerRef.current=L.marker([initLat,initLng],{icon,draggable:true}).addTo(mapObj.current);
    markerRef.current.on("dragend",e=>{
      const pos=e.target.getLatLng();
      onMove(pos.lat,pos.lng);
    });
    mapObj.current.on("click",e=>{
      markerRef.current.setLatLng(e.latlng);
      onMove(e.latlng.lat,e.latlng.lng);
    });
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),200);
  },[]);

  useEffect(()=>{
    if(!markerRef.current||!lat||!lng)return;
    markerRef.current.setLatLng([lat,lng]);
    mapObj.current&&mapObj.current.panTo([lat,lng]);
  },[lat,lng]);

  return <div ref={mapRef} style={{height:220,width:"100%",borderRadius:12,overflow:"hidden",marginTop:10}}/>;
}

function QRGenerator({offre, etudiant, onClose}){
  const [qrUrl, setQrUrl] = useState("");

  const [timeLeft, setTimeLeft] = useState(5*60*1000);
  const [validated, setValidated] = useState(false);

  useEffect(()=>{
    const data = genQRData(offre.id, etudiant?.id||null);
    const parsed = JSON.parse(data);
    setQrData(parsed);
    const encoded = encodeURIComponent(data);
    setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encoded}&bgcolor=ffffff&color=000000&margin=2`);
    const exp = parsed.exp;
    setExpiry(exp);

    // Timer décompte
    const interval = setInterval(()=>{
      const left = exp - Date.now();
      setTimeLeft(Math.max(0, left));
      if(left <= 0) clearInterval(interval);
    }, 1000);

    // Polling validation toutes les 5 secondes — s'arrête à l'expiration (5 min max = 60 requêtes)
    const pollInterval = setInterval(async()=>{
      // Arrêter si QR expiré
      if(Date.now() > parsed.exp) return;
      try{
        let query = db().from("visites")
          .select("id")
          .eq("offre_id", offre.id)
          .gte("created_at", new Date(parsed.ts).toISOString())
          .lte("created_at", new Date(parsed.exp).toISOString());

          query = query.eq("etudiant_anon_id", "anon");
        }

        const {data:visits} = await query.limit(1);
        if(visits && visits.length > 0){
          setValidated(true);
          clearInterval(pollInterval);
          clearInterval(interval);
        }
      }catch(e){}
    }, 5000);

    return ()=>{ clearInterval(interval); clearInterval(pollInterval); };
  },[offre.id]);

  const mins = Math.floor(timeLeft/60000);

  return(

      <div style={{background:"#FFFFFF",borderRadius:24,padding:"28px 24px",width:"100%",maxWidth:360,textAlign:"center",animation:"fadeUp 0.25s ease"}}>

/* ══ QR SCANNER — Prestataire ═══════════════════════ */
function QRScanner({prestataireId, onScanned, onClose}){
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const animRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{
    startCamera();
    return ()=>stopCamera();
  },[]);

  const startCamera = async()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      streamRef.current = stream;
      if(videoRef.current){
        videoRef.current.srcObject = stream;
        videoRef.current.play();
        setScanning(true);
        animRef.current = requestAnimationFrame(scan);
      }
    }catch(e){ setError("Impossible d'accéder à la caméra: "+e.message); }
  };

  const stopCamera = ()=>{
    if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    if(animRef.current) cancelAnimationFrame(animRef.current);
  };

  const scan = ()=>{
    if(!videoRef.current||!canvasRef.current) return;
    const video = videoRef.current;
    if(video.readyState !== video.HAVE_ENOUGH_DATA){
      animRef.current = requestAnimationFrame(scan);
      return;
    }
    const canvas = canvasRef.current;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR&&window.jsQR(imageData.data, imageData.width, imageData.height);
    if(code){
      stopCamera();
      setScanning(false);
      processQR(code.data);
      return;
    }
    animRef.current = requestAnimationFrame(scan);
  };

  const processQR = async(data)=>{
    const qr = validateQRData(data);
    if(!qr){ setError(qr?.error||"QR code invalide ou non reconnu"); return; }
    if(qr.error){ setError(qr.error); return; }

    setSaving(true);
    try{
      // Récupérer l'offre
      const {data:offre, error:offreErr} = await db().from("offres").select("titre,prix,promo_pct,prestataire_id").eq("id",qr.offre_id).single();
      if(offreErr) throw new Error("Offre introuvable: "+offreErr.message);

      // Vérifier si ce QR a déjà été scanné (fenêtre = durée de validité du QR = 5 min)
      const {data:existing} = await db().from("visites")
        .select("id")
        .eq("offre_id", qr.offre_id)
        .eq(qr.etudiant_id?"etudiant_id":"etudiant_anon_id", qr.etudiant_id||"anon")
        .gte("created_at", new Date(qr.ts).toISOString())
        .lte("created_at", new Date(qr.exp).toISOString());
      if(existing && existing.length > 0){
        throw new Error("Ce QR code a déjà été validé.");
      }

      // Enregistrer la visite
      const {error:insertErr} = await db().from("visites").insert({
        offre_id: qr.offre_id,
        prestataire_id: prestataireId,
        etudiant_id: qr.etudiant_id||null,
        etudiant_anon_id: qr.etudiant_id?null:"anon",
        points: qr.etudiant_id?1:0,
        montant_normal: offre?.prix_normal?parseFloat(offre.prix_normal):null,
        montant_remise: offre?.prix?parseFloat(offre.prix):null,
      });
      if(insertErr) throw new Error("Erreur enregistrement: "+insertErr.message);

      // Créditer le point si étudiant connecté
      if(qr.etudiant_id){
        try{
          const {data:et} = await db().from("etudiants").select("points").eq("id",qr.etudiant_id).single();
          if(et){
            const {error:ptErr} = await db().from("etudiants").update({points:(et.points||0)+1}).eq("id",qr.etudiant_id);
            if(ptErr) console.warn("Points non crédités:", ptErr.message);
          }
        }catch(ptEx){ console.warn("Points non crédités:", ptEx.message); }
      }

      setResult({offre, etudiant_id:qr.etudiant_id});

          {result.etudiant_id?(
            <div style={{background:"rgba(34,197,94,0.1)",borderRadius:10,padding:"8px 14px",marginBottom:16,color:"#22C55E",fontSize:13,fontWeight:700}}>

            </div>
          ):(

          )}
          <button onClick={()=>{onScanned&&onScanned();onClose();}}
            style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",background:"#0066FF",color:"white",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>

    </div>
  );
}

function getPlanInfo(planId){
  return getSiokPlans().find(p=>p.id===planId)||getSiokPlans()[0];
}

function planHasStats(planId){ return getPlanInfo(planId)?.hasStats||false; }
function planHasIA(planId){ return getPlanInfo(planId)?.hasIA||false; }
function planMaxOffres(planId){
  const g=getPlanInfo(planId)?.group||"base";
  if(g==="premium") return Infinity;
  if(g==="standard") return 5;
  if(planId==="trial") return 1;
  return 2; // base
}
function planMaxPhotos(planId){
  const g=getPlanInfo(planId)?.group||"base";
  if(g==="premium") return 5;
  if(g==="standard") return 3;
  return 1; // trial + base
}

const SIOK_PLANS = getSiokPlans(); // compatibilité

function planFin(planId){
  const now = new Date();
  const plan = SIOK_PLANS.find(p=>p.id===planId);
  if(!plan) return null;
  const fin = new Date(now);
  fin.setMonth(fin.getMonth() + plan.duration);
  return fin;
}

function planLabel(planId, planFin){
  if(!planId || planId==="trial") return "🎁 Essai gratuit";
  const p = SIOK_PLANS.find(pl=>pl.id===planId);
  const label = p ? p.name : planId;
  if(planFin){
    const fin = new Date(planFin);
    const today = new Date();
    const jours = Math.ceil((fin-today)/(1000*60*60*24));
    if(jours < 0) return `⚠️ ${label} — Expiré`;
    if(jours <= 7) return `⚠️ ${label} — ${jours}j restants`;
    return `⚡ ${label} — jusqu'au ${fin.toLocaleDateString("fr-FR")}`;
  }
  return `⚡ ${label}`;
}

function PrestataireRegister({onSuccess, onBack}){
  const [step,setStep]=useState(1); // 1 | 2 | 3
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [geoLoading,setGeoLoading]=useState(false);
  const [form,setForm]=useState({
    // Étape 1 — Compte
    email:"", password:"", nom_responsable:"", telephone:"",
    // Étape 2 — Enseigne
    nom:"", type_metier:"restaurant", siret:"",
    adresse:"", ville:"annecy", lat:null, lng:null,
    // Étape 3 — Plan
    plan:"trial",
  });
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  const geocode=async()=>{
    if(!form.adresse)return;
    setGeoLoading(true);
    try{
      const cityData=CITIES.find(c=>c.id===form.ville)||CITIES[0];
      const q=encodeURIComponent(`${form.adresse}, ${cityData.name}, France`);
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
      const data=await r.json();
      if(data&&data[0]){
        F("lat",parseFloat(data[0].lat));
        F("lng",parseFloat(data[0].lon));
      }
    }catch(e){}
    setGeoLoading(false);
  };

  const geolocate=()=>{
    navigator.geolocation?.getCurrentPosition(p=>{
      F("lat",p.coords.latitude);
      F("lng",p.coords.longitude);
    });
  };

  const submit=async()=>{
    setSaving(true);setError("");
    try{
      // 1. Créer le compte Auth
      const {data:authData,error:authErr}=await db().auth.signUp({
        email:form.email, password:form.password,
        options:{emailRedirectTo:window.location.href}
      });
      if(authErr)throw authErr;
      const authId=authData.user?.id;
      if(!authId)throw new Error("Erreur création compte");

      // 2. Calculer les dates de plan
      const debut=new Date();
      const fin=planFin(form.plan);

      // 3. Insérer le prestataire
      const {error:dbErr}=await db().from("prestataires").insert({
        auth_id:authId,
        nom:form.nom,
        type_metier:form.type_metier,
        siret:form.siret||null,
        nom_responsable:form.nom_responsable||null,
        email:form.email,
        telephone:form.telephone||null,
        adresse:form.adresse||null,
        ville:CITIES.find(c=>c.id===form.ville)?.name||form.ville,
        lat:form.lat||null,
        lng:form.lng||null,
        plan:form.plan,
        plan_debut:debut.toISOString(),
        plan_fin:fin?.toISOString()||null,
      });
      if(dbErr)throw dbErr;

      onSuccess(authData.user);
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  const inp=(label,key,placeholder,type="text",required=false)=>(
    <div style={{marginBottom:14}}>
      <div style={{color:C.sub,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:5}}>

      </div>
      <input type={type} value={form[key]||""} onChange={e=>F(key,e.target.value)} placeholder={placeholder}

    </div>
  );

  // Étape 1 — Compte
  if(step===1) return(
    <PrestPageShell onBack={onBack} backLabel="Retour" stickyHeader={false}>
      <div style={{padding:"20px"}}>
        <div style={{display:"flex",gap:6,marginBottom:20}}>

function PrestataireLogin({onSuccess,onBack}){

/* ══ GRAPHE ACTIVITÉ PRESTATAIRE ════════════════════ */
function ActivityChart({visites, vuesData, impressionsData}){
  const [periode, setPeriode] = useState("mois"); // mois | semaine | jour
  const now = new Date();

  const getData = ()=>{
    if(periode==="jour"){
      // Par heure aujourd'hui (0h-23h)
      return Array.from({length:24},(_,h)=>({
        label: `${String(h).padStart(2,"0")}h`,
        imp: (impressionsData||[]).filter(v=>{const d=new Date(v.created_at);return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getHours()===h;}).length,
        vues: vuesData.filter(v=>{const d=new Date(v.created_at);return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getHours()===h;}).length,
        vis: visites.filter(v=>{const d=new Date(v.created_at);return d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getHours()===h;}).length,
      }));
    }
    if(periode==="semaine"){
      // 7 derniers jours
      return Array.from({length:7},(_,i)=>{
        const d=new Date(now); d.setDate(d.getDate()-6+i);
        const day=d.getDate(), month=d.getMonth(), year=d.getFullYear();
        const label=d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit"});
        return{
          label,
          vues: vuesData.filter(v=>{const vd=new Date(v.created_at);return vd.getDate()===day&&vd.getMonth()===month&&vd.getFullYear()===year;}).length,
          vis: visites.filter(v=>{const vd=new Date(v.created_at);return vd.getDate()===day&&vd.getMonth()===month&&vd.getFullYear()===year;}).length,
        };
      });
    }
    if(periode==="evolution"){
      // Évolution mensuelle sur 12 mois max
      const result=[];
      for(let i=11;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        const m=d.getMonth(),y=d.getFullYear();
        const label=d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
        const vues=vuesData.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
        const vis=visites.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
        if(vues>0||vis>0||i===0) result.push({label,vues,vis});
      }
      return result;
    }
    // Mois : jours du mois en cours
    const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    return Array.from({length:daysInMonth},(_,i)=>{
      const day=i+1, month=now.getMonth(), year=now.getFullYear();
      return{
        label: String(day).padStart(2,"0"),
        vues: vuesData.filter(v=>{const vd=new Date(v.created_at);return vd.getDate()===day&&vd.getMonth()===month&&vd.getFullYear()===year;}).length,
        vis: visites.filter(v=>{const vd=new Date(v.created_at);return vd.getDate()===day&&vd.getMonth()===month&&vd.getFullYear()===year;}).length,
      };
    });
  };

  const data = getData();
  const maxVal = Math.max(...data.map(d=>d.vues+d.vis), 1);
  const BAR_H = 80;
  const totalVues = data.reduce((s,d)=>s+d.vues,0);
  const totalVis = data.reduce((s,d)=>s+d.vis,0);

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px",marginBottom:12}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{color:C.text,fontWeight:700,fontSize:13}}>📈 Activité</div>
          <div style={{color:C.muted,fontSize:10,marginTop:2}}>
            <span style={{color:"#6B7280"}}>👁️ {totalVues} vues</span>
            <span style={{color:C.muted}}> · </span>
            <span style={{color:"#0066FF"}}>✅ {totalVis} visites</span>
          </div>
        </div>
        <div style={{display:"flex",gap:4}}>
          {[{v:"jour",l:"Jour"},{v:"semaine",l:"Sem."},{v:"mois",l:"Mois"},{v:"evolution",l:"Évol."}].map(p=>(
            <button key={p.v} onClick={()=>setPeriode(p.v)}
              style={{padding:"4px 10px",borderRadius:8,border:"none",background:periode===p.v?"#0066FF":"rgba(0,102,255,0.08)",color:periode===p.v?"white":"#0066FF",fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {p.l}
            </button>
          ))}
        </div>
      </div>

      {/* Barres */}
      <div style={{display:"flex",gap:1,alignItems:"flex-end",height:BAR_H,overflowX:"auto",paddingBottom:4}}>
        {data.map((d,i)=>{
          const hVues = d.vues/maxVal*BAR_H;
          const hVis = d.vis/maxVal*BAR_H;
          const isToday = periode==="mois"&&i+1===now.getDate() ||
                          periode==="semaine"&&i===6 ||
                          periode==="jour"&&i===now.getHours() ||
                          periode==="evolution"&&i===data.length-1;
          return(
            <div key={i} title={`${d.label}: 👁️ ${d.vues} vues, € ${d.vis} visites`}
              style={{flex:"0 0 auto",width:periode==="mois"?"10px":periode==="jour"?"12px":periode==="evolution"?"32px":"28px",display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
              {/* Barre impressions (gris très clair) */}
              {(()=>{const hImp=d.imp?d.imp/maxVal*BAR_H:0;return hImp>0&&<div style={{width:"100%",height:`${hImp}px`,background:isToday?"#9CA3AF":"#E5E7EB",borderRadius:"2px 2px 0 0",transition:"height 0.3s"}}/>})()}
              {/* Barre vues (gris) */}
              {hVues>0&&<div style={{width:"100%",height:`${hVues}px`,background:isToday?"#374151":"#D1D5DB",transition:"height 0.3s"}}/>}
              {/* Barre visites (bleu) */}
              {hVis>0&&<div style={{width:"100%",height:`${hVis}px`,background:isToday?"#0066FF":"#93C5FD",borderRadius:hVues>0&&!(d.imp?d.imp/maxVal*BAR_H:0)?"0":"2px 2px 0 0",transition:"height 0.3s"}}/>}
              {/* Ligne de base */}
              {hVues===0&&hVis===0&&<div style={{width:"100%",height:2,background:C.border}}/>}
            </div>
          );
        })}
      </div>

      {/* Labels (seulement pour semaine et jour) */}
      {(periode==="semaine"||periode==="jour"||periode==="evolution")&&(
        <div style={{display:"flex",gap:1,marginTop:4}}>
          {data.map((d,i)=>(
            <div key={i} style={{flex:"0 0 auto",width:periode==="jour"?"12px":periode==="evolution"?"32px":"28px",textAlign:"center"}}>
              <div style={{color:C.muted,fontSize:7,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.label}</div>
            </div>
          ))}
        </div>
      )}
      {/* Pour le mois, afficher seulement le 1, 7, 14, 21, 28 */}
      {periode==="mois"&&(
        <div style={{display:"flex",gap:1,marginTop:4}}>
          {data.map((d,i)=>(
            <div key={i} style={{flex:"0 0 auto",width:"10px",textAlign:"center"}}>
              {[0,6,13,20,27].includes(i)&&<div style={{color:C.muted,fontSize:7}}>{d.label}</div>}
            </div>
          ))}
        </div>
      )}

      {/* Légende */}
      <div style={{display:"flex",gap:12,marginTop:8,justifyContent:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <div style={{width:10,height:10,borderRadius:2,background:"#D1D5DB"}}/>
          <span style={{color:C.muted,fontSize:10}}>Vues</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <div style={{width:10,height:10,borderRadius:2,background:"#93C5FD"}}/>
          <span style={{color:C.muted,fontSize:10}}>Visites</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4}}>
          <div style={{width:10,height:10,borderRadius:2,background:"#0066FF"}}/>
          <span style={{color:C.muted,fontSize:10}}>Auj. / Courant</span>
        </div>
      </div>
    </div>
  );
}

${JSON.stringify(statsOffres, null, 2)}

${parHeure.filter(h=>h.visites>0).map(h=>`${h.heure}h: ${h.visites}`).join(", ")||"Pas encore de données"}

${parJour.map(j=>`${j.jour}: ${j.visites}`).join(", ")}

Fournis une analyse concise en JSON avec exactement cette structure :
