function fmt(ms){
  if(ms<=0)return"00:00";
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
  return`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtDate(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function fmtDateLong(d){
  if(!d)return"";
  return new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});
}
const VISIBILITE_ANTICIPEE_H = ()=> (window.SIOK_PARAMS?.visibilite_anticipee_h||24);

function isOffreVisible(offre){
  // Visible si active en DB
  if(!offre.active)return false;
  const now=new Date();
  // Pas de dates → offre permanente → visible
  if(!offre.date_debut&&!offre.date_fin)return true;
  // Expirée
  if(offre.date_fin&&new Date(offre.date_fin)<now)return false;
  // Visible X heures avant le début
  if(offre.date_debut){
    const debut=new Date(offre.date_debut);
    const visibleDepuis=new Date(debut.getTime()-VISIBILITE_ANTICIPEE_H()*60*60*1000);
    if(now<visibleDepuis)return false;
  }
  return true;
}

function isOffreActive(offre){
  // Active = QR scannable, seulement à partir de date_debut
  if(!offre.active)return false;
  const now=new Date();
  if(!offre.date_debut&&!offre.date_fin)return true;
  if(offre.date_fin&&new Date(offre.date_fin)<now)return false;
  if(offre.date_debut&&new Date(offre.date_debut)>now)return false;
  return true;
}
function bannerColorSiok(str){
  let h=0;for(let i=0;i<(str||"").length;i++)h=(h*31+str.charCodeAt(i))>>>0;
  const hues=[200,220,240,260,180,210,230,250];
  return`hsl(${hues[h%hues.length]},55%,88%)`;
}
function bannerGradient(typeId){
  const cat=getCategorieForType(typeId);
  if(cat){
    const palettes={
      restauration:["#FF6B35","#FF9A5C"],
      soins:       ["#E91E8C","#FF6BB5"],
      loisirs:     ["#7C3AED","#A855F7"],

      services:    ["#0066FF","#3399FF"],
      sante:       ["#06B6D4","#22D3EE"],
      hebergement: ["#F59E0B","#FCD34D"],
    };
    const p=palettes[cat.id]||["#0066FF","#3399FF"];
    return `linear-gradient(135deg,${p[0]},${p[1]})`;
  }
  return "linear-gradient(135deg,#0066FF,#3399FF)";
}
function distanceM(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function TopOffresParCategorie({offres, userLocation, onSelect}){
  const catsAvec = buildCategoriesOffre().filter(c=>offres.some(o=>c.types.includes(o.type_offre)));

  return(

      {catsAvec.map(cat=>{
        const catOffres=offres
          .filter(o=>cat.types.includes(o.type_offre))
          .sort((a,b)=>{
            const scoreA=(a.nb_avis||0)*2 + (a.note_moyenne||0);
            const scoreB=(b.nb_avis||0)*2 + (b.note_moyenne||0);

                        {o.prix&&<span style={{color:cat.color,fontWeight:800,fontSize:12}}>{o.prix}€</span>}

  );

/* ══ RECOMMANDATIONS PERSONNALISÉES (connecté) ═══════ */
function RecommandationsPerso({offres, etudiant, visites, vues}){
  // Calculer les catégories préférées basées sur vues + visites
  const scoreParType={};
  vues.forEach(v=>{
    const offre=offres.find(o=>o.id===v.offre_id);
    if(offre?.type_offre) scoreParType[offre.type_offre]=(scoreParType[offre.type_offre]||0)+1;
  });
  visites.forEach(v=>{
    const offre=offres.find(o=>o.id===v.offre_id);
    if(offre?.type_offre) scoreParType[offre.type_offre]=(scoreParType[offre.type_offre]||0)+3; // visites pèsent plus
  });

  const offresVues=new Set(vues.map(v=>v.offre_id));
  const offresVisitees=new Set(visites.map(v=>v.offre_id));

  // Scorer chaque offre non encore visitée
  const scored=offres
    .filter(o=>o.active&&!offresVisitees.has(o.id))
    .map(o=>{
      const typeScore=scoreParType[o.type_offre]||0;
      const remiseScore=o.promo_pct||0;
      const noteScore=(o.note_moyenne||0)*5;
      return{...o, score:typeScore*10+remiseScore+noteScore};
    })
    .sort((a,b)=>b.score-a.score)
    .slice(0,5);

  if(scored.length===0) return null;

  return(
    <div style={{marginBottom:16}}>
      <div style={{color:CS.text,fontWeight:800,fontSize:15,marginBottom:10,letterSpacing:-0.3}}>
        ✨ Recommandé pour toi
      </div>
      <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}}>
        {scored.map(o=>{
          const cat=getCategorieForType(o.type_offre);
          return(
            <div key={o.id} style={{flexShrink:0,width:140,background:"#FFFFFF",borderRadius:16,overflow:"hidden",cursor:"pointer",boxShadow:"0 2px 12px rgba(0,0,0,0.08)",border:`1.5px solid ${cat?.color||CS.accent}22`}}>
              <div style={{height:72,background:bannerGradient(o.type_offre),position:"relative",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {o.photos&&o.photos.length>0
                  ?<img src={o.photos[0].url} alt="" onError={e=>e.target.style.display="none"} style={{width:"100%",height:"100%",objectFit:"cover",position:"absolute",inset:0}}/>
                  :<i className={`ti ${cat?.icon||"ti-star"}`} style={{fontSize:28,color:"white",filter:"drop-shadow(0 2px 4px rgba(0,0,0,0.2))"}}/>
                }
                <div style={{position:"absolute",top:6,right:6,background:"white",color:cat?.color||CS.accent,fontSize:11,fontWeight:900,padding:"2px 8px",borderRadius:12,boxShadow:"0 1px 6px rgba(0,0,0,0.15)"}}>
                  -{o.promo_pct}%
                </div>
                {offresVues.has(o.id)&&<div style={{position:"absolute",bottom:4,left:6,background:"rgba(0,0,0,0.5)",color:"white",fontSize:9,padding:"1px 6px",borderRadius:8}}>Déjà vu</div>}
              </div>
              <div style={{padding:"8px 10px"}}>
                <div style={{color:CS.text,fontWeight:700,fontSize:12,lineHeight:1.3,marginBottom:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.titre}</div>
                {o.prix&&<span style={{color:cat?.color||CS.accent,fontWeight:800,fontSize:12}}>{o.prix}€</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StarRating({value, onChange, size=20, readOnly=false}){
  const [hover,setHover]=useState(0);
  const display=hover||value||0;
  return(
    <div style={{display:"flex",gap:2}}>
      {[1,2,3,4,5].map(s=>(
        <span key={s}
          onClick={()=>!readOnly&&onChange&&onChange(s)}
          onMouseEnter={()=>!readOnly&&setHover(s)}
          onMouseLeave={()=>!readOnly&&setHover(0)}
          style={{fontSize:size,cursor:readOnly?"default":"pointer",color:s<=display?"#F5A623":"#E0E0E0",lineHeight:1,transition:"color 0.1s"}}>
          ★
        </span>
      ))}
    </div>
  );
}

function NoteDisplay({note, nbAvis, small}){
  if(!note&&!nbAvis)return null;
  return(
    <div style={{display:"flex",alignItems:"center",gap:4}}>
      <span style={{color:"#F5A623",fontSize:small?11:13}}>★</span>
      <span style={{color:CS.text,fontWeight:700,fontSize:small?11:13}}>{note?parseFloat(note).toFixed(1):"—"}</span>
      {nbAvis>0&&<span style={{color:CS.muted,fontSize:small?10:11}}>({nbAvis} avis)</span>}
    </div>
  );
}

/* ══ MODAL SUGGESTION ═══════════════════════════════ */
function ModalSuggestion({nom, type, onClose}){
  const [commentaire,setCommentaire]=useState("");
  const [note,setNote]=useState(0);
  const [nomSaisi,setNomSaisi]=useState(nom||"");
  const [saving,setSaving]=useState(false);
  const [success,setSuccess]=useState(false);
  const [error,setError]=useState("");



  const envoyer=async()=>{
    if(!commentaire.trim()) return setError("Merci d'écrire votre suggestion");
    if(!note) return setError("Merci de donner une note");
    setSaving(true); setError("");
    try{
      const {error:e}=await db().from("suggestions").insert({
        nom:nomSaisi.trim()||null,
        type,
        commentaire:commentaire.trim().slice(0,200),
        note,
      });
      if(e) throw new Error(e.message);
      setSuccess(true);
      setTimeout(()=>onClose(),2000);
    }catch(e){ setError(e.message); }
    setSaving(false);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:4000,display:"flex",flexDirection:"column",justifyContent:"flex-end",paddingBottom:70}}
      onClick={onClose}>
      <div style={{background:"#FFFFFF",borderRadius:"24px 24px 0 0",width:"100%",maxWidth:480,alignSelf:"center",display:"flex",flexDirection:"column",maxHeight:"75vh"}}
        onClick={e=>e.stopPropagation()}>
        {/* Header fixe avec bouton fermer */}
        <div style={{padding:"16px 24px 0",flexShrink:0,display:"flex",justifyContent:"flex-end"}}>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:"50%",border:"none",background:"#F0F0F0",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>✕</button>
        </div>
        {/* Contenu scrollable */}
        <div style={{overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"8px 24px 40px",flex:1}}>
        {success?(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:52,marginBottom:12}}>🎉</div>
            <div style={{color:"#22C55E",fontWeight:800,fontSize:18}}>Merci pour votre suggestion !</div>
            <div style={{color:CS.muted,fontSize:13,marginTop:6}}>Elle a bien été enregistrée.</div>
          </div>
        ):(
          <>
            <div style={{textAlign:"center",marginBottom:20}}>
              <div style={{fontSize:36,marginBottom:8}}>💡</div>
              <div style={{color:CS.text,fontSize:18,fontWeight:900,marginBottom:4}}>Votre idée</div>
              <div style={{color:CS.muted,fontSize:13}}>Aidez-nous à améliorer STU10</div>
            </div>
            {!nom&&(
              <div style={{marginBottom:14}}>
                <div style={{color:CS.text,fontSize:13,fontWeight:700,marginBottom:6}}>Votre prénom (optionnel)</div>
                <input value={nomSaisi} onChange={e=>setNomSaisi(e.target.value)} placeholder="Anonyme"
                  style={{width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid #E0E0E0",fontSize:14,fontFamily:"inherit",outline:"none",background:"#FAFAFA"}}/>
              </div>
            )}
            <div style={{marginBottom:14}}>
              <div style={{color:CS.text,fontSize:13,fontWeight:700,marginBottom:6}}>Votre suggestion <span style={{color:CS.accent}}>*</span></div>
              <textarea value={commentaire} onChange={e=>setCommentaire(e.target.value.slice(0,200))}
                placeholder="Décrivez votre idée en quelques mots…"
                rows={3}
                style={{width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid #E0E0E0",fontSize:14,fontFamily:"inherit",outline:"none",background:"#FAFAFA",resize:"none"}}/>
              <div style={{color:CS.muted,fontSize:11,textAlign:"right",marginTop:3}}>{commentaire.length}/200</div>
            </div>
            <div style={{marginBottom:18}}>
              <div style={{color:CS.text,fontSize:13,fontWeight:700,marginBottom:8}}>Note globale de l'application <span style={{color:CS.accent}}>*</span></div>
              <StarRating value={note} onChange={setNote} size={32}/>
            </div>
            {error&&<div style={{background:"#FFF0F0",borderRadius:10,padding:"8px 12px",marginBottom:12,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
            <StudentBtn onClick={envoyer} loading={saving} disabled={!commentaire.trim()||!note}>
              Envoyer ma suggestion →
            </StudentBtn>
          </>
        )}
        </div>
      </div>
    </div>
  );
}

/* ══ MES CADEAUX ════════════════════════════════════ */
function MesCadeaux({etudiant, totalPoints, onPointsUpdate}){
  const SEUILS=[
    {pts:250, montant:10, label:"Bon cadeau 10€"},
    {pts:500, montant:40, label:"Bon cadeau 40€"},
    {pts:750, montant:70, label:"Bon cadeau 70€"},
  ];
  const [partenaires,setPartenaires]=useState([]);
  const [bons,setBons]=useState([]);
  const [loading,setLoading]=useState(true);
  const [step,setStep]=useState("seuils"); // seuils | partenaires | confirm | succes
  const [selectedSeuil,setSelectedSeuil]=useState(null);
  const [selectedPartenaire,setSelectedPartenaire]=useState(null);
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState("");

  useEffect(()=>{
    (async()=>{
      const {data:p}=await db().from("partenaires_cadeaux").select("*").eq("actif",true).order("nom");
      const {data:b}=await db().from("bons_cadeaux").select("*,partenaires_cadeaux(nom,emoji)").eq("etudiant_id",etudiant.id).order("created_at",{ascending:false});
      setPartenaires(p||[]);
      setBons(b||[]);
      setLoading(false);
    })();
  },[]);

  const genCode=()=>"STU-"+Math.random().toString(36).substr(2,4).toUpperCase()+"-"+Math.random().toString(36).substr(2,4).toUpperCase();

  const demanderCadeau=async()=>{
    if(!selectedSeuil||!selectedPartenaire) return;
    setSubmitting(true); setError("");
    try{
      const code=genCode();
      const {error:e}=await db().from("bons_cadeaux").insert({
        etudiant_id:etudiant.id,
        partenaire_id:selectedPartenaire.id,
        montant:selectedSeuil.montant,
        points_utilises:selectedSeuil.pts,
        code,
        statut:"en_attente"
      });
      if(e) throw e;
      setBons(prev=>[{code,montant:selectedSeuil.montant,statut:"en_attente",partenaires_cadeaux:selectedPartenaire,created_at:new Date().toISOString()},...prev]);
      setStep("succes");
    }catch(e){setError("Erreur lors de la demande. Réessaie.");}
    setSubmitting(false);
  };

  if(loading) return <div style={{textAlign:"center",padding:"40px 0",color:"#9CA3AF",fontSize:13}}>Chargement…</div>;

  return(
    <div>
      {/* Mes bons en cours */}
      {bons.length>0&&(
        <div style={{marginBottom:20}}>
          <div style={{color:"#1A1A2E",fontWeight:700,fontSize:14,marginBottom:10}}>Mes bons cadeaux</div>
          {bons.map(b=>(
            <div key={b.code} style={{background:"#FFFFFF",borderRadius:12,padding:"12px 14px",marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:700,fontSize:13,color:"#1A1A2E"}}>{b.partenaires_cadeaux?.emoji} {b.partenaires_cadeaux?.nom} — {b.montant}€</div>
                <div style={{fontFamily:"monospace",fontSize:12,color:"#0066FF",fontWeight:700,marginTop:2}}>{b.code}</div>
                <div style={{fontSize:11,color:"#9CA3AF",marginTop:2}}>{new Date(b.created_at).toLocaleDateString("fr-FR")}</div>
              </div>
              <div style={{background:b.statut==="validé"?"#22C55E":b.statut==="en_attente"?"#F59E0B":"#EF4444",color:"white",fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:20}}>
                {b.statut==="validé"?"✅ Validé":b.statut==="en_attente"?"⏳ En attente":"❌ Refusé"}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Étape seuils */}
      {step==="seuils"&&(
        <div>
          <div style={{color:"#1A1A2E",fontWeight:700,fontSize:14,marginBottom:6}}>🎁 Réclamer un bon cadeau</div>
          <div style={{color:"#9CA3AF",fontSize:12,marginBottom:14}}>Vous avez <span style={{color:"#F59E0B",fontWeight:800}}>{totalPoints} pts</span></div>
          {SEUILS.map(s=>{
            const ok=totalPoints>=s.pts;
            return(
              <div key={s.pts} onClick={ok?()=>{setSelectedSeuil(s);setStep("partenaires");}:undefined}
                style={{background:ok?"#FFFFFF":"#F8F8F8",borderRadius:14,padding:"14px 16px",marginBottom:10,
                  border:`1.5px solid ${ok?"#0066FF":"#E5E7EB"}`,cursor:ok?"pointer":"default",
                  opacity:ok?1:0.5,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:800,fontSize:15,color:ok?"#1A1A2E":"#9CA3AF"}}>{s.label}</div>
                  <div style={{fontSize:12,color:"#9CA3AF",marginTop:2}}>{s.pts} points requis</div>
                </div>
                {ok
                  ?<div style={{color:"#0066FF",fontWeight:800,fontSize:13}}>Choisir →</div>
                  :<div style={{color:"#9CA3AF",fontSize:12}}>-{s.pts-totalPoints} pts</div>
                }
              </div>
            );
          })}
        </div>
      )}

      {/* Étape partenaires */}
      {step==="partenaires"&&(
        <div>
          <button onClick={()=>setStep("seuils")} style={{background:"none",border:"none",cursor:"pointer",color:"#9CA3AF",fontSize:13,marginBottom:12,padding:0}}>← Retour</button>
          <div style={{color:"#1A1A2E",fontWeight:700,fontSize:14,marginBottom:6}}>Choisir un partenaire</div>
          <div style={{color:"#9CA3AF",fontSize:12,marginBottom:14}}>Pour votre bon cadeau de <span style={{color:"#F59E0B",fontWeight:800}}>{selectedSeuil?.montant}€</span></div>
          {partenaires.length===0
            ?<div style={{textAlign:"center",padding:"20px 0",color:"#9CA3AF",fontSize:13}}>Aucun partenaire disponible pour l'instant</div>
            :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {partenaires.map(p=>(
                <button key={p.id} onClick={()=>{setSelectedPartenaire(p);setStep("confirm");}}
                  style={{background:"#FFFFFF",border:"1.5px solid #E5E7EB",borderRadius:14,padding:"16px 10px",cursor:"pointer",fontFamily:"inherit",textAlign:"center",transition:"all 0.15s"}}>
                  <div style={{fontSize:32,marginBottom:6}}>{p.emoji||"🎁"}</div>
                  <div style={{fontWeight:700,fontSize:13,color:"#1A1A2E"}}>{p.nom}</div>
                </button>
              ))}
            </div>
          }
        </div>
      )}

      {/* Étape confirmation */}
      {step==="confirm"&&(
        <div style={{textAlign:"center"}}>
          <button onClick={()=>setStep("partenaires")} style={{background:"none",border:"none",cursor:"pointer",color:"#9CA3AF",fontSize:13,marginBottom:16,display:"block"}}>← Retour</button>
          <div style={{fontSize:48,marginBottom:8}}>{selectedPartenaire?.emoji||"🎁"}</div>
          <div style={{fontWeight:800,fontSize:18,color:"#1A1A2E",marginBottom:4}}>{selectedPartenaire?.nom}</div>
          <div style={{color:"#F59E0B",fontWeight:900,fontSize:24,marginBottom:8}}>Bon cadeau {selectedSeuil?.montant}€</div>
          <div style={{background:"rgba(239,68,68,0.06)",borderRadius:12,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#EF4444"}}>
            ⚠️ Cette demande utilisera <strong>{selectedSeuil?.pts} points</strong>. Les points seront déduits après validation par l'admin.
          </div>
          {error&&<div style={{color:"#EF4444",fontSize:12,marginBottom:8}}>{error}</div>}
          <button onClick={demanderCadeau} disabled={submitting}
            style={{width:"100%",padding:"14px",borderRadius:14,border:"none",background:"linear-gradient(135deg,#0066FF,#3399FF)",color:"white",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {submitting?"...":"Confirmer ma demande 🎁"}
          </button>
        </div>
      )}

      {/* Succès */}
      {step==="succes"&&(
        <div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:56,marginBottom:12}}>🎉</div>
          <div style={{fontWeight:800,fontSize:18,color:"#1A1A2E",marginBottom:8}}>Demande envoyée !</div>
          <div style={{color:"#6B7280",fontSize:13,marginBottom:16,lineHeight:1.6}}>
            Ton bon cadeau est en attente de validation.<br/>Tu recevras ton code une fois validé par notre équipe.
          </div>
          <button onClick={()=>setStep("seuils")} style={{padding:"10px 20px",borderRadius:12,border:"1.5px solid #E5E7EB",background:"white",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>
            Voir mes bons cadeaux
          </button>
        </div>
      )}
    </div>
  );
}

/* ══ PHOTO CAROUSEL ══════════════════════════════════ */
function PhotoCarousel({photos, height=160, emoji="🎁", gradient="linear-gradient(135deg,#14B8A6,#0066FF)"}){
  const [idx, setIdx] = React.useState(0);
  const touchStartX = React.useRef(null);

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if(touchStartX.current===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if(dx < -40 && idx < photos.length-1) setIdx(i=>i+1);
    if(dx >  40 && idx > 0)               setIdx(i=>i-1);
    touchStartX.current = null;
  };

  const hasPhotos = photos && photos.length > 0;

  return(
    <div style={{position:"relative",height,overflow:"hidden",borderRadius:"20px 20px 0 0",background:gradient,userSelect:"none"}}
      onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      {hasPhotos
        ? <img src={photos[idx].url} alt="" onError={e=>e.target.style.display="none"}
            style={{width:"100%",height:"100%",objectFit:"cover",position:"absolute",inset:0,transition:"opacity 0.2s"}}/>
        : <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <span style={{fontSize:64,filter:"drop-shadow(0 4px 12px rgba(0,0,0,0.15))"}}>{emoji}</span>
          </div>
      }
      {/* Gradient overlay */}
      <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.45))",pointerEvents:"none"}}/>
      {/* Flèches desktop */}
      {hasPhotos&&photos.length>1&&idx>0&&(
        <button onClick={e=>{e.stopPropagation();setIdx(i=>i-1);}}
          style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,0.85)",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}>‹</button>
      )}
      {hasPhotos&&photos.length>1&&idx<photos.length-1&&(
        <button onClick={e=>{e.stopPropagation();setIdx(i=>i+1);}}
          style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"rgba(255,255,255,0.85)",border:"none",borderRadius:"50%",width:28,height:28,cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}>›</button>
      )}
      {/* Points indicateurs */}
      {hasPhotos&&photos.length>1&&(
        <div style={{position:"absolute",bottom:28,left:"50%",transform:"translateX(-50%)",display:"flex",gap:5,zIndex:2}}>
          {photos.map((_,i)=>(
            <div key={i} onClick={e=>{e.stopPropagation();setIdx(i);}}
              style={{width:i===idx?16:6,height:6,borderRadius:3,background:i===idx?"white":"rgba(255,255,255,0.5)",transition:"all 0.2s",cursor:"pointer"}}/>
          ))}
        </div>
      )}
    </div>
  );
}

function FilterBar({offres, filterCat, setFilterCat, filterType, setFilterType, tri, setTri, viewMode, setViewMode}){
  const [expandedCat, setExpandedCat] = useState(null);

  const catsAvec = buildCategoriesOffre().filter(c=>offres.some(o=>c.types.includes(o.type_offre)));
  const typesDispo = expandedCat
    ? getTypesForCategorie(expandedCat).filter(t=>offres.some(o=>o.type_offre===t.id))
    : [];

  const handleCat=(catId)=>{
    if(filterCat===catId){setFilterCat(null);setFilterType(null);setExpandedCat(null);}
    else{setFilterCat(catId);setFilterType(null);setExpandedCat(expandedCat===catId?null:catId);}
  };

  const NAV_BTN = (active)=>({
    display:"flex",flexDirection:"column",alignItems:"center",gap:3,
    padding:"7px 10px",borderRadius:10,border:"none",cursor:"pointer",
    fontFamily:"inherit",minWidth:46,flexShrink:0,transition:"all 0.15s",
    background:active?"#C8E8F5":"rgba(75,163,195,0.08)",
  });
  const NAV_ICO = (active)=>({fontSize:22,color:active?"#1E6A8A":"#4BA3C3",lineHeight:1});
  const NAV_LBL = (active)=>({fontSize:10,fontWeight:700,color:active?"#1E6A8A":"#4BA3C3"});

  return(
    <div style={{marginBottom:8}}>
      {/* Ligne unique scrollable : liste | carte | sep | proche | euro | sep | cats */}
      <div style={{display:"flex",gap:5,alignItems:"center",overflowX:"auto",paddingBottom:4}}>
        <button onClick={()=>setViewMode&&setViewMode("list")} style={NAV_BTN(viewMode==="list")} aria-label="Vue liste">
          <i className="ti ti-menu-2" style={NAV_ICO(viewMode==="list")}/>
          <span style={NAV_LBL(viewMode==="list")}>liste</span>
        </button>
        <button onClick={()=>setViewMode&&setViewMode("map")} style={NAV_BTN(viewMode==="map")} aria-label="Vue carte">
          <i className="ti ti-map-2" style={NAV_ICO(viewMode==="map")}/>
          <span style={NAV_LBL(viewMode==="map")}>carte</span>
        </button>
        <div style={{width:1,height:32,background:"rgba(0,0,0,0.08)",flexShrink:0,margin:"0 1px"}}/>
        <button onClick={()=>setTri("distance")} style={NAV_BTN(tri==="distance")} aria-label="Trier par distance">
          <i className="ti ti-focus-2" style={NAV_ICO(tri==="distance")}/>
          <span style={NAV_LBL(tri==="distance")}>proche</span>
        </button>
        <button onClick={()=>setTri("remise")} style={NAV_BTN(tri==="remise")} aria-label="Trier par remise">
          <i className="ti ti-currency-euro" style={NAV_ICO(tri==="remise")}/>
          <span style={NAV_LBL(tri==="remise")}>éco. €</span>
        </button>
        <div style={{width:1,height:32,background:"rgba(0,0,0,0.08)",flexShrink:0,margin:"0 1px"}}/>
        {/* Catégories — icônes sans texte, tooltip via title */}
        {catsAvec.map(c=>(
          <button key={c.id} onClick={()=>handleCat(c.id)}
            title={c.label}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,
              padding:"6px 10px",borderRadius:10,border:"none",cursor:"pointer",
              fontFamily:"inherit",flexShrink:0,transition:"all 0.15s",
              background:filterCat===c.id?c.color:`${c.color}15`,
              boxShadow:filterCat===c.id?`0 2px 8px ${c.color}44`:"none"}}>
            {c.icon
              ?<i className={`ti ${c.icon}`} style={{fontSize:20,color:filterCat===c.id?"white":c.color}} aria-hidden="true"/>
              :<span style={{fontSize:18}}>{c.emoji}</span>
            }
            <span style={{fontSize:9,fontWeight:700,color:filterCat===c.id?"white":c.color,whiteSpace:"nowrap"}}>{c.label}</span>
          </button>
        ))}
      </div>

      {/* Types sous-catégorie */}
      {expandedCat&&typesDispo.length>0&&(
        <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2,marginTop:6,paddingLeft:8}}>
          <span style={{color:CS.muted,fontSize:10,whiteSpace:"nowrap",alignSelf:"center"}}>↳</span>
          {typesDispo.map(t=>(
            <button key={t.id} onClick={()=>setFilterType(filterType===t.id?null:t.id)}
              style={{whiteSpace:"nowrap",padding:"4px 10px",borderRadius:16,
                border:`1.5px solid ${filterType===t.id?"#4BA3C3":"#E0E0E0"}`,
                background:filterType===t.id?"#E8F6FC":"#F8F8F8",
                color:filterType===t.id?"#4BA3C3":CS.muted,
                fontSize:11,fontWeight:filterType===t.id?700:400,
                cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}>
              <span style={{fontSize:13}}>{t.emoji}</span><span>{t.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}


/* ══ OFFRE CARD AVEC IMPRESSION TRACKER ═════════════ */
function OffreCardWrapper({o, isSelected, selectedRef, etudiantId, onSelect, children}){
  const impRef = useImpressionTracker(o.id, etudiantId);
  // Combiner les refs
  const combinedRef = useCallback(node=>{
    impRef.current = node;
    if(isSelected && selectedRef) selectedRef.current = node;
  },[isSelected]);

  return(
    <div ref={combinedRef}
      className="siok-card"
      style={{background:"#FFFFFF",borderRadius:20,marginBottom:14,overflow:"hidden",
        boxShadow:isSelected?"0 8px 28px rgba(0,102,255,0.22)":"0 2px 14px rgba(0,0,0,0.07)",
        border:isSelected?"2px solid "+CS.accent:"2px solid transparent",
        transform:isSelected?"scale(1.01)":"scale(1)",transition:"all 0.2s"}}
      onClick={onSelect}>
      {children}
    </div>
  );
}

/* ══ NAV FILTRES (ligne 2 header) ═══════════════════ */
function NavFiltres({nbOffres, tri, setTri, showReco, setShowReco,
  filterCat, setFilterCat, filterType, setFilterType, offres, showPerso, fixNum,
  search, setSearch}){
  const catsAvec = buildCategoriesOffre().filter(c=>offres.some(o=>c.types.includes(o.type_offre)));

  const handleCat=(catId)=>{
    if(filterCat===catId){setFilterCat(null);setFilterType(null);}
    else{setFilterCat(catId);setFilterType(null);}
  };

  // B12 — sous-catégories de la catégorie sélectionnée SEULEMENT
  const allTypes = filterCat
    ? getTypesForCategorie(filterCat).filter(t=>offres.some(o=>o.type_offre===t.id))
    : [];

  // Couleurs icônes par catégorie (sport = bleu foncé)
  const catColors={restauration:"#14B8A6",soins:"#EC4899",loisirs:"#8B5CF6",sport:"#1E40AF",services:"#22C55E",sante:"#F59E0B",hebergement:"#3B82F6"};

  // Style pill horizontal
  const PILL = (active, color="#4D9EFF")=>({
    display:"flex",flexDirection:"row",alignItems:"center",gap:5,
    padding:"12px 11px",borderRadius:50,border:"none",
    background:active?"rgba(0,102,255,0.08)":"#FFFFFF",
    cursor:"pointer",fontFamily:"inherit",flexShrink:0,
    boxShadow:active?"0 2px 6px rgba(0,102,255,0.12)":"0 1px 4px rgba(0,0,0,0.08)",
    transition:"all 0.18s",whiteSpace:"nowrap"
  });

  // Style sous-catégories — cercle + texte dessous
  const PILL2 = (active)=>({
    display:"flex",flexDirection:"column",alignItems:"center",gap:4,
    padding:"6px 4px",borderRadius:8,border:"none",
    background:"transparent",
    cursor:"pointer",fontFamily:"inherit",flexShrink:0,width:56,
    transition:"all 0.18s"
  });

  // Bleu clair sélection
  const BLUE_LIGHT = "#4D9EFF";

  return(
    <div>
      {/* Ligne 1 — bouton cycle + catégories */}
      <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:6,alignItems:"center",paddingTop:4}}>
        {/* Bouton cycle Proche → Éco€ → Éco% → Pop */}
        {(()=>{
          const modes=[
            {key:"distance",  label:"Proche", icon:"ti-focus-2"},
            {key:"remise",    label:"Éco",    icon:"ti-currency-euro"},
            {key:"remisePct", label:"% Éco",  icon:"ti-percent"},
            {key:"pop",       label:"Pop",    icon:"ti-flame"},
          ];
          const currentIdx = showReco==="pop" ? 3 : tri==="remisePct" ? 2 : tri==="remise" ? 1 : 0;
          const current = modes[currentIdx];
          const handleCycle=()=>{
            if(currentIdx===0){setTri("remise");setShowReco(false);}
            else if(currentIdx===1){setTri("remisePct");setShowReco(false);}
            else if(currentIdx===2){setShowReco("pop");setTri("distance");}
            else{setShowReco(false);setTri("distance");}
          };
          return(
            <button onClick={handleCycle} style={PILL(false)}>
              <i className={`ti ${current.icon}`} style={{fontSize:22,color:"#374151",lineHeight:1}}/>
              <span style={{fontSize:14,fontWeight:800,color:"#374151"}}>{current.label}</span>
            </button>
          );
        })()}
        {showPerso&&(
          <button onClick={()=>setShowReco(showReco==="perso"?false:"perso")} style={PILL(showReco==="perso")}>
            <span style={{fontSize:22,lineHeight:1}}>✨</span>
            <span style={{fontSize:14,fontWeight:800,color:showReco==="perso"?"white":"#374151"}}>Pour toi</span>
          </button>
        )}
        <div style={{width:1,height:28,background:"rgba(0,0,0,0.1)",flexShrink:0,alignSelf:"center"}}/>
        {/* Catégories — icône colorée, texte noir */}
        {catsAvec.map(c=>{
          const active=filterCat===c.id;
          const col=catColors[c.id]||"#374151";
          return(
            <button key={c.id} onClick={()=>handleCat(c.id)} style={PILL(active)}>
              <CatIcon catId={c.id} size={22} color={active?"#0066FF":col}/>
              <span style={{fontSize:14,fontWeight:800,color:active?"#0066FF":"#374151"}}>{c.label}</span>
            </button>
          );
        })}
        {fixNum&&<span style={{fontSize:9,fontWeight:700,color:"#C0C0C0",flexShrink:0,marginLeft:4}}>{fixNum}</span>}
      </div>
      {/* Ligne 2 — recherche + sous-catégories */}
      <div style={{display:"flex",gap:5,overflowX:"auto",paddingTop:4,paddingBottom:4,alignItems:"center"}}>
        {/* Zone de recherche */}
        <div style={{display:"flex",alignItems:"center",gap:6,background:"#FFFFFF",borderRadius:50,padding:"6px 12px",boxShadow:"0 1px 4px rgba(0,0,0,0.08)",flexShrink:0,minWidth:120}}>

            style={{border:"none",outline:"none",fontSize:13,background:"transparent",width:90,fontFamily:"inherit",color:"#1A1A2E"}}/>
          {search&&<button onClick={()=>setSearch("")} style={{border:"none",background:"transparent",cursor:"pointer",color:"#9CA3AF",fontSize:14,padding:0,lineHeight:1}}>✕</button>}
        </div>

          return(
            <button key={t.id} onClick={()=>setFilterType(active?null:t.id)} style={PILL2(active)}>
              <div style={{width:44,height:44,borderRadius:"50%",
                background:active?"rgba(0,102,255,0.08)":"#FFFFFF",
                border:active?"2px solid #4D9EFF":"2px solid #E5E7EB",
                display:"flex",alignItems:"center",justifyContent:"center",
                boxShadow:"none",
                transition:"all 0.18s"}}>
                {t.id==="barbier"
                  ?<IcoBarberPole size={26} color={active?"#0066FF":"#8B5CF6"}/>
                  :<span style={{fontSize:24,lineHeight:1}}>{t.emoji}</span>
                }
              </div>
              <span style={{fontSize:9,fontWeight:700,color:active?"#0066FF":"#374151",
                whiteSpace:"nowrap",maxWidth:52,overflow:"hidden",textOverflow:"ellipsis",textAlign:"center",marginTop:2}}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ══ CARTE EXPLORATEUR — Non connecté, clustering ═══ */
function LeafletMapExplorer({offres,city,height,userLocation}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const clusterRef=useRef(null);
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];

  useEffect(()=>{
    if(mapObj.current)return;
    mapObj.current=L.map(mapRef.current,{zoomControl:false,attributionControl:false})
      .setView(userLocation?[userLocation.lat,userLocation.lng]:[cityData.lat,cityData.lng],15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    L.control.zoom({position:"bottomright"}).addTo(mapObj.current);
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),200);
  },[]);

  useEffect(()=>{
    if(!mapObj.current)return;
    if(clusterRef.current)mapObj.current.removeLayer(clusterRef.current);
    const cluster=L.markerClusterGroup({
      maxClusterRadius:50,
      iconCreateFunction:function(c){
        return L.divIcon({
          className:"",
          html:`<div style="width:40px;height:40px;border-radius:50%;background:rgba(0,102,255,0.85);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:3px solid white;box-shadow:0 2px 10px rgba(0,102,255,0.4);">${c.getChildCount()}</div>`,
          iconSize:[40,40],iconAnchor:[20,20]
        });
      }
    });
    offres.forEach(o=>{
      if(!o.lat||!o.lng)return;
      const type=getTypeMetier(o.type_offre);
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:32px;height:32px;border-radius:50%;background:rgba(${type.color==="#EF4444"?"249,115,22":type.color==="#EC4899"?"236,72,153":type.color==="#8B5CF6"?"139,92,246":"0,102,255"},0.5);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid white;box-shadow:0 1px 6px rgba(0,0,0,0.2);">${type.emoji}</div>`,
        iconSize:[32,32],iconAnchor:[16,16]
      });
      const m=L.marker([o.lat,o.lng],{icon});
      m.on("click",()=>{ if(onSelect) onSelect(o); });
      cluster.addLayer(m);
    });
    if(userLocation){
      L.circleMarker([userLocation.lat,userLocation.lng],{radius:8,fillColor:"#0066FF",color:"white",weight:3,fillOpacity:1}).addTo(mapObj.current);
    }
    mapObj.current.addLayer(cluster);
    clusterRef.current=cluster;
  },[offres,userLocation]);

  return <div ref={mapRef} style={{height:height||"100%",width:"100%"}}/>;
}

/* ══ CARTE CONNECTÉ — Pins cliquables ═══════════════ */
function LeafletMapConnecte({offres,selected,onSelect,city,height=300,userLocation,visible}){
  const mapRef=useRef(null);
  const mapObj=useRef(null);
  const markersRef=useRef({});
  const cityData=CITIES.find(c=>c.id===city)||CITIES[0];

  useEffect(()=>{
    if(!mapObj.current){
      mapObj.current=L.map(mapRef.current,{zoomControl:true,attributionControl:true})
        .setView(userLocation?[userLocation.lat,userLocation.lng]:[cityData.lat,cityData.lng],15);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:19}).addTo(mapObj.current);
    }
    // ResizeObserver pour invalidateSize dès que le conteneur a ses vraies dimensions
    const ro=new ResizeObserver(()=>{
      if(mapObj.current) mapObj.current.invalidateSize();
    });
    if(mapRef.current) ro.observe(mapRef.current);
    return ()=>ro.disconnect();
  },[]);

  useEffect(()=>{
    if(!mapObj.current||!visible)return;
    setTimeout(()=>mapObj.current&&mapObj.current.invalidateSize(),50);
  },[visible]);

  useEffect(()=>{
    if(!mapObj.current)return;
    Object.values(markersRef.current).forEach(m=>m.remove());
    markersRef.current={};
    offres.forEach(o=>{
      if(!o.lat||!o.lng)return;
      const type=getTypeMetier(o.type_offre);
      const isSel=selected?.id===o.id;
      const icon=L.divIcon({
        className:"",
        html:`<div style="width:${isSel?44:36}px;height:${isSel?44:36}px;border-radius:50%;background:${isSel?"#0066FF":type.color};display:flex;align-items:center;justify-content:center;font-size:${isSel?20:15}px;border:${isSel?"3px":"2px"} solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:all 0.2s;">${type.emoji}</div>`,
        iconSize:[isSel?44:36,isSel?44:36],iconAnchor:[isSel?22:18,isSel?22:18],
      });
      const marker=L.marker([o.lat,o.lng],{icon}).addTo(mapObj.current);
      marker.on("click",()=>onSelect(o));
      markersRef.current[o.id]=marker;
    });
    if(userLocation){
      L.circleMarker([userLocation.lat,userLocation.lng],{radius:8,fillColor:"#0066FF",color:"white",weight:2,fillOpacity:1}).addTo(mapObj.current);
    }
  },[offres,selected]);

  return <div ref={mapRef} style={{height:height,width:"100%",borderRadius:16,overflow:"hidden",position:"relative",zIndex:1}}/>;
}

/* ══ MAP CONTAINER — mesure hauteur réelle pour Leaflet ═════ */
function MapContainer({offres, selected, onSelect, city, userLocation}){
  const containerRef = useRef(null);
  const [height, setHeight] = useState(400);

  useEffect(()=>{
    const BOTTOM_BAR = 64;
    const measure=()=>{
      if(containerRef.current){
        const rect=containerRef.current.getBoundingClientRect();
        // Hauteur disponible = bas de l'écran - position du haut du conteneur - bandeau bas
        const h=window.innerHeight - rect.top - BOTTOM_BAR;
        if(h>100) setHeight(h);
      }
    };
    measure();
    const ro=new ResizeObserver(measure);
    if(containerRef.current) ro.observe(containerRef.current);
    return ()=>ro.disconnect();
  },[]);

  return(
    <div ref={containerRef} style={{flex:1,minHeight:0,position:"relative",zIndex:1}}>
      <LeafletMapConnecte offres={offres} selected={selected}
        onSelect={onSelect} city={city}
        height={height} userLocation={userLocation} visible={true}/>
    </div>
  );
}

/* ══ HOOK CHARGEMENT OFFRES (partagé) ════════════════ */
function useOffres(city, userLocation){
  const [offres,setOffres]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const cityData=CITIES.find(c=>c.id===city)||CITIES[0];
      const [{data:offresData},{data:prestData}]=await Promise.all([
        db().from("offres").select("*").eq("active",true).gt("promo_pct",0).order("created_at",{ascending:false}),
        db().from("prestataires").select("id,nom,adresse,ville,telephone,lat,lng,type_metier,photos"),
      ]);
      const prestMap={};
      (prestData||[]).forEach(p=>{prestMap[p.id]=p;});
      if(offresData){
        const enriched=offresData
          .filter(o=>isOffreVisible(o))
          .map(o=>{
            const p=prestMap[o.prestataire_id]||{};
            return{...o,lat:p.lat||null,lng:p.lng||null,prestataire_nom:p.nom||"",adresse:p.adresse||"",ville:p.ville||"",telephone:p.telephone||"",type_offre:o.type_offre||p.type_metier||"autre"};
          })
          .filter(o=>{
            if(!o.lat||!o.lng){ console.warn("Offre sans coordonnées:",o.titre,o.prestataire_id); return false; }
            const d=distanceM(cityData.lat,cityData.lng,o.lat,o.lng);
            return d<25000; // 25km de rayon
          })
          .sort((a,b)=>{
            if(!userLocation)return 0;
            return distanceM(userLocation.lat,userLocation.lng,a.lat,a.lng)-distanceM(userLocation.lat,userLocation.lng,b.lat,b.lng);
          });
        setOffres(enriched);
      }
    }catch(e){console.error("useOffres:",e);}
    setLoading(false);
  },[city]);

  useEffect(()=>{load();},[load]);
  return {offres,loading,reload:load};
}



/* ══ VISITE CARD — Avis + Photo ════════════════════ */
function VisiteCard({visite:v, type, etudiantId, onUpdated}){
  const [showAvis,setShowAvis]=useState(false);
  const [avis,setAvis]=useState(v.avis||"");
  const [note,setNote]=useState(v.note||0);
  const [saving,setSaving]=useState(false);
  const [uploadingPhoto,setUploadingPhoto]=useState(false);

  const submitAvis=async()=>{
    if(!avis.trim()&&!note)return;
    setSaving(true);
    try{
      const updateData={};
      if(avis.trim()) updateData.avis=avis.trim();
      if(note) updateData.note=note;
      await db().from("visites").update(updateData).eq("id",v.id);

      // Recalculer la note moyenne sur l'offre
      if(note&&v.offre_id){
        const {data:allAvis}=await db().from("visites")
          .select("note").eq("offre_id",v.offre_id).not("note","is",null);
        if(allAvis&&allAvis.length>0){
          const moy=allAvis.reduce((s,a)=>s+(a.note||0),0)/allAvis.length;
          await db().from("offres").update({
            note_moyenne:Math.round(moy*10)/10,
            nb_avis:allAvis.length
          }).eq("id",v.offre_id);
        }
      }

      if(!v.avis&&!v.note){
        const {data:et}=await db().from("etudiants").select("points").eq("id",etudiantId).single();
        if(et){
          const newPts=(et.points||0)+2;
          await db().from("etudiants").update({points:newPts}).eq("id",etudiantId);
          try{const s=localStorage.getItem("stu10_etudiant");if(s){const e=JSON.parse(s);e.points=newPts;localStorage.setItem("stu10_etudiant",JSON.stringify(e));}}catch(ex){}
        }
        await db().from("visites").update({points:(v.points||0)+2,points_avis:2}).eq("id",v.id);
        onUpdated({...updateData,points:(v.points||0)+2,note});
      }else{
        onUpdated({...updateData,note});
      }
      setShowAvis(false);
    }catch(e){console.error(e);}
    setSaving(false);
  };

  const uploadPhoto=async(file)=>{
    setUploadingPhoto(true);
    try{
      const path=`visites/${v.id}/${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi,"_")}`;
      const {error:upErr}=await db().storage.from("siok-offer-photos").upload(path,file,{contentType:file.type,upsert:false});
      if(upErr)throw upErr;
      const photoUrl=`${window.SUPABASE_URL}/storage/v1/object/public/siok-offer-photos/${path}`;
      await db().from("visites").update({photo_url:photoUrl}).eq("id",v.id);
      if(!v.photo_url){
        // +2 points si première photo
        const {data:et}=await db().from("etudiants").select("points").eq("id",etudiantId).single();
        if(et){
          const newPts=(et.points||0)+2;
          await db().from("etudiants").update({points:newPts}).eq("id",etudiantId);
          try{const s=localStorage.getItem("stu10_etudiant");if(s){const e=JSON.parse(s);e.points=newPts;localStorage.setItem("stu10_etudiant",JSON.stringify(e));}}catch(ex){}
        }
        await db().from("visites").update({points:(v.points||0)+2}).eq("id",v.id);
        onUpdated({photo_url:photoUrl,points:(v.points||0)+2});
      }else{
        onUpdated({photo_url:photoUrl});
      }
    }catch(e){console.error(e);}
    setUploadingPhoto(false);
  };

  return(
    <div style={{background:"#FFFFFF",borderRadius:16,marginBottom:12,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,0.07)"}}>
      {/* Photo si présente */}
      {v.photo_url&&(
        <img src={v.photo_url} alt="" onError={e=>e.target.style.display="none"}
          style={{width:"100%",height:120,objectFit:"cover"}}/>
      )}
      <div style={{padding:"12px 14px"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
          <div style={{width:44,height:44,borderRadius:12,background:bannerColorSiok(v.offres?.titre||""),display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
            {type.emoji}
          </div>
          <div style={{flex:1}}>
            <div style={{color:CS.text,fontWeight:700,fontSize:14}}>{v.offres?.titre||"Offre"}</div>
            <div style={{color:CS.muted,fontSize:12}}>{v.prestataires?.nom||"Prestataire"}</div>
            <div style={{color:CS.muted,fontSize:11,marginTop:1}}>
              {new Date(v.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"long"})} à {new Date(v.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
            </div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            {v.offres?.prix&&<div style={{color:CS.accent,fontWeight:800,fontSize:14}}>{v.offres.prix}€</div>}
            <div style={{background:"rgba(0,102,255,0.1)",color:CS.accent,fontSize:11,fontWeight:800,padding:"2px 8px",borderRadius:20,marginTop:2}}>
              +{v.points||0}⭐
            </div>
          </div>
        </div>

        {/* Avis + note existants */}
        {(v.avis||v.note)&&(
          <div style={{background:"#F8F8F8",borderRadius:10,padding:"8px 12px",marginBottom:8}}>
            {v.note&&<div style={{marginBottom:4}}><StarRating value={v.note} readOnly={true} size={14}/></div>}
            {v.avis&&<div style={{fontSize:13,color:CS.text,fontStyle:"italic"}}>💬 "{v.avis}"</div>}
          </div>
        )}

        {/* Boutons actions */}
        <div style={{display:"flex",gap:8}}>
          {!v.avis&&(
            <button onClick={()=>setShowAvis(v=>!v)}
              style={{flex:1,padding:"8px 0",borderRadius:10,border:"1.5px solid #E8E8E8",background:showAvis?CS.accentSoft:"transparent",color:showAvis?CS.accent:CS.muted,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              💬 Avis +2⭐
            </button>
          )}
          {!v.photo_url&&(
            <label style={{flex:1,padding:"8px 0",borderRadius:10,border:"1.5px solid #E8E8E8",background:"transparent",color:CS.muted,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textAlign:"center",display:"block"}}>
              <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&uploadPhoto(e.target.files[0])}/>
              {uploadingPhoto?"⏳…":"📸 Photo +2⭐"}
            </label>
          )}
          {v.avis&&v.photo_url&&(
            <div style={{color:"#22C55E",fontSize:12,fontWeight:700,padding:"8px 0"}}>✅ Merci pour votre contribution !</div>
          )}
        </div>

        {/* Champ avis + note */}
        {showAvis&&!v.avis&&(
          <div style={{marginTop:8}}>
            <div style={{marginBottom:8}}>
              <div style={{color:CS.muted,fontSize:12,marginBottom:4}}>Notez votre expérience</div>
              <StarRating value={note} onChange={setNote} size={28}/>
            </div>
            <input value={avis} onChange={e=>setAvis(e.target.value.slice(0,120))}
              placeholder="Votre avis en une ligne… (120 caractères max)"
              maxLength={120}
              style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #E8E8E8",fontSize:13,fontFamily:"inherit",outline:"none",background:"#FAFAFA"}}/>
            <div style={{display:"flex",gap:8,marginTop:6}}>
              <button onClick={submitAvis} disabled={(!avis.trim()&&!note)||saving}
                style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",background:CS.accent,color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:(!avis.trim()&&!note)?0.4:1}}>
                {saving?"…":"Envoyer +2⭐"}
              </button>
              <button onClick={()=>{setShowAvis(false);setAvis(v.avis||"");setNote(0);}}
                style={{padding:"9px 14px",borderRadius:10,border:"1.5px solid #E8E8E8",background:"transparent",color:CS.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>
                Annuler
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ SIMULATEUR QR PRESTATAIRE ══════════════════════ */
function QRSimulateur({prestataireId, onScanned, onClose}){
  const [input,setInput]=useState("");
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [saving,setSaving]=useState(false);

  const simulate=async()=>{
    setError("");setResult(null);
    const qr=validateQRData(input.trim());
    if(!qr||qr.error){setError(qr?.error||"QR code invalide");return;}
    setSaving(true);
    try{
      const {data:offre, error:offreErr}=await db().from("offres").select("titre,prix,promo_pct").eq("id",qr.offre_id).single();
      if(offreErr) throw new Error("Offre introuvable: "+offreErr.message);
      const {data:existing}=await db().from("visites")
        .select("id")
        .eq("offre_id",qr.offre_id)
        .eq(qr.etudiant_id?"etudiant_id":"etudiant_anon_id",qr.etudiant_id||"anon")
        .gte("created_at",new Date(qr.ts).toISOString())
        .lte("created_at",new Date(qr.exp).toISOString());
      if(existing&&existing.length>0) throw new Error("Ce QR code a déjà été validé.");
      const {error:insertErr}=await db().from("visites").insert({
        offre_id:qr.offre_id,
        prestataire_id:prestataireId,
        etudiant_id:qr.etudiant_id||null,
        etudiant_anon_id:qr.etudiant_id?null:"anon",
        points:qr.etudiant_id?1:0,
      });
      if(insertErr) throw new Error("Erreur insert: "+insertErr.message);
      if(qr.etudiant_id){
        const {data:et}=await db().from("etudiants").select("points").eq("id",qr.etudiant_id).maybeSingle();
        if(et) await db().from("etudiants").update({points:(et.points||0)+1}).eq("id",qr.etudiant_id);
      }
      setResult({offre,etudiant_id:qr.etudiant_id});
      onScanned&&onScanned();
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  return(
    <div style={{background:C.card,border:`1px solid rgba(234,179,8,0.3)`,borderRadius:16,padding:16,marginBottom:16}}>
      <div style={{color:"#eab308",fontSize:12,fontWeight:700,marginBottom:10}}>🧪 Mode test — Simulateur QR</div>
      <div style={{color:C.muted,fontSize:11,marginBottom:10,lineHeight:1.5}}>
        Copiez le contenu du QR depuis la console étudiant et collez-le ici pour simuler un scan.
      </div>
      <textarea value={input} onChange={e=>setInput(e.target.value)}
        placeholder='{"type":"siok_visite","offre_id":"...","etudiant_id":"...","ts":...,"token":"...","exp":...}'
        rows={3}
        style={{width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:11,fontFamily:"monospace",outline:"none",resize:"vertical",marginBottom:8}}/>
      {error&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>⚠️ {error}</div>}
      {result&&(
        <div style={{background:"rgba(34,197,94,0.1)",borderRadius:10,padding:"10px 12px",marginBottom:8}}>
          <div style={{color:"#22c55e",fontWeight:700,fontSize:13}}>✅ Visite validée — {result.offre?.titre}</div>
          <div style={{color:C.muted,fontSize:11,marginTop:2}}>{result.etudiant_id?"🎓 +1 point crédité":"👤 Visite anonyme"}</div>
        </div>
      )}
      <div style={{display:"flex",gap:8}}>
        <button onClick={simulate} disabled={!input.trim()||saving}
          style={{flex:1,padding:"9px 0",borderRadius:10,border:"none",background:"rgba(234,179,8,0.2)",color:"#eab308",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:!input.trim()?0.5:1}}>
          {saving?"Validation…":"Valider le QR"}
        </button>
        <button onClick={onClose}
          style={{padding:"9px 14px",borderRadius:10,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
          Fermer
        </button>
      </div>
    </div>
  );
}

  const [viewMode,setViewMode]=useState("list"); // list | map
  const [filterCat,setFilterCat]=useState(null);

  useEffect(()=>{
    navigator.geolocation?.getCurrentPosition(
      p=>setUserLocation({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>{}
    );
    // Enregistrer le scan landing + déconnecter session existante
    if(window.LANDING_MODE){
      db().auth.signOut().then(()=>{});
      db().from("scans_landing").insert({reponse:"scan"}).then(()=>{});
    }
  },[]);

  // Détection scroll pour rétraction header
  const listRef = useRef(null);
  useEffect(()=>{
    const el = listRef.current;
    if(!el) return;
    const onScroll=()=>setScrolled(el.scrollTop>60);
    el.addEventListener("scroll", onScroll, {passive:true});
    return ()=>el.removeEventListener("scroll", onScroll);
  },[]);

  // Filtrage par catégorie / type
  const filtered=offres.filter(o=>{
    if(!o.active) return false;
    if(filterType) return o.type_offre===filterType;
    if(filterCat){
      const cat=buildCategoriesOffre().find(c=>c.id===filterCat);
      if(cat&&!cat.types.includes(o.type_offre)) return false;
    }
    if(search&&search.trim()){
      const q=search.trim().toLowerCase();
      const type=getTypeMetier(o.type_offre);
      const cat=getCategorieForType(o.type_offre);
      return (o.titre||"").toLowerCase().includes(q)
        ||(o.prestataire_nom||"").toLowerCase().includes(q)
        ||(type?.label||"").toLowerCase().includes(q)
        ||(cat?.label||"").toLowerCase().includes(q);
    }
    return true;
  }).sort((a,b)=>{
    if(tri==="remise"||tri==="remisePct") return (b.promo_pct||0)-(a.promo_pct||0);
    if(!userLocation) return 0;
    const dA=a.lat?distanceM(userLocation.lat,userLocation.lng,a.lat,a.lng):99999;
    const dB=b.lat?distanceM(userLocation.lat,userLocation.lng,b.lat,b.lng):99999;
    return dA-dB;
  });

  return(
    <div style={{minHeight:"100vh",background:window.SIOK_PARAMS?.fond_couleur||"#F5F5F5",display:"flex",flexDirection:"column",isolation:"isolate"}}>

        {/* Filtres — toujours visibles */}

          <NavFiltres nbOffres={filtered.filter(o=>o.active!==false).length}
            tri={tri} setTri={setTri} showReco={showReco} setShowReco={setShowReco}
            filterCat={filterCat} setFilterCat={setFilterCat}
            filterType={filterType} setFilterType={setFilterType}
            offres={offres} showPerso={false} fixNum="#327"
            search={search} setSearch={setSearch}/>
        </div>
      </div>

      {/* Contenu */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Carte plein écran */}
        {viewMode==="map"&&(
          <MapContainer offres={filtered} selected={selected}
            onSelect={setSelected} city={city} userLocation={userLocation}/>

        <div ref={listRef} style={{display:viewMode==="list"?"flex":"none",flexDirection:"column",flex:1,overflowY:"auto",paddingBottom:90}}>

        {loading&&(
          <div style={{textAlign:"center",padding:"40px 0",color:CS.muted}}>
            <div style={{width:32,height:32,border:"3px solid #E8E8E8",borderTopColor:CS.accent,borderRadius:"50%",margin:"0 auto 12px",animation:"spin 0.8s linear infinite"}}/>

          </div>
        )}

        {/* Liste — masquée si showReco actif */}
        {!loading&&viewMode==="list"&&(
          <div style={{padding:"12px 16px 0"}}>
            {/* Compteur offres — fondu avant la liste */}

              <div style={{marginBottom:12,paddingLeft:4}}>
                <span style={{fontSize:13,fontWeight:700,color:"#1A1A2E",background:"rgba(255,255,255,0.85)",padding:"2px 10px",borderRadius:20}}>{filtered.length} offre{filtered.length>1?"s":""} disponible{filtered.length>1?"s":""}</span>

function ModalCadeaux({etudiant, totalPoints, onClose, onPointsDeduits}){

    {pts:250, montant:10, label:"Bon cadeau 10€"},
    {pts:500, montant:40, label:"Bon cadeau 40€"},
