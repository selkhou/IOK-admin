// ── Bar Chart SVG ─────────────────────────────────────────
function SVGBarChart({data, keys, colors, height=200}){
  if(!data||data.length===0) return(
    <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:13}}>Aucune donnée</div>
  );
  const maxVal = Math.max(...data.flatMap(d => keys.map(k => d[k]||0)), 1);
  const W = 300, H = height - 40;
  const barW = Math.min(30, (W / data.length / keys.length) - 4);
  const groupW = W / data.length;

  return(
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${Math.max(300, data.length*80)} ${height}`} style={{width:"100%",height}}>
        {/* Grille */}
        {[0,25,50,75,100].map(pct=>{
          const y = 20 + H*(1-pct/100);
          return <line key={pct} x1="30" y1={y} x2={Math.max(300,data.length*80)-10} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>;
        })}
        {/* Barres */}
        {data.map((d,i)=>{
          const gx = 30 + i * (Math.max(300,data.length*80)-40) / data.length;
          return(
            <g key={i}>
              {keys.map((k,ki)=>{
                const val = d[k]||0;
                const bh = Math.max(2, (val/maxVal)*H);
                const bx = gx + ki*(barW+3);
                const by = 20 + H - bh;
                return(
                  <g key={k}>
                    <rect x={bx} y={by} width={barW} height={bh} fill={colors[ki]||"#3b82f6"} rx="3"/>
                    {val>0&&<text x={bx+barW/2} y={by-3} textAnchor="middle" fontSize="9" fill={colors[ki]}>{val}</text>}
                  </g>
                );
              })}
              <text x={gx + keys.length*(barW+3)/2} y={height-5} textAnchor="middle" fontSize="10" fill={C.muted}>{String(d[Object.keys(d)[0]]).slice(0,8)}</text>
            </g>
          );
        })}
        {/* Axe Y */}
        {[0,Math.round(maxVal/2),maxVal].map((v,i)=>{
          const y = 20 + H*(1-v/maxVal);
          return <text key={i} x="25" y={y+4} textAnchor="end" fontSize="9" fill={C.muted}>{v}</text>;
        })}
      </svg>
      {/* Légende */}
      <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:4}}>
        {keys.map((k,i)=>(
          <span key={k} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.muted}}>
            <span style={{width:10,height:10,borderRadius:2,background:colors[i],display:"inline-block"}}/>
            {k}
          </span>
        ))}
      </div>
    </div>
  );
}

// ── Pie Chart SVG ─────────────────────────────────────────
function SVGPieChart({data, height=200}){
  if(!data||data.length===0) return(
    <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:13}}>Aucune donnée</div>
  );
  const total = data.reduce((s,d)=>s+(d.value||0),0);
  if(total===0) return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:13}}>Aucune donnée</div>;

  const cx=100, cy=height/2, r=70, ri=40;
  let angle = -Math.PI/2;

  const slices = data.map(d=>{
    const pct = d.value/total;
    const start = angle;
    angle += pct*2*Math.PI;
    const end = angle;
    const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end),   y2=cy+r*Math.sin(end);
    const xi1=cx+ri*Math.cos(start),yi1=cy+ri*Math.sin(start);
    const xi2=cx+ri*Math.cos(end),  yi2=cy+ri*Math.sin(end);
    const large = pct>0.5?1:0;
    const path = `M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${large} 0 ${xi1},${yi1} Z`;
    const midA = start+(end-start)/2;
    return {...d, path, pct, midA};
  });

  return(
    <div style={{display:"flex",alignItems:"center",gap:16}}>
      <svg viewBox={`0 0 200 ${height}`} style={{width:200,height,flexShrink:0}}>
        {slices.map((s,i)=>(
          <path key={i} d={s.path} fill={s.color||"#3b82f6"} stroke={C.card} strokeWidth="2"/>
        ))}
        <text x={cx} y={cy-6} textAnchor="middle" fontSize="18" fontWeight="bold" fill={C.text}>{total}</text>
        <text x={cx} y={cy+12} textAnchor="middle" fontSize="10" fill={C.muted}>total</text>
      </svg>
      <div style={{flex:1}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
            <span style={{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}/>
            <span style={{fontSize:12,color:C.sub,flex:1}}>{s.name}</span>
            <span style={{fontSize:12,fontWeight:700,color:C.text}}>{s.value}</span>
            <span style={{fontSize:11,color:C.muted}}>({Math.round(s.pct*100)}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Line Chart SVG ────────────────────────────────────────
function SVGLineChart({data, lines, height=200}){
  if(!data||data.length===0) return(
    <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:13}}>Aucune donnée</div>
  );
  const W=300, H=height-50, PAD=30;
  const allVals = data.flatMap(d=>lines.map(l=>d[l.key]||0));
  const maxVal = Math.max(...allVals, 1);
  const xStep = (W-PAD) / Math.max(data.length-1, 1);

  const getX = i => PAD + i*xStep;
  const getY = v => 20 + H*(1-(v/maxVal));

  return(
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${height}`} style={{width:"100%",height}}>
        {/* Grille */}
        {[0,25,50,75,100].map(pct=>{
          const y=20+H*(1-pct/100);
          return <line key={pct} x1={PAD} y1={y} x2={W} y2={y} stroke="rgba(255,255,255,0.06)" strokeWidth="1"/>;
        })}
        {/* Lignes */}
        {lines.map(l=>{
          const pts = data.map((d,i)=>`${getX(i)},${getY(d[l.key]||0)}`).join(' ');
          return(
            <g key={l.key}>
              <polyline points={pts} fill="none" stroke={l.color} strokeWidth="2" strokeLinejoin="round"/>
              {data.map((d,i)=>(
                <circle key={i} cx={getX(i)} cy={getY(d[l.key]||0)} r="3" fill={l.color}/>
              ))}
            </g>
          );
        })}
        {/* Labels X */}
        {data.map((d,i)=>(
          <text key={i} x={getX(i)} y={height-5} textAnchor="middle" fontSize="9" fill={C.muted}>{String(d.mois||d[Object.keys(d)[0]]).slice(0,6)}</text>
        ))}
        {/* Labels Y */}
        {[0,Math.round(maxVal/2),maxVal].map((v,i)=>{
          const y=20+H*(1-v/maxVal);
          return <text key={i} x={PAD-4} y={y+4} textAnchor="end" fontSize="9" fill={C.muted}>{v}</text>;
        })}
      </svg>
      {/* Légende */}
      <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:4}}>
        {lines.map(l=>(
          <span key={l.key} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.muted}}>
            <span style={{width:16,height:3,background:l.color,display:"inline-block",borderRadius:2}}/>
            {l.label}
          </span>
        ))}
      </div>
    </div>
  );
}

// ── Table component ──────────────────────────────────────────
function DataTable({columns, data, onSearch, searchPlaceholder, emptyMsg}){
  const [search,setSearch]=useState("");
  const filtered=data.filter(row=>
    columns.some(col=>{
      const val=col.accessor?row[col.accessor]:"";
      return String(val||"").toLowerCase().includes(search.toLowerCase());
    })
  );
  return(
    <div>
      {onSearch!==false&&(
        <div style={{marginBottom:12}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={searchPlaceholder||"Rechercher..."}
            style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",color:C.text,fontSize:14,outline:"none",fontFamily:"inherit"}}/>
        </div>
      )}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead>
            <tr style={{borderBottom:`1px solid ${C.border}`}}>
              {columns.map(col=><th key={col.key} style={{padding:"10px 12px",textAlign:"left",color:C.muted,fontWeight:600,fontSize:11,letterSpacing:1,textTransform:"uppercase",whiteSpace:"nowrap"}}>{col.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={columns.length} style={{padding:"40px",textAlign:"center",color:C.muted}}>{emptyMsg||"Aucun résultat"}</td></tr>}
            {filtered.map((row,i)=>(
              <tr key={i} style={{borderBottom:`1px solid ${C.border}`,transition:"background 0.1s"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.03)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {columns.map(col=>(
                  <td key={col.key} style={{padding:"10px 12px",color:C.text,whiteSpace:col.wrap?"normal":"nowrap"}}>
                    {col.render?col.render(row):row[col.accessor]||"-"}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{color:C.muted,fontSize:11,marginTop:8,textAlign:"right"}}>{filtered.length} résultat{filtered.length>1?"s":""}</div>
    </div>
  );
}

/* ══ CARTE ADMIN AVEC CLUSTERING ════════════════════════════ */
function AdminMap({restaurants, restaurateurs}){
  const mapRef = useRef(null);
  const instanceRef = useRef(null);
  const markersRef = useRef([]);
  const [filter, setFilter] = useState({plan:"Tous", dispo:"Tous", ville:""});
  const [stats, setStats] = useState({total:0, abonnes:0, dispos:0});

  // Couleur marqueur selon statut
  const getColor = (r) => {
    if(!r._iok) return "#9ca3af";           // gris = non inscrit
    if(r.disponible && r.disponible_jusqu && new Date(r.disponible_jusqu) > new Date())
      return "#22c55e";                      // vert = disponible
    return "#ef4444";                        // rouge = indisponible
  };

  // Filtre les restaurants
  const filtered = useMemo(()=>{
    return restaurants.filter(r=>{
      if(filter.plan !== "Tous"){
        if(filter.plan === "non_inscrit" && r._iok) return false;
        if(filter.plan !== "non_inscrit" && r._plan !== filter.plan) return false;
      }
      if(filter.dispo === "dispo" && !(r.disponible && r.disponible_jusqu && new Date(r.disponible_jusqu)>new Date())) return false;
      if(filter.dispo === "indispo" && (r.disponible && r.disponible_jusqu && new Date(r.disponible_jusqu)>new Date())) return false;
      if(filter.ville && !r.ville?.toLowerCase().includes(filter.ville.toLowerCase())) return false;
      return true;
    });
  }, [restaurants, filter]);

  // Init carte
  useEffect(()=>{
    if(!mapRef.current || instanceRef.current) return;
    const L = window.L;
    const map = L.map(mapRef.current, {
      center: [46.6034, 1.8883], zoom: 6,  // Centre France
      zoomControl: true, attributionControl: true
    });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19, attribution:"© OpenStreetMap"
    }).addTo(map);
    map.on("zoomend", ()=>{
      const z = map.getZoom();
      zoomRef.current = z;
      setZoom(z);
    });
    instanceRef.current = map;
    setTimeout(()=>map.invalidateSize(), 200);
    return ()=>{ map.remove(); instanceRef.current = null; };
  },[]);

  // Zoom via ref pour déclencher re-render fiable
  const [zoom, setZoom] = useState(6);
  const zoomRef = useRef(6);

  // Met à jour les marqueurs avec clustering manuel
  useEffect(()=>{
    const map = instanceRef.current;
    if(!map || !window.L) return;

    // Supprime anciens marqueurs
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current = [];

    if(zoom < 13){
      // ── MODE CLUSTER : regroupe par ville ────────────────
      const byVille = {};
      filtered.forEach(r=>{
        if(!r.latitude || !r.longitude) return;
        const v = r.ville || "Autre";
        if(!byVille[v]) byVille[v] = {
          lat: r.latitude, lng: r.longitude,
          total: 0, abonnes: 0, dispos: 0
        };
        byVille[v].total++;
        if(r._iok) byVille[v].abonnes++;
        if(r.disponible && r.disponible_jusqu && new Date(r.disponible_jusqu)>new Date()) byVille[v].dispos++;
        // Moyenne des coords
        byVille[v].lat = (byVille[v].lat + r.latitude) / 2;
        byVille[v].lng = (byVille[v].lng + r.longitude) / 2;
      });

      Object.entries(byVille).forEach(([ville, d])=>{
        const ratio = d.total > 0 ? d.abonnes/d.total : 0;
        const clusterColor = ratio > 0.6 ? "#22c55e" : ratio > 0.3 ? "#f97316" : "#6b7280";
        const size = Math.min(60, Math.max(36, 28 + d.total * 2));
        const icon = window.L.divIcon({
          html: `<div class="cluster-icon" style="width:${size}px;height:${size}px;background:${clusterColor};font-size:${size>44?13:11}px;">${d.total}</div>`,
          className:"", iconSize:[size,size], iconAnchor:[size/2,size/2]
        });
        const m = window.L.marker([d.lat, d.lng], {icon});
        m.addTo(map);
        m.bindPopup(
          `<div style="font-size:12px;line-height:1.6;">
            <b>${ville}</b><br/>
            🍽️ ${d.total} restaurants<br/>
            ✅ ${d.abonnes} abonnés IOK<br/>
            🟢 ${d.dispos} disponibles
          </div>`,
          {className:"iok-popup"}
        );
        m.on("click", ()=>map.setView([d.lat, d.lng], 13));
        markersRef.current.push(m);
      });
    } else {
      // ── MODE MARQUEURS INDIVIDUELS ───────────────────────
      filtered.forEach(r=>{
        if(!r.latitude || !r.longitude) return;
        const color = getColor(r);
        const icon = window.L.divIcon({
          html: `<div style="width:22px;height:22px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:10px;">${r.image_emoji||"🍽️"}</div>`,
          className:"", iconSize:[22,22], iconAnchor:[11,11]
        });
        const m = window.L.marker([r.latitude, r.longitude], {icon});
        m.addTo(map);
        const rt = restaurateurs.find(rt=>rt.id===r.restaurateur_id);
        m.bindPopup(
          `<div style="font-size:12px;line-height:1.7;">
            <b>${r.image_emoji||"🍽️"} ${r.nom}</b><br/>
            📍 ${r.ville}<br/>
            👤 ${rt?.responsable||"?"}<br/>
            📋 Plan : <b style="color:${color}">${r._iok?(r._plan||"trial"):"Non inscrit"}</b><br/>
            ${r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date()?"🟢 Disponible":"🔴 Indisponible"}
          </div>`,
          {className:"iok-popup"}
        );
        markersRef.current.push(m);
      });
    }

    // Stats
    setStats({
      total: filtered.length,
      abonnes: filtered.filter(r=>r._iok).length,
      dispos: filtered.filter(r=>r.disponible&&r.disponible_jusqu&&new Date(r.disponible_jusqu)>new Date()).length,
    });

    // Zoom géré via ref dans init map
  }, [filtered, zoom]);

  const cities = [...new Set(restaurants.map(r=>r.ville).filter(Boolean))].sort();

  return(
    <div>
      {/* Filtres */}
      <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <input value={filter.ville} onChange={e=>setFilter(f=>({...f,ville:e.target.value}))}
          placeholder="🔍 Ville..." style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"7px 12px",color:C.text,fontSize:13,outline:"none",fontFamily:"inherit",width:160}}/>
        {["Tous","trial","starter","premium","non_inscrit"].map(p=>(
          <button key={p} onClick={()=>setFilter(f=>({...f,plan:p}))}
            style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${filter.plan===p?C.accent:C.border}`,background:filter.plan===p?C.accent:"transparent",color:filter.plan===p?"white":C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:filter.plan===p?700:400}}>
            {p==="Tous"?"Tous plans":p==="non_inscrit"?"Non inscrits":p}
          </button>
        ))}
        {["Tous","dispo","indispo"].map(d=>(
          <button key={d} onClick={()=>setFilter(f=>({...f,dispo:d}))}
            style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${filter.dispo===d?C.accent:C.border}`,background:filter.dispo===d?C.accent:"transparent",color:filter.dispo===d?"white":C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
            {d==="Tous"?"Toutes dispo":d==="dispo"?"🟢 Disponibles":"🔴 Indisponibles"}
          </button>
        ))}
      </div>

      {/* Stats rapides */}
      <div style={{display:"flex",gap:10,marginBottom:12}}>
        {[
          {v:stats.total,l:"Restaurants",c:C.text},
          {v:stats.abonnes,l:"Abonnés IOK",c:"#22c55e"},
          {v:stats.dispos,l:"Disponibles",c:"#22c55e"},
          {v:stats.total-stats.abonnes,l:"Prospects",c:"#9ca3af"},
        ].map((s,i)=>(
          <div key={i} style={{background:C.card,borderRadius:10,padding:"8px 14px",border:`1px solid ${C.border}`,flex:1,textAlign:"center"}}>
            <div style={{color:s.c,fontWeight:800,fontSize:18}}>{s.v}</div>
            <div style={{color:C.muted,fontSize:11}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Carte */}
      <div style={{borderRadius:14,overflow:"hidden",border:`1px solid ${C.border}`}}>
        <div ref={mapRef} style={{height:520,width:"100%"}}/>
      </div>

      {/* Légende */}
      <div style={{display:"flex",gap:16,marginTop:10,flexWrap:"wrap"}}>
        {[["#22c55e","Disponible"],["#ef4444","Indisponible"],["#9ca3af","Non inscrit"],["#f97316","Cluster mixte"],["#6b7280","Cluster non-inscrits"]].map(([c,l])=>(
          <span key={l} style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:C.muted}}>
            <span style={{width:10,height:10,borderRadius:"50%",background:c,flexShrink:0}}/>
            {l}
          </span>
        ))}
      </div>
    </div>
  );
}


function AdminApp({admin, onLogout, onBack}){
  const [tab,setTab]=useState("dashboard");
  const [data,setData]=useState({clients:[],restaurateurs:[],restaurants:[],reservations:[],loaded:false});
  const [loading,setLoading]=useState(true);
  const [cityFilter,setCityFilter]=useState("Toutes");
  const [statutFilter,setStatutFilter]=useState("Tous");
  const [selectedRestaurateur,setSelectedRestaurateur]=useState(null);
  const [selectedRestaurant,setSelectedRestaurant]=useState(null);

  // Charge toutes les données
  const loadAll=async()=>{
    setLoading(true);
    try{
      const [c,rt,rs,rv]=await Promise.all([
        db().from("clients").select("*").order("created_at",{ascending:false}).limit(500),
        db().from("restaurateurs").select("*").order("created_at",{ascending:false}).limit(200),
        db().from("restaurants").select("*").order("created_at",{ascending:false}).limit(500),
        db().from("reservations").select("*").order("created_at",{ascending:false}).limit(1000),
      ]);
      // Enrichit restaurants avec _iok et _plan
      const rtMap = {};
      (rt.data||[]).forEach(r=>rtMap[r.id]=r);
      const enrichedRs = (rs.data||[]).map(r=>({
        ...r, _iok:true,
        _plan: rtMap[r.restaurateur_id]?.plan||"trial",
      }));
      setData({
        clients:c.data||[],
        restaurateurs:rt.data||[],
        restaurants:enrichedRs,
        reservations:rv.data||[],
        loaded:true,
      });
    }catch(e){ console.error(e); }
    setLoading(false);
  };

  useEffect(()=>{ loadAll(); },[]);

  // ── Stats globales ─────────────────────────────────────────
  const stats=useMemo(()=>{
    const rv=data.reservations;
    const total=rv.length;
    const honorees=rv.filter(r=>r.statut==="validee").length;
    const annulees=rv.filter(r=>r.statut==="annulee_client"||r.statut==="non_honoree_client"||r.statut==="non_honoree_resto"||r.statut==="annulee").length;
    const enCours=rv.filter(r=>r.statut==="en_attente"||r.statut==="confirmee").length;
    const tauxHonore=total>0?Math.round(honorees/total*100):0;

    // Par ville
    const byVille={};
    data.restaurants.forEach(r=>{
      const v=r.ville||"Autre";
      if(!byVille[v]) byVille[v]={ville:v,restaurants:0,reservations:0,honorees:0};
      byVille[v].restaurants++;
    });
    rv.forEach(r=>{
      const resto=data.restaurants.find(rs=>rs.id===r.restaurant_id);
      const v=resto?.ville||"Autre";
      if(byVille[v]){
        byVille[v].reservations++;
        if(r.statut==="validee") byVille[v].honorees++;
      }
    });

    // Par restaurant (top 10)
    const byResto={};
    rv.forEach(r=>{
      if(!byResto[r.restaurant_id]) byResto[r.restaurant_id]={id:r.restaurant_id,total:0,honorees:0,annulees:0};
      byResto[r.restaurant_id].total++;
      if(r.statut==="validee") byResto[r.restaurant_id].honorees++;
      if(r.statut==="annulee_client"||r.statut==="non_honoree_client"||r.statut==="non_honoree_resto") byResto[r.restaurant_id].annulees++;
    });
    const topRestos=Object.values(byResto)
      .map(r=>({...r,nom:data.restaurants.find(rs=>rs.id===r.id)?.nom||"?",taux:r.total>0?Math.round(r.honorees/r.total*100):0}))
      .sort((a,b)=>b.total-a.total).slice(0,10);

    // Evolution mensuelle (6 derniers mois)
    const monthly={};
    rv.forEach(r=>{
      const m=new Date(r.created_at).toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
      if(!monthly[m]) monthly[m]={mois:m,total:0,honorees:0,annulees:0};
      monthly[m].total++;
      if(r.statut==="validee") monthly[m].honorees++;
      if(r.statut==="annulee_client"||r.statut==="non_honoree_client"||r.statut==="non_honoree_resto") monthly[m].annulees++;
    });

    // Répartition statuts pour PieChart
    const avecPromo=rv.filter(r=>r.promo_pct>0).length;
    const statuts=[
      {name:"Validées",value:honorees,color:"#22c55e"},
      {name:"Annulées/Absences",value:annulees,color:"#ef4444"},
      {name:"En attente",value:enCours,color:"#3b82f6"},
      {name:"Autre",value:Math.max(0,total-honorees-annulees-enCours),color:"#6b7280"},
    ].filter(s=>s.value>0);

    return { total,honorees,annulees,enCours,avecPromo,tauxHonore,byVille:Object.values(byVille),topRestos,monthly:Object.values(monthly).slice(-6),statuts };
  },[data]);

  // ── Sidebar ────────────────────────────────────────────────
  const navItems=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"clients",icon:"👥",label:"Clients"},
    {id:"restaurateurs",icon:"👨‍🍳",label:"Restaurateurs"},
    {id:"restaurants",icon:"🍽️",label:"Restaurants"},
    {id:"reservations",icon:"📋",label:"Réservations"},
    {id:"reporting",icon:"📈",label:"Reporting"},
    {id:"carte",    icon:"🗺️", label:"Carte"},
    {id:"admins",   icon:"👤",  label:"Admins"},
    {id:"settings",  icon:"⚙️",  label:"Paramètres"},
  ];

  return(
    <div style={{display:"flex",minHeight:"100vh",background:C.bg}}>
      {/* Sidebar */}
      <div style={{width:220,background:C.surface,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",flexShrink:0,height:"100vh",position:"sticky",top:0,overflowY:"auto"}}>
        <div style={{padding:"24px 20px 16px"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
            <svg width="32" height="32" viewBox="0 0 32 32">
              <rect width="32" height="32" rx="9" fill="#F40000"/>
              <path d="M18.5,5.5 L10,16.5 L16.5,16.5 L13.5,26.5 L23,15 L16.5,15 L20,5.5 Z" fill="#39FF14" stroke="#39FF14" strokeWidth="0.6" strokeLinejoin="round"/>
            </svg>
            <div>
              <div style={{fontSize:8,letterSpacing:2,color:C.accent,textTransform:"uppercase",fontWeight:700}}>IOK</div>
              <div style={{color:C.text,fontSize:13,fontWeight:800}}>Administration</div>
            </div>
          </div>
          <div style={{color:C.muted,fontSize:11,marginTop:8}}>👤 {admin.nom}</div>
        </div>
        <nav style={{flex:1,padding:"8px 12px",overflowY:"auto"}}>
          {navItems.map(item=>(
            <button key={item.id} onClick={()=>setTab(item.id)}
              style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"none",background:tab===item.id?"rgba(255,92,58,0.15)":"transparent",color:tab===item.id?C.accent:C.sub,fontSize:13,fontWeight:tab===item.id?700:400,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:10,marginBottom:2,textAlign:"left",transition:"all 0.15s"}}>
              <span>{item.icon}</span>{item.label}
            </button>
          ))}
        </nav>
        <div style={{padding:"12px 16px",borderTop:`1px solid ${C.border}`,display:"flex",flexDirection:"column",gap:6}}>
          <button onClick={onBack} style={{width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:"#0066FF",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
            🏠 Changer d'app
          </button>
          <button onClick={onLogout} style={{width:"100%",padding:"8px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
            Déconnexion
          </button>
        </div>
      </div>

      {/* Main content */}
      <div style={{flex:1,overflowY:"auto",padding:24}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div>
            <div style={{color:C.text,fontSize:22,fontWeight:800}}>{navItems.find(n=>n.id===tab)?.icon} {navItems.find(n=>n.id===tab)?.label}</div>
            <div style={{color:C.muted,fontSize:13,marginTop:2}}>{new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setTab("dashboard")} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 12px",color:C.accent,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>⚡ Accueil</button>
            <button onClick={loadAll} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"8px 16px",color:C.sub,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>{loading?"⏳":"🔄"} Actualiser</button>
            <button onClick={onLogout} style={{background:"rgba(239,68,68,0.1)",border:`1px solid rgba(239,68,68,0.2)`,borderRadius:10,padding:"8px 12px",color:C.red,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
          </div>
        </div>

        {loading&&<div style={{textAlign:"center",padding:"60px 0",color:C.muted}}><div style={{fontSize:32,marginBottom:12}}>⚡</div>Chargement...</div>}

        {!loading&&<>
          {/* ─── DASHBOARD ────────────────────────────────────── */}
          {tab==="dashboard"&&(
            <div>
              {/* KPI Cards */}
              <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:24}}>
                <StatCard icon="📋" label="Réservations totales" value={stats.total} color={C.blue}/>
                <StatCard icon="✅" label="Honorées" value={stats.honorees} sub={`${stats.tauxHonore}% du total`} color={C.green}/>
                <StatCard icon="❌" label="Annulées/Absences" value={stats.annulees} color={C.red}/>
                <StatCard icon="⭐" label="Avec PromoFlash" value={stats.avecPromo||0} color="#22c55e"/>
                <StatCard icon="⏳" label="En cours" value={stats.enCours} color={C.gold}/>
                <StatCard icon="👥" label="Clients" value={data.clients.length} color={C.blue}/>
                <StatCard icon="🍽️" label="Restaurants IOK" value={data.restaurants.length} color={C.accent}/>
                <StatCard icon="🔭" label="Potentiel prospection" value={`~${Math.round(data.restaurants.length * 8)}`} sub="estimation ×8 non-inscrits" color="#9ca3af"/>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
                {/* Répartition statuts */}
                <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
                  <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:16}}>Répartition des réservations</div>
                  {stats.total>0?(

                </div>

                {/* Par ville */}
                <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
                  <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:16}}>Réservations par ville</div>
                  {stats.byVille.length>0?(
                  <SVGBarChart data={stats.byVille} keys={["reservations","honorees"]} colors={["#3b82f6","#22c55e"]} height={200}/>
                  ):<div style={{textAlign:"center",padding:"60px 0",color:C.muted}}>Aucune donnée</div>}
                </div>
              </div>

              {/* Évolution mensuelle */}
              {stats.monthly.length>0&&(
                <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`,marginBottom:16}}>
                  <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:16}}>Évolution mensuelle</div>
                  <SVGLineChart data={stats.monthly} height={200} lines={[
                    {key:"total",    label:"Total",    color:"#3b82f6"},
                    {key:"honorees", label:"Honorées", color:"#22c55e"},
                    {key:"annulees", label:"Annulées", color:"#ef4444"},

                </div>
              )}

              {/* Top restaurants */}
              {stats.topRestos.length>0&&(
                <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
                  <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:16}}>Top 10 restaurants par réservations</div>
                  <DataTable
                    onSearch={false}
                    data={stats.topRestos}

                      {key:"nom",label:"Restaurant",accessor:"nom"},
                      {key:"total",label:"Total",accessor:"total"},
                      {key:"honorees",label:"Honorées",accessor:"honorees"},
                      {key:"annulees",label:"Annulées",accessor:"annulees"},
                      {key:"taux",label:"Taux",render:r=><span style={{color:r.taux>=70?"#22c55e":r.taux>=40?"#f5a623":"#ef4444",fontWeight:700}}>{r.taux}%</span>},
                    ]}
                  />
                </div>
              )}
            </div>
          )}

          {/* ─── CLIENTS ──────────────────────────────────────── */}
          {tab==="clients"&&(
            <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{color:C.text,fontWeight:700,fontSize:14}}>{data.clients.length} clients inscrits</div>
                <div style={{display:"flex",gap:8}}>
                  {["Tous","tres_fiable","fiable","peu_fiable","nouveau"].map(f=>(
                    <button key={f} onClick={()=>setStatutFilter(f)}
                      style={{padding:"5px 12px",borderRadius:8,border:`1px solid ${statutFilter===f?C.accent:C.border}`,background:statutFilter===f?C.accent:"transparent",color:statutFilter===f?"white":C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:statutFilter===f?700:400}}>
                      {f==="Tous"?"Tous":FIB[f]?.label||f}
                    </button>
                  ))}
                </div>
              </div>
              <DataTable
                searchPlaceholder="Rechercher un client..."
                data={data.clients.filter(c=>statutFilter==="Tous"||c.fiabilite_statut===statutFilter)}
                columns={[
                  {key:"prenom",label:"Prénom",accessor:"prenom"},
                  {key:"nom",label:"Nom",accessor:"nom"},
                  {key:"tel",label:"Téléphone",accessor:"telephone"},
                  {key:"email",label:"Email",accessor:"email"},
                  {key:"fiabilite",label:"Fiabilité",render:r=><FBadge statut={r.fiabilite_statut}/>},
                  {key:"resa",label:"Réservations",render:r=><span style={{color:C.text}}>{r.total_reservations||0}</span>},
                  {key:"marketing",label:"Marketing",render:r=><span style={{color:r.consent_marketing?C.green:C.muted}}>{r.consent_marketing?"✓ Oui":"Non"}</span>},
                  {key:"date",label:"Inscrit le",render:r=><span style={{color:C.muted,fontSize:11}}>{fmtDate(r.created_at)}</span>},
                ]}
              />
            </div>
          )}

          {tab==="restaurateurs"&&(
            <div style={{background:C.card,borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
              <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:16}}>{data.restaurateurs.length} restaurateurs</div>
              {selectedRestaurateur?(

                />
              ):(
                <DataTable
                  searchPlaceholder="Rechercher un restaurateur..."
                  data={data.restaurateurs}
                  columns={[
                    {key:"resp",label:"Responsable",accessor:"responsable"},
                    {key:"user",label:"Identifiant",accessor:"username"},
                    {key:"email",label:"Email",accessor:"email"},
                    {key:"tel",label:"Téléphone",accessor:"telephone"},
                    {key:"plan",label:"Plan",render:r=>{
                      const colors={trial:"#22c55e",starter:"#f5a623",premium:"#a855f7"};
                      return <span style={{color:colors[r.plan]||C.muted,fontWeight:700}}>{r.plan}</span>;
                    }},
                    {key:"fiabilite",label:"Fiabilité",render:r=><FBadge statut={r.fiabilite_statut}/>},

// ── FACTURATION ADMIN PANEL ──────────────────────────────────
function FacturationAdminPanel({prestataires, visites}){
  const [detailPresta,setDetailPresta]=useState(null);
  const [detailVentes,setDetailVentes]=useState(null);
  const t=window.SIOK_TARIFS||{};
  const now=new Date();
  const NB_MOIS=6;

  const getComm=(plan)=>
    (plan==="base")?(window.SIOK_PARAMS?.base_commission||15):
    (plan||"").includes("standard")?(window.SIOK_PARAMS?.standard_commission||9):
    (plan||"").includes("premium")?(window.SIOK_PARAMS?.premium_commission||5):0;
  const getPrix=(plan)=>
    plan==="standard_monthly"?(t.standard_mensuel||49.90):
    plan==="standard_annual"?(t.standard_annuel||39.90):
    plan==="premium_monthly"?(t.premium_mensuel||79.90):
    plan==="premium_annual"?(t.premium_annuel||59.90):0;

  const moisList=[];
  for(let i=0;i<NB_MOIS;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const m=d.getMonth(),y=d.getFullYear();
    const debut=new Date(y,m,1),fin=new Date(y,m+1,0,23,59,59);
    const label=d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
    const key=`${y}-${m}`;
    const vMois=visites.filter(v=>{const vd=new Date(v.created_at);return vd>=debut&&vd<=fin;});
    const lignes=prestataires.map(p=>{
      const planDebut=p.plan_debut?new Date(p.plan_debut):null;
      const abo=(planDebut&&planDebut>fin)?0:getPrix(p.plan);
      const comm=getComm(p.plan);
      const vP=vMois.filter(v=>v.prestataire_id===p.id||(v.offres?.prestataire_id===p.id));
      const ca=vP.filter(v=>v.montant_remise>0).reduce((s,v)=>s+(v.montant_remise||0),0);
      const commMnt=ca*comm/100;
      const total=abo+commMnt;
      return {p,abo,comm,ca,commMnt,total,vP,nbVentes:vP.filter(v=>v.montant_remise>0).length};
    }).filter(l=>l.total>0||l.nbVentes>0||l.abo>0);
    const totalMois=lignes.reduce((s,l)=>s+l.total,0);
    moisList.push({label,key,vMois,lignes,totalMois,debut,fin,isCurrent:i===0});
  }

  // Grille : 1 col label + N cols mois
  // Lignes : header mois / TOTAL global / [par prestataire : nom / Abo / Comm / Total]
  const allPrestas=[...new Set(moisList.flatMap(m=>m.lignes.map(l=>l.p.id)))].map(id=>prestataires.find(p=>p.id===id)).filter(Boolean);

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 20px",marginBottom:16}}>
      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:14}}>💶 Facturation — 6 derniers mois</div>

      <div style={{overflowX:"auto",marginBottom:12}}>
        <table style={{borderCollapse:"collapse",width:"100%",minWidth:480}}>
          {/* ── Header mois ── */}
          <thead>
            <tr>
              <th style={{width:130,padding:"6px 10px",textAlign:"left",color:C.muted,fontSize:10,fontWeight:700,borderBottom:`2px solid ${C.border}`}}></th>
              {moisList.map(m=>(
                <th key={m.key} style={{padding:"6px 8px",textAlign:"right",color:m.isCurrent?"#4D9EFF":C.text,fontSize:11,fontWeight:700,borderBottom:`2px solid ${C.border}`,minWidth:80}}>
                  {m.label}
                  {m.isCurrent&&<div style={{color:"#4D9EFF",fontSize:8,fontWeight:700}}>EN COURS</div>}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {/* ── Ligne TOTAL global ── */}
            <tr style={{background:"rgba(245,158,11,0.06)"}}>
              <td style={{padding:"8px 10px",color:"#F59E0B",fontWeight:800,fontSize:13,borderBottom:`1px solid ${C.border}`}}>TOTAL</td>
              {moisList.map(m=>(
                <td key={m.key} onClick={()=>setDetailPresta(detailPresta?.key===m.key?null:m)}
                  style={{padding:"8px 8px",textAlign:"right",cursor:"pointer",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{color:"#F59E0B",fontWeight:900,fontSize:14}}>{m.totalMois.toFixed(2)} €</div>
                  <div style={{color:C.muted,fontSize:9}}>voir ↓</div>
                </td>
              ))}
            </tr>

            {/* ── Détail par prestataire si mois sélectionné ── */}
            {detailPresta&&allPrestas.map(p=>{
              const lignesMois=moisList.map(m=>m.lignes.find(l=>l.p.id===p.id)||{abo:0,comm:0,ca:0,commMnt:0,total:0,nbVentes:0,vP:[]});
              const hasData=lignesMois.some(l=>l.total>0||l.nbVentes>0);
              if(!hasData) return null;
              return(
                <React.Fragment key={p.id}>
                  {/* Nom prestataire */}
                  <tr style={{background:"rgba(255,255,255,0.04)",borderTop:`2px solid ${C.border}`}}>
                    <td colSpan={NB_MOIS+1} style={{padding:"6px 10px",color:C.text,fontWeight:800,fontSize:12}}>
                      {p.nom}
                    </td>
                  </tr>
                  {/* Ligne Abonnement */}
                  <tr>
                    <td style={{padding:"4px 10px 4px 20px",color:C.muted,fontSize:11}}>Abonnement</td>
                    {lignesMois.map((l,i)=>(
                      <td key={i} style={{padding:"4px 8px",textAlign:"right",color:C.sub,fontSize:11}}>{l.abo.toFixed(2)} €</td>
                    ))}
                  </tr>
                  {/* Ligne Commission */}
                  <tr>
                    <td style={{padding:"4px 10px 4px 20px",color:C.muted,fontSize:11}}>Commission ({getComm(p.plan)}%)<br/><span style={{fontSize:9,color:C.muted}}>{lignesMois.map(l=>l.nbVentes).reduce((a,b)=>a+b,0)} vente(s)</span></td>
                    {lignesMois.map((l,i)=>(
                      <td key={i} style={{padding:"4px 8px",textAlign:"right",color:C.sub,fontSize:11}}>{l.commMnt.toFixed(2)} €</td>
                    ))}
                  </tr>
                  {/* Ligne Total prestataire */}
                  <tr style={{background:"rgba(245,158,11,0.04)"}}>
                    <td style={{padding:"5px 10px 5px 20px",color:"#F59E0B",fontWeight:700,fontSize:11,borderTop:`1px solid ${C.border}`}}>Total HT</td>
                    {lignesMois.map((l,i)=>(
                      <td key={i} onClick={()=>setDetailVentes(detailVentes?.id===`${p.id}-${moisList[i]?.key}`?null:{id:`${p.id}-${moisList[i]?.key}`,p,l,moisLabel:moisList[i]?.label,comm:getComm(p.plan)})}
                        style={{padding:"5px 8px",textAlign:"right",cursor:l.total>0?"pointer":"default",borderTop:`1px solid ${C.border}`}}>
                        <div style={{color:"#F59E0B",fontWeight:700,fontSize:12}}>{l.total.toFixed(2)} €</div>
                        {l.total>0&&<div style={{color:C.muted,fontSize:8}}>détail →</div>}
                      </td>
                    ))}
                  </tr>
                  {/* Détail ventes si sélectionné */}
                  {detailVentes&&detailVentes.p.id===p.id&&(
                    <tr>
                      <td colSpan={NB_MOIS+1} style={{padding:"0 10px 8px 20px"}}>
                        <div style={{background:C.surface,borderRadius:8,padding:"10px 12px",border:`1px solid ${C.border}`}}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                            <span style={{color:C.text,fontWeight:700,fontSize:11}}>{detailVentes.p.nom} — {detailVentes.moisLabel}</span>
                            <button onClick={()=>setDetailVentes(null)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14}}>✕</button>
                          </div>
                          {detailVentes.l.vP.filter(v=>v.montant_remise>0).length===0
                            ?<div style={{color:C.muted,fontSize:11,textAlign:"center"}}>Aucune vente avec montant</div>
                            :<>
                              <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",marginBottom:4}}>
                                {["Date / Offre","Remisé","Commission","Facturé"].map(h=>(
                                  <div key={h} style={{color:C.muted,fontSize:9,fontWeight:700,padding:"2px 4px",borderBottom:`1px solid ${C.border}`}}>{h}</div>
                                ))}
                              </div>
                              {detailVentes.l.vP.filter(v=>v.montant_remise>0).map(v=>(
                                <div key={v.id} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",borderBottom:`1px solid ${C.border}`}}>
                                  <div style={{padding:"3px 4px"}}>
                                    <div style={{color:C.text,fontSize:10}}>{v.offres?.titre||"Offre"}</div>
                                    <div style={{color:C.muted,fontSize:9}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</div>
                                  </div>
                                  <div style={{padding:"3px 4px",color:C.sub,fontSize:10,textAlign:"right"}}>{v.montant_remise?.toFixed(2)} €</div>
                                  <div style={{padding:"3px 4px",color:"#F59E0B",fontSize:10,textAlign:"right"}}>{(v.montant_remise*detailVentes.comm/100).toFixed(2)} €</div>
                                  <div style={{padding:"3px 4px",color:"#F59E0B",fontWeight:700,fontSize:10,textAlign:"right"}}>{(v.montant_remise*detailVentes.comm/100).toFixed(2)} €</div>
                                </div>
                              ))}
                              <div style={{display:"flex",justifyContent:"space-between",padding:"4px",borderTop:`1px solid ${C.border}`,marginTop:2}}>
                                <span style={{color:C.text,fontWeight:700,fontSize:10}}>Total HT</span>
                                <span style={{color:"#F59E0B",fontWeight:900,fontSize:12}}>{detailVentes.l.total.toFixed(2)} €</span>
                              </div>
                            </>
                          }
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{color:C.muted,fontSize:10,marginTop:4,lineHeight:1.6}}>
        Tous les tarifs sont HT. Montant dû le dernier jour du mois par paiement STRIPE. Défaut de paiement sous 2 jours → suspension des offres.
      </div>
    </div>
  );
}

  const [loading,setLoading]=useState(true);
  const [showInscrits,setShowInscrits]=useState(false);

  const load=async()=>{
    setLoading(true);
    try{
      const {data:scans}=await db().from("scans_landing").select("reponse,created_at,etudiant_id");
      const {data:et}=await db().from("etudiants").select("id,prenom,email,created_at,points").eq("pre_inscrit",true).order("created_at",{ascending:false});
      if(scans){
        const counts={scan:0,oui:0,non:0,inscrit:0};
        scans.forEach(s=>{
          const r=s.reponse?.toLowerCase()?.trim();
          if(r==="scan") counts.scan++;
          else if(r==="oui") counts.oui++;
          else if(r==="non") counts.non++;
          else if(r==="inscrit") counts.inscrit++;
        });
        // Fallback : si inscrit=0 dans scans_landing, utiliser le count etudiants
        if(counts.inscrit===0 && et && et.length>0) counts.inscrit=et.length;
        setStats(counts);
      }
      setInscrits(et||[]);
    }catch(e){console.error(e);}
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  if(loading) return <div style={{color:C.muted,fontSize:13,padding:"20px 0"}}>Chargement sondage…</div>;

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 20px",marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{color:C.text,fontWeight:700,fontSize:14}}>📊 Sondage pré-lancement StuDiscount</div>
        <button onClick={load} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"4px 10px",color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>🔄</button>
      </div>

      {/* 4 colonnes */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
        {[
          {label:"QRC scannés",  value:stats?.scan||0,    color:"#6B7280", click:false},
          {label:"Intéressés",   value:stats?.oui||0,     color:"#22C55E", click:false},
          {label:"Inscrits",     value:stats?.inscrit||0, color:"#0066FF", click:true},
          {label:"Pas intéressés",value:stats?.non||0,    color:"#EF4444", click:false},
        ].map(s=>(
          <div key={s.label}
            onClick={s.click?()=>setShowInscrits(true):undefined}
            style={{background:C.surface,borderRadius:10,padding:"12px 8px",textAlign:"center",
              cursor:s.click?"pointer":"default",
              border:`1px solid ${s.click?"#0066FF":C.border}`,
              transition:"all 0.15s"}}>
            <div style={{color:s.color,fontWeight:900,fontSize:32,lineHeight:1}}>{s.value}</div>
            <div style={{color:C.muted,fontSize:10,marginTop:4,lineHeight:1.3}}>{s.label}</div>
            {s.click&&<div style={{color:"#0066FF",fontSize:9,marginTop:4}}>voir liste →</div>}
          </div>
        ))}
      </div>

      {/* Modal inscrits */}
      {showInscrits&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:5000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}
          onClick={()=>setShowInscrits(false)}>
          <div style={{background:C.surface,borderRadius:16,padding:24,width:"100%",maxWidth:500,maxHeight:"80vh",overflowY:"auto"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{color:C.text,fontWeight:700,fontSize:16}}>🎁 Pré-inscrits ({inscrits.length})</div>
              <button onClick={()=>setShowInscrits(false)} style={{background:"none",border:"none",color:C.muted,fontSize:20,cursor:"pointer"}}>✕</button>
            </div>
            {inscrits.length===0
              ?<div style={{color:C.muted,textAlign:"center",padding:"20px 0"}}>Aucun inscrit</div>
              :inscrits.map(e=>(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div>
                    <div style={{color:C.text,fontSize:13,fontWeight:600}}>{e.prenom||"—"}</div>
                    <div style={{color:C.muted,fontSize:12}}>{e.email}</div>
                  </div>
                  <div style={{color:"#F59E0B",fontWeight:700,fontSize:12}}>{e.points||0} ⭐</div>
                </div>
              ))
            }
          </div>
        </div>
      )}
    </div>
  );
}


// ── PARTENAIRES CADEAUX PANEL ────────────────────────────────
function PartenairesCadeauxPanel(){
  const [partenaires,setPartenaires]=useState([]);
  const [loading,setLoading]=useState(true);
  const [newNom,setNewNom]=useState("");
  const [newEmoji,setNewEmoji]=useState("🎁");
  const [saving,setSaving]=useState(false);

  const load=async()=>{
    setLoading(true);
    const {data}=await db().from("partenaires_cadeaux").select("*").order("nom");
    if(data) setPartenaires(data);
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const ajouter=async()=>{
    if(!newNom.trim()) return;
    setSaving(true);
    await db().from("partenaires_cadeaux").insert({nom:newNom.trim(),emoji:newEmoji,actif:true});
    setNewNom("");setNewEmoji("🎁");
    await load();setSaving(false);
  };

  const toggleActif=async(p)=>{
    await db().from("partenaires_cadeaux").update({actif:!p.actif}).eq("id",p.id);
    await load();
  };

  const supprimer=async(id)=>{
    if(!confirm("Supprimer ce partenaire ?")) return;
    await db().from("partenaires_cadeaux").delete().eq("id",id);
    await load();
  };

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 20px",marginBottom:16}}>
      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:14}}>🎁 Partenaires cadeaux</div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <input value={newEmoji} onChange={e=>setNewEmoji(e.target.value)} style={{width:48,padding:"8px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:20,textAlign:"center",fontFamily:"inherit"}}/>
        <input value={newNom} onChange={e=>setNewNom(e.target.value)} placeholder="Nom du partenaire" style={{flex:1,padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:13,fontFamily:"inherit"}}/>
        <button onClick={ajouter} disabled={saving||!newNom.trim()} style={{padding:"8px 16px",borderRadius:8,border:"none",background:C.accent,color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{saving?"...":"Ajouter"}</button>
      </div>
      {loading?<div style={{color:C.muted,fontSize:13}}>Chargement…</div>
        :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:8}}>
          {partenaires.map(p=>(
            <div key={p.id} style={{background:C.surface,borderRadius:10,padding:"10px 12px",border:`1px solid ${p.actif?C.accent:C.border}`,opacity:p.actif?1:0.5}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <div><span style={{fontSize:22}}>{p.emoji}</span><div style={{color:C.text,fontSize:12,fontWeight:700}}>{p.nom}</div></div>
                <button onClick={()=>supprimer(p.id)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:14}}>✕</button>
              </div>
              <button onClick={()=>toggleActif(p)} style={{width:"100%",padding:"4px",borderRadius:6,border:"none",background:p.actif?"rgba(34,197,94,0.15)":"rgba(107,114,128,0.15)",color:p.actif?"#22C55E":C.muted,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>
                {p.actif?"✅ Actif":"⏸ Inactif"}
              </button>
            </div>
          ))}
          {partenaires.length===0&&(
            <button onClick={async()=>{
              const ex=[{nom:"Fnac",emoji:"📚"},{nom:"Galeries Lafayette",emoji:"🛍️"},{nom:"Cinéma UGC",emoji:"🎬"},{nom:"McDonald's",emoji:"🍔"},{nom:"Burger King",emoji:"👑"},{nom:"Séphora",emoji:"💄"},{nom:"Zara",emoji:"👗"}];
              for(const e of ex) await db().from("partenaires_cadeaux").insert({...e,actif:true});
              await load();
            }} style={{padding:"10px 20px",borderRadius:10,border:"none",background:C.accent,color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",gridColumn:"1/-1"}}>
              📥 Insérer les exemples (Fnac, Galeries, Ciné, McDo…)
            </button>
          )}
        </div>
      }
    </div>
  );
}

function ModerationAvisPanel(){
  const [avis,setAvis]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("en_attente");

  const load=async()=>{
    setLoading(true);
    try{
      const {data}=await db().from("visites")
        .select("id,avis,note,photo_url,statut_avis,created_at,etudiant_id,offre_id,etudiants(prenom,email),offres(titre)")
        .not("avis","is",null)
        .order("created_at",{ascending:false});
      setAvis(data||[]);
    }catch(e){console.error(e);}
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const setStatut=async(id,statut)=>{
    await db().from("visites").update({statut_avis:statut}).eq("id",id);
    setAvis(prev=>prev.map(a=>a.id===id?{...a,statut_avis:statut}:a));
  };

  const filtered=avis.filter(a=>filter==="tous"||a.statut_avis===filter);

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 20px",marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{color:C.text,fontWeight:700,fontSize:14}}>💬 Modération des avis</div>
        <button onClick={load} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"4px 10px",color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>🔄</button>
      </div>
      {/* Filtres */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["en_attente","⏳ En attente"],["validé","✅ Validés"],["rejeté","❌ Rejetés"],["tous","Tous"]].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)}
            style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${filter===k?"#0066FF":C.border}`,background:filter===k?"rgba(0,102,255,0.1)":"transparent",color:filter===k?"#4D9EFF":C.muted,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {l} ({avis.filter(a=>k==="tous"||a.statut_avis===k).length})
          </button>
        ))}
      </div>
      {loading&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>Chargement…</div>}
      {!loading&&filtered.length===0&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"20px 0"}}>Aucun avis dans cette catégorie</div>}
      {filtered.map(a=>(
        <div key={a.id} style={{background:C.surface,borderRadius:10,padding:"12px 14px",marginBottom:10,border:`1px solid ${C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>

              <div style={{color:C.text,fontWeight:700,fontSize:13}}>{a.etudiants?.prenom||"Étudiant"}</div>
              <div style={{color:C.muted,fontSize:11}}>{a.offres?.titre||"Offre"} · {new Date(a.created_at).toLocaleDateString("fr-FR")}</div>
            </div>
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              {a.note>0&&<span style={{color:"#F59E0B",fontWeight:700,fontSize:12}}>{"⭐".repeat(a.note)}</span>}
              <span style={{background:a.statut_avis==="validé"?"#22C55E":a.statut_avis==="rejeté"?"#EF4444":"#F59E0B",color:"white",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:20}}>
                {a.statut_avis||"en_attente"}
              </span>
            </div>
          </div>
          {a.avis&&<div style={{color:C.sub,fontSize:12,lineHeight:1.5,marginBottom:8,fontStyle:"italic"}}>"{a.avis}"</div>}
          {a.photo_url&&(
            <div style={{marginBottom:8}}>
              <a href={a.photo_url} target="_blank" rel="noopener noreferrer">

              ✅ Valider
            </button>
          )}
          {a.statut_avis!=="rejeté"&&(
            <button onClick={()=>setStatut(a.id,"rejeté")}
              style={{padding:"5px 12px",borderRadius:8,border:"none",background:"rgba(239,68,68,0.12)",color:"#EF4444",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>

          )}

      ))}
    </div>
  );
}
