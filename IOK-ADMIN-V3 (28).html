function SuggestionsPanel({type, titre}){
  const [suggestions,setSuggestions]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=async()=>{
    setLoading(true);
    try{
      let query=db().from("suggestions").select("*").order("created_at",{ascending:false}).limit(200);
      if(type==="prestataire") query=query.eq("type","prestataire");
      if(type==="siok") query=query.in("type",["etudiant","etudiant_anon"]);
      const {data}=await query;
      setSuggestions(data||[]);
    }catch(e){console.error(e);}
    setLoading(false);
  };

  useEffect(()=>{load();},[]);

  const noteStars=(n)=>{
    if(!n) return <span style={{color:C.muted}}>—</span>;
    return <span style={{color:"#F5A623",fontWeight:700}}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
  };

  const typeBadge=(t)=>{
    const cfg={
      etudiant:     {bg:"rgba(0,102,255,0.12)",color:"#0066FF",label:"🎓 Étudiant"},
      etudiant_anon:{bg:"rgba(107,114,128,0.12)",color:"#9CA3AF",label:"👤 Anonyme"},
      prestataire:  {bg:"rgba(34,197,94,0.12)",color:"#22C55E",label:"🏪 Prestataire"},
    }[t]||{bg:"rgba(107,114,128,0.1)",color:C.muted,label:t};
    return <span style={{background:cfg.bg,color:cfg.color,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10}}>{cfg.label}</span>;
  };

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{color:C.text,fontWeight:700,fontSize:14}}>💡 {titre}</div>
          <div style={{color:C.muted,fontSize:12,marginTop:2}}>{suggestions.length} suggestion{suggestions.length>1?"s":""}</div>
        </div>
        <button onClick={load} disabled={loading}
          style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",color:C.sub,fontSize:12,cursor:"pointer",fontFamily:"inherit",opacity:loading?0.6:1}}>
          {loading?"⏳":"🔄"} Actualiser
        </button>
      </div>

      {loading?(
        <div style={{textAlign:"center",padding:"30px 0",color:C.muted}}>Chargement…</div>
      ):suggestions.length===0?(
        <div style={{textAlign:"center",padding:"30px 0",color:C.muted}}>
          <div style={{fontSize:32,marginBottom:8}}>💡</div>
          <div>Aucune suggestion pour l'instant</div>
        </div>
      ):(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Date","Nom","Type","Note","Suggestion"].map(h=>(
                  <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase",letterSpacing:1,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {suggestions.map(s=>(
                <tr key={s.id} style={{borderBottom:`1px solid ${C.border}`}}>
                  <td style={{padding:"10px 12px",color:C.muted,fontSize:11,whiteSpace:"nowrap"}}>
                    {new Date(s.created_at).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"})}
                    <span style={{marginLeft:4,color:C.border.replace("0.07","0.3")}}>
                      {new Date(s.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
                    </span>
                  </td>
                  <td style={{padding:"10px 12px",color:C.text,fontSize:13,fontWeight:600}}>{s.nom||<span style={{color:C.muted,fontStyle:"italic"}}>Anonyme</span>}</td>
                  <td style={{padding:"10px 12px"}}>{typeBadge(s.type)}</td>
                  <td style={{padding:"10px 12px"}}>{noteStars(s.note)}</td>
                  <td style={{padding:"10px 12px",color:C.sub,fontSize:13,maxWidth:360,lineHeight:1.5}}>{s.commentaire}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── PRESTATAIRE CREATOR ───────────────────────────────────────
function PrestataireCreator({onCreated}){
  const [open,setOpen]=useState(false);
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  const [TYPES,setTYPES]=useState([
    {id:"restaurant",emoji:"🍽️",label:"Restaurant"},
    {id:"autre",emoji:"🎯",label:"Autre"},
  ]);
  useEffect(()=>{
    db().from("types_metier").select("*").eq("actif",true).order("ordre")
      .then(({data})=>{if(data&&data.length)setTYPES(data);});
  },[]);
  const [form,setForm]=useState({
    nom:"",type_metier:"restaurant",adresse:"",ville:"Annecy",
    lat:"",lng:"",telephone:"",plan:"trial",email:"",password:"",
  });
  const F=(k,v)=>setForm(f=>({...f,[k]:v}));

  const create=async()=>{
    if(!form.nom||!form.email||!form.password)return setError("Nom, email et mot de passe obligatoires");
    if(form.password.length<8)return setError("Mot de passe : 8 caractères minimum");
    setSaving(true);setError("");setSuccess("");
    try{
      // Créer le compte via l'API Supabase Admin (nécessite service_role)
      // On passe par une fonction RPC ou on insère directement via SQL
      const {data:authData,error:authErr}=await db().rpc('create_prestataire_user',{
        p_email:form.email,
        p_password:form.password,
        p_nom:form.nom,
      }).maybeSingle();

      // Fallback : récupérer l'utilisateur si déjà créé
      let authId=authData?.id;
      if(authErr||!authId){
        // Essayer de récupérer un user existant avec cet email
        const {data:existing}=await db().from('auth_users_view').select('id').eq('email',form.email).maybeSingle();
        if(existing?.id){authId=existing.id;}
        else throw new Error(authErr?.message||"Impossible de créer le compte. Utilisez le SQL fourni pour créer les comptes manuellement.");
      }

      // 2. Insérer le prestataire avec auth_id
      const {error:dbErr}=await db().from("prestataires").insert({
        auth_id:authId,
        nom:form.nom,
        type_metier:form.type_metier,
        adresse:form.adresse||null,
        ville:form.ville||null,
        lat:form.lat?parseFloat(form.lat):null,
        lng:form.lng?parseFloat(form.lng):null,
        telephone:form.telephone||null,
        email:form.email,
        plan:form.plan,
      });
      if(dbErr)throw new Error("DB: "+dbErr.message);

      setSuccess(`✅ Prestataire ${form.nom} créé ! Login: ${form.email} / ${form.password}`);
      setForm({nom:"",type_metier:"restaurant",adresse:"",ville:"Annecy",lat:"",lng:"",telephone:"",plan:"trial",email:"",password:""});
      onCreated&&onCreated();
    }catch(e){setError(e.message);}
    setSaving(false);
  };

  const inp=(label,key,placeholder,type="text")=>(
    <div style={{marginBottom:10}}>
      <div style={{color:C.muted,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>{label}</div>
      <input type={type} value={form[key]} onChange={e=>F(key,e.target.value)} placeholder={placeholder}
        style={{width:"100%",background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
    </div>
  );

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,marginBottom:8}}>
      <button onClick={()=>setOpen(v=>!v)}
        style={{width:"100%",padding:"14px 16px",background:"none",border:"none",color:C.text,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:14}}>
        <span>+ Créer un nouveau prestataire</span>
        <span style={{color:C.muted,fontSize:12}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{padding:"0 16px 16px",borderTop:`1px solid ${C.border}`}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
            {inp("Nom du prestataire *","nom","Ex: Danzo Barber")}
            {inp("Email (login) *","email","prestataire@email.com","email")}
            {inp("Mot de passe *","password","Min. 8 caractères","password")}
            {inp("Téléphone","telephone","+33450...")}
            {inp("Adresse","adresse","12 Rue de la Gare")}
            {inp("Ville","ville","Annecy")}
            {inp("Latitude","lat","45.8992")}
            {inp("Longitude","lng","6.1294")}
          </div>

          {/* Type métier */}
          <div style={{marginBottom:10}}>
            <div style={{color:C.muted,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Type de métier</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {TYPES.map(t=>(
                <button key={t.id} onClick={()=>F("type_metier",t.id)}
                  style={{padding:"7px 14px",borderRadius:8,border:`1px solid ${form.type_metier===t.id?"rgba(0,102,255,0.5)":C.border}`,background:form.type_metier===t.id?"rgba(0,102,255,0.1)":"transparent",color:form.type_metier===t.id?"#0066FF":C.muted,fontSize:12,fontWeight:form.type_metier===t.id?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                  {t.emoji} {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* Plan */}
          <div style={{marginBottom:14}}>
            <div style={{color:C.muted,fontSize:11,fontWeight:600,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Plan</div>
            <div style={{display:"flex",gap:8}}>
              {["trial","solo","pro","agency"].map(p=>(
                <button key={p} onClick={()=>F("plan",p)}
                  style={{padding:"7px 14px",borderRadius:8,border:`1px solid ${form.plan===p?"rgba(0,102,255,0.5)":C.border}`,background:form.plan===p?"rgba(0,102,255,0.1)":"transparent",color:form.plan===p?"#0066FF":C.muted,fontSize:12,fontWeight:form.plan===p?700:400,cursor:"pointer",fontFamily:"inherit"}}>
                  {p}
                </button>
              ))}
            </div>
          </div>

          <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid rgba(234,179,8,0.2)",borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:"#eab308",lineHeight:1.6}}>
            ⚠️ La création de compte nécessite la clé <strong>service_role</strong>. Si le bouton échoue, utilisez le SQL <strong>siok_prestataires_auth_v2.sql</strong> ou créez le compte manuellement dans <strong>Supabase → Authentication → Users</strong> puis liez l'auth_id ici.
          </div>

          {error&&<div style={{background:"rgba(239,68,68,0.1)",borderRadius:8,padding:"8px 12px",marginBottom:10,color:"#ef4444",fontSize:13}}>⚠️ {error}</div>}
          {success&&<div style={{background:"rgba(34,197,94,0.1)",borderRadius:8,padding:"8px 12px",marginBottom:10,color:"#22c55e",fontSize:13,wordBreak:"break-all"}}>{success}</div>}

          <button onClick={create} disabled={saving}
            style={{width:"100%",padding:"12px 0",borderRadius:10,border:"none",background:"linear-gradient(135deg,#0066FF,#3399FF)",color:"white",fontSize:14,fontWeight:700,cursor:saving?"default":"pointer",fontFamily:"inherit",opacity:saving?0.6:1}}>
            {saving?"Création en cours…":"Créer le prestataire + compte login"}
          </button>
        </div>
      )}
    </div>
  );
}

// ── SIOK ADMIN APP (nouvelle app complète) ───────────────────
function SIOKAdminApp({admin, onLogout, onBack}){
  const [data,setData]=useState({prestataires:[],etudiants:[],offres:[],visites:[],vues:[],loaded:false});
  const [loading,setLoading]=useState(true);
  const [drill,setDrill]=useState(null); // null | {type, filter}
  const [showSettings,setShowSettings]=useState(false);

  const loadAll=async()=>{
    setLoading(true);
    try{
      const [p,e,o,v,vu,imp]=await Promise.all([
        db().from("prestataires").select("*").order("created_at",{ascending:false}).limit(500),
        db().from("etudiants").select("*").order("created_at",{ascending:false}).limit(500),
        db().from("offres").select("*, prestataires(nom,ville,type_metier)").order("created_at",{ascending:false}).limit(1000),
        db().from("visites").select("id,prestataire_id,offre_id,montant_remise,montant_normal,created_at,etudiant_id,etudiant_anon_id,points,avis,note,statut_avis, offres(titre,type_offre), prestataires(nom,ville), etudiants(prenom)").order("created_at",{ascending:false}).limit(2000),
        db().from("vues_offres").select("offre_id,created_at").order("created_at",{ascending:false}).limit(5000),
        db().from("impressions_offres").select("offre_id,created_at").order("created_at",{ascending:false}).limit(10000),
      ]);
      setData({prestataires:p.data||[],etudiants:e.data||[],offres:o.data||[],visites:v.data||[],vues:vu?.data||[],impressions:imp?.data||[],loaded:true});
    }catch(e){console.error(e);}
    setLoading(false);
  };

  useEffect(()=>{loadAll();},[]);

  const {prestataires,etudiants,offres,visites,vues}=data;

  // KPIs
  const {impressions=[]}=data;
  // Offres actives = active=true ET pas expirée
  const now=new Date();
  const offresActives=offres.filter(o=>{
    if(!o.active) return false;
    const debut=o.date_debut?new Date(o.date_debut):null;
    const fin=o.date_fin?new Date(o.date_fin):null;
    if(debut&&debut>now) return false;
    if(fin){fin.setHours(23,59,59,999);if(fin<now)return false;}
    return true;
  });
  const kpis=[
    {id:"prestataires", l:"Prestataires",   v:prestataires.length,          icon:"🏪", color:"#0066FF"},
    {id:"etudiants",    l:"Étudiants",      v:etudiants.length,             icon:"🎓", color:"#22C55E"},
    {id:"offres",       l:"Offres",         v:offres.length,                icon:"🎯", color:"#F97316"},
    {id:"actives",      l:"Actives",        v:offresActives.length,         icon:"✅", color:"#22C55E"},
    {id:"impressions",  l:"Impressions",    v:impressions.length,           icon:"👁️", color:"#9CA3AF"},
    {id:"visites",   l:"Vues",        v:vues.length,                                                                                  icon:"👁",   color:"#7C3AED"},
    {id:"honorees",  l:"Honorées",    v:visites.length,                                                                                icon:"✅",   color:"#22C55E"},
    {id:"ca",        l:"CA €",        v:visites.reduce((s,v)=>s+(v.montant_remise||0),0).toFixed(0)+"€",                              icon:"€",    color:"#F59E0B"},
    {id:"eco",       l:"Éco. €",      v:visites.reduce((s,v)=>s+((v.montant_normal||0)-(v.montant_remise||0)),0).toFixed(0)+"€",     icon:"€",    color:"#22C55E"},
    {id:"points",    l:"Points",      v:visites.reduce((s,v)=>s+(v.points||0),0),                                                   icon:"⭐",   color:"#F59E0B"},
  ];

  if(showSettings) return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"16px 24px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>setShowSettings(false)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Dashboard</button>
          <div style={{color:C.text,fontWeight:700,fontSize:16}}>⚙️ Paramètres StuDiscount</div>
        </div>
        <button onClick={onLogout} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 14px",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Déconnexion</button>
      </div>
      <div style={{padding:24}}><SIOKSettingsManager/></div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg}}>
      {/* Header compact */}
      <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"14px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {drill&&<button onClick={()=>setDrill(null)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"5px 12px",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Dashboard</button>}
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:22}}>🎓</span>
            <div>
              <div style={{color:"#0066FF",fontWeight:900,fontSize:16}}>{drill?drill.title:"StuDiscount Dashboard"}</div>
              {drill&&<div style={{color:C.muted,fontSize:11}}>{drill.subtitle||""}</div>}
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={loadAll} disabled={loading} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",color:C.sub,fontSize:12,cursor:loading?"default":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:5,opacity:loading?0.6:1}}>{loading?"⏳":"🔄"} Actualiser</button>
          <button onClick={()=>setShowSettings(true)} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 10px",color:C.muted,fontSize:16,cursor:"pointer",fontFamily:"inherit"}} title="Paramètres">⚙️</button>
          <button onClick={onBack} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>🏠 Changer d'app</button>
          <button onClick={onLogout} style={{background:"transparent",border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Déco.</button>
        </div>
      </div>

      <div style={{padding:24}}>
        {loading&&<div style={{textAlign:"center",padding:60,color:C.muted}}>Chargement…</div>}

        {!loading&&!drill&&(
          <div>
            {/* KPIs cliquables */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:10,marginBottom:24}}>
              {kpis.map(k=>(
                <div key={k.id} onClick={()=>setDrill({type:k.id,title:k.l,subtitle:`${k.v} ${k.l.toLowerCase()}`})}
                  style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px 12px",textAlign:"center",cursor:"pointer",transition:"all 0.15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=k.color}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{fontSize:24,marginBottom:6}}>{k.icon}</div>
                  <div style={{color:k.color,fontWeight:900,fontSize:22}}>{k.v}</div>
                  <div style={{color:C.muted,fontSize:11,marginTop:2}}>{k.l}</div>
                  <div style={{color:k.color,fontSize:9,marginTop:4,opacity:0.7}}>Voir détail →</div>
                </div>
              ))}
            </div>

            {/* Créateur prestataire — en premier */}
            <PrestataireCreator onCreated={loadAll}/>

            {/* Graphe visites par mois — mêmes 6 mois que facturation, du plus récent au plus ancien */}
            {(()=>{
              const visMois=[];
              for(let i=0;i<6;i++){
                const d=new Date();
                const d2=new Date(d.getFullYear(),d.getMonth()-i,1);
                const m=d2.getMonth(),y=d2.getFullYear();
                const label=d2.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
                const nb=visites.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
                visMois.push({label,nb,isCurrent:i===0});
              }
              const maxV=Math.max(...visMois.map(m=>m.nb),1);
              return(
                <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
                  <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>📅 Visites par mois</div>
                  <div style={{display:"flex",gap:8,alignItems:"flex-end",height:70}}>
                    {visMois.map(m=>(
                      <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                        <div style={{color:m.isCurrent?"#4D9EFF":C.muted,fontSize:10,fontWeight:700}}>{m.nb}</div>
                        <div style={{width:"100%",background:m.isCurrent?"#4D9EFF":"#0066FF",borderRadius:"3px 3px 0 0",height:`${Math.max(3,m.nb/maxV*50)}px`}}/>
                        <div style={{color:m.isCurrent?"#4D9EFF":C.muted,fontSize:9,fontWeight:m.isCurrent?700:400}}>{m.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })()}

            {/* Facturation */}
            <div style={{marginTop:16}}>
              <FacturationAdminPanel prestataires={prestataires} visites={visites}/>
            </div>

            {/* Sondages */}
            <div style={{marginTop:16}}>
              <SondagesPanel/>
            </div>

            {/* Modération avis */}
            <div style={{marginTop:16}}>
              <ModerationAvisPanel/>
            </div>

            {/* Partenaires cadeaux */}
            <div style={{marginTop:16}}>
              <PartenairesCadeauxPanel/>
            </div>

            {/* Bons cadeaux à valider */}
            <div style={{marginTop:16}}>
              <BonsCadeauxPanel/>
            </div>

            {/* Suggestions IOK'S */}
            <div style={{marginTop:16}}>
              <SuggestionsPanel type="siok" titre="Suggestions StuDiscount — Étudiants & Prestataires"/>
            </div>
          </div>
        )}

        {/* DRILL — PRESTATAIRES */}
        {!loading&&drill?.type==="prestataires"&&(
          <SIOKDrillPrestataires prestataires={prestataires} offres={offres} visites={visites} onLoadAll={loadAll}/>
        )}

        {/* DRILL — ÉTUDIANTS */}
        {!loading&&drill?.type==="etudiants"&&(
          <SIOKDrillEtudiants etudiants={etudiants} visites={visites}/>
        )}

        {/* DRILL — OFFRES / ACTIVES */}
        {!loading&&(drill?.type==="offres"||drill?.type==="actives")&&(
          <SIOKDrillOffres offres={offres} visites={visites} vues={vues} impressions={data.impressions||[]} filterActive={drill?.type==="actives"}/>
        )}

        {/* DRILL — VUES */}
        {!loading&&drill?.type==="visites"&&(
          <SIOKDrillVues vues={vues} offres={offres}/>
        )}
        {/* DRILL — HONORÉES */}
        {!loading&&drill?.type==="honorees"&&(
          <SIOKDrillVisites visites={visites}/>
        )}
        {/* DRILL — CA PRESTATAIRES */}
        {!loading&&drill?.type==="ca"&&(
          <SIOKDrillCA visites={visites} label="CA généré via l'application" field="montant_remise" color="#F59E0B"/>
        )}
        {/* DRILL — ÉCONOMIES ÉTUDIANTS */}
        {!loading&&drill?.type==="eco"&&(
          <SIOKDrillCA visites={visites} label="Économies générées pour les étudiants" field="eco" color="#22C55E"/>
        )}

        {/* DRILL — IMPRESSIONS */}
        {!loading&&drill?.type==="impressions"&&(
          <SIOKDrillImpressions impressions={impressions} offres={offres}/>
        )}

        {/* DRILL — POINTS → étudiants triés par points */}
        {!loading&&drill?.type==="points"&&(
          <SIOKDrillEtudiants etudiants={etudiants} visites={visites} defaultSort="points"/>
        )}
      </div>
    </div>
  );
}

/* ══ DRILL PRESTATAIRES ══════════════════════════════ */
function SIOKDrillPrestataires({prestataires,offres,visites,onLoadAll}){
  const [filterVille,setFilterVille]=useState("");
  const [filterPlan,setFilterPlan]=useState("");
  const [detail,setDetail]=useState(null);
  const [editing,setEditing]=useState(false);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");

  const villes=[...new Set(prestataires.map(p=>p.ville).filter(Boolean))].sort();
  const plans=["trial","base","standard","standard_monthly","standard_annual","premium","premium_monthly","premium_annual"];

  const filtered=prestataires.filter(p=>{
    if(filterVille&&p.ville!==filterVille)return false;
    if(filterPlan&&p.plan!==filterPlan)return false;
    return true;
  });

  const startEdit=(p)=>{
    setForm({
      nom:p.nom||"",
      type_metier:p.type_metier||"",
      adresse:p.adresse||"",
      ville:p.ville||"",
      telephone:p.telephone||"",
      siret:p.siret||"",
      nom_responsable:p.nom_responsable||"",
      plan:p.plan||"trial",
      lat:p.lat||"",
      lng:p.lng||"",
    });
    setEditing(true);
    setSaveMsg("");
  };

  const saveEdit=async()=>{
    setSaving(true);setSaveMsg("");
    try{
      const {error}=await db().from("prestataires").update({
        nom:form.nom,
        type_metier:form.type_metier,
        adresse:form.adresse,
        ville:form.ville,
        telephone:form.telephone,
        siret:form.siret,
        nom_responsable:form.nom_responsable,
        plan:form.plan,
        lat:parseFloat(form.lat)||null,
        lng:parseFloat(form.lng)||null,
      }).eq("id",detail.id);
      if(error)throw error;
      setSaveMsg("✅ Enregistré !");
      setEditing(false);
      await onLoadAll();
      setDetail({...detail,...form,lat:parseFloat(form.lat)||null,lng:parseFloat(form.lng)||null});
    }catch(e){setSaveMsg("❌ Erreur : "+e.message);}
    setSaving(false);
  };

  const F=(k,v)=>setForm(f=>({...f,[k]:v}));
  const inp=(k,label,type="text")=>(
    <div style={{marginBottom:10}}>
      <div style={{color:C.muted,fontSize:11,fontWeight:600,marginBottom:4}}>{label}</div>
      <input type={type} value={form[k]||""} onChange={e=>F(k,e.target.value)}
        style={{width:"100%",padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
    </div>
  );

  if(detail) return(
    <div>
      <button onClick={()=>{setDetail(null);setEditing(false);}} style={{marginBottom:16,padding:"6px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Liste prestataires</button>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{color:C.text,fontWeight:800,fontSize:18}}>{detail.nom}</div>
            <div style={{color:C.muted,fontSize:13}}>{detail.type_metier} · {detail.ville}</div>
          </div>
          <button onClick={()=>editing?setEditing(false):startEdit(detail)}
            style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:editing?"transparent":"rgba(0,102,255,0.1)",color:editing?C.muted:"#4D9EFF",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {editing?"Annuler":"✏️ Modifier"}
          </button>
        </div>

            {saveMsg&&<div style={{marginBottom:8,fontSize:13,color:saveMsg.startsWith("✅")?"#22C55E":"#EF4444"}}>{saveMsg}</div>}
            <button onClick={saveEdit} disabled={saving}

              {saving?"Enregistrement...":"💾 Enregistrer"}
            </button>
          </div>
        )}
      </div>

      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:10}}>Offres ({offres.filter(o=>o.prestataire_id===detail.id).length})</div>
      {offres.filter(o=>o.prestataire_id===detail.id).map(o=>{
        const nbVis=visites.filter(v=>v.offre_id===o.id).length;
        return(
          <div key={o.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{color:C.text,fontWeight:600}}>{o.titre}</div>
              <div style={{color:C.muted,fontSize:12}}>-{o.promo_pct}% {o.prix?`· ${o.prix}€`:""}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{color:"#0066FF",fontWeight:700}}>{nbVis} visites</div>
              <span style={{background:o.active?"rgba(34,197,94,0.1)":"rgba(107,114,128,0.1)",color:o.active?"#22c55e":"#6b7280",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>{o.active?"Active":"Inactive"}</span>
            </div>

  return(

          <option value="">Toutes les villes</option>
          {villes.map(v=><option key={v} value={v}>{v}</option>)}
        </select>
        <select value={filterPlan} onChange={e=>setFilterPlan(e.target.value)} style={{padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"}}>
          <option value="">Tous les plans</option>
          {plans.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <div style={{color:C.muted,fontSize:13,alignSelf:"center"}}>{filtered.length} prestataire{filtered.length>1?"s":""}</div>
      </div>
      <PrestataireCreator onCreated={onLoadAll}/>
      <table style={{width:"100%",borderCollapse:"collapse",marginTop:8}}>
        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
          {["Nom","Type","Ville","Plan","Offres actives","Visites","Auth"].map(h=>(
            <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {filtered.map(p=>{
            const act=offres.filter(o=>o.prestataire_id===p.id&&o.active).length;
            const tot=offres.filter(o=>o.prestataire_id===p.id).length;
            const vis=visites.filter(v=>v.prestataire_id===p.id).length;
            return(
              <tr key={p.id} onClick={()=>setDetail(p)} style={{borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(0,102,255,0.04)"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"10px 12px",color:C.text,fontWeight:600}}>{p.nom}</td>
                <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{p.type_metier}</td>
                <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{p.ville||"—"}</td>
                <td style={{padding:"10px 12px"}}><span style={{background:"rgba(0,102,255,0.1)",color:"#0066FF",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20}}>{p.plan||"trial"}</span></td>
                <td style={{padding:"10px 12px"}}><span style={{color:"#22c55e",fontWeight:700}}>{act}</span><span style={{color:C.muted,fontSize:11}}> / {tot}</span></td>
                <td style={{padding:"10px 12px",color:"#7C3AED",fontWeight:700}}>{vis}</td>
                <td style={{padding:"10px 12px"}}><span style={{color:p.auth_id?"#22c55e":"#ef4444"}}>{p.auth_id?"✅":"❌"}</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ══ DRILL ÉTUDIANTS ═════════════════════════════════ */
function SIOKDrillEtudiants({etudiants,visites,defaultSort}){
  const [sort,setSort]=useState(defaultSort||"date");
  const [filterStatut,setFilterStatut]=useState("");
  const [detail,setDetail]=useState(null);

  const sorted=[...etudiants]
    .filter(e=>!filterStatut||e.statut_validation===filterStatut)
    .sort((a,b)=>{
      if(sort==="points") return (b.points||0)-(a.points||0);
      return new Date(b.created_at)-new Date(a.created_at);
    });

  if(detail) return(
    <div>
      <button onClick={()=>setDetail(null)} style={{marginBottom:16,padding:"6px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Liste étudiants</button>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{color:C.text,fontWeight:800,fontSize:18,marginBottom:8}}>{detail.prenom}</div>
        {[["Téléphone",detail.telephone],["Email",detail.email],["INE",detail.numero_ine],["Établissement",detail.etablissement],["Statut",detail.statut_validation],["Points","⭐ "+(detail.points||0)],["Inscrit",new Date(detail.created_at).toLocaleDateString("fr-FR")]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
            <span style={{color:C.muted,fontSize:13}}>{l}</span>
            <span style={{color:C.text,fontSize:13,fontWeight:600}}>{v||"—"}</span>
          </div>
        ))}
      </div>
      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:10}}>Historique visites</div>
      {visites.filter(v=>v.etudiant_id===detail.id).map(v=>(
        <div key={v.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:C.text,fontWeight:600,fontSize:13}}>{v.offres?.titre||"Offre"}</div>
            <div style={{color:C.muted,fontSize:11}}>{v.prestataires?.nom} · {new Date(v.created_at).toLocaleDateString("fr-FR")}</div>
          </div>
          <span style={{color:"#F59E0B",fontWeight:700}}>+{v.points||0}⭐</span>
        </div>
      ))}
    </div>
  );

  return(
    <div>
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
        <select value={filterStatut} onChange={e=>setFilterStatut(e.target.value)} style={{padding:"8px 12px",borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"}}>
          <option value="">Tous les statuts</option>
          <option value="en_attente">En attente</option>
          <option value="valide">Validé</option>
          <option value="refuse">Refusé</option>
        </select>
        <div style={{display:"flex",gap:6}}>
          {[{v:"date",l:"Date"},{v:"points",l:"⭐ Points"}].map(s=>(
            <button key={s.v} onClick={()=>setSort(s.v)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${sort===s.v?"#0066FF":C.border}`,background:sort===s.v?"rgba(0,102,255,0.08)":"transparent",color:sort===s.v?"#0066FF":C.muted,fontSize:12,fontWeight:sort===s.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>{s.l}</button>
          ))}
        </div>
        <div style={{color:C.muted,fontSize:13}}>{sorted.length} étudiant{sorted.length>1?"s":""}</div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
          {["Prénom","Téléphone","Établissement","Statut","Points","Inscrit","Actions"].map(h=>(
            <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {sorted.map(e=>{
            const sc={en_attente:{bg:"rgba(234,179,8,0.1)",color:"#eab308",l:"⏳"},valide:{bg:"rgba(34,197,94,0.1)",color:"#22c55e",l:"✅"},refuse:{bg:"rgba(239,68,68,0.1)",color:"#ef4444",l:"✗"}}[e.statut_validation]||{bg:"rgba(107,114,128,0.1)",color:"#6b7280",l:"—"};
            return(
              <tr key={e.id} onClick={()=>setDetail(e)} style={{borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}
                onMouseEnter={ev=>ev.currentTarget.style.background="rgba(0,102,255,0.04)"}
                onMouseLeave={ev=>ev.currentTarget.style.background="transparent"}>
                <td style={{padding:"10px 12px",color:C.text,fontWeight:600}}>{e.prenom}</td>
                <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{e.telephone}</td>
                <td style={{padding:"10px 12px",color:C.muted,fontSize:12,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.etablissement||"—"}</td>
                <td style={{padding:"10px 12px"}}><span style={{background:sc.bg,color:sc.color,fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20}}>{sc.l}</span></td>
                <td style={{padding:"10px 12px",color:"#F59E0B",fontWeight:700}}>⭐ {e.points||0}</td>
                <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{e.created_at?new Date(e.created_at).toLocaleDateString("fr-FR"):"—"}</td>
                <td style={{padding:"10px 12px"}}>
                  <div style={{display:"flex",gap:4}}>
                    {e.statut_validation!=="valide"&&<button onClick={async ev=>{ev.stopPropagation();await db().from("etudiants").update({statut_validation:"valide"}).eq("id",e.id);}} style={{padding:"3px 8px",borderRadius:6,border:"1px solid rgba(34,197,94,0.3)",background:"rgba(34,197,94,0.1)",color:"#22c55e",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✓</button>}
                    {e.statut_validation!=="refuse"&&<button onClick={async ev=>{ev.stopPropagation();await db().from("etudiants").update({statut_validation:"refuse"}).eq("id",e.id);}} style={{padding:"3px 8px",borderRadius:6,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#ef4444",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✗</button>}
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}


/* ══ DRILL OFFRES ════════════════════════════════════ */
function SIOKDrillOffres({offres,visites,vues,impressions,filterActive}){
  const [filterVille,setFilterVille]=useState("");
  const [filterType,setFilterType]=useState("");
  const [sort,setSort]=useState("visites");
  const [detail,setDetail]=useState(null);
  const [editMode,setEditMode]=useState(false);
  const [editDates,setEditDates]=useState({debut:"",fin:""});
  const [editPhotos,setEditPhotos]=useState([]);
  const [uploading,setUploading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");

  const villes=[...new Set(offres.map(o=>o.prestataires?.ville).filter(Boolean))].sort();
  const types=[...new Set(offres.map(o=>o.type_offre).filter(Boolean))].sort();

  const filtered=offres
    .filter(o=>{
      const now2=new Date();
      const debut=o.date_debut?new Date(o.date_debut):null;
      const fin=o.date_fin?new Date(o.date_fin):null;
      const isReallyActive=o.active&&(o.permanente||((!debut||debut<=now2)&&(!fin||fin>=now2)));
      if(filterActive&&!isReallyActive) return false;
      if(filterVille&&o.prestataires?.ville!==filterVille) return false;
      if(filterType&&o.type_offre!==filterType) return false;
      return true;
    })
    .map(o=>({
      ...o,
      nbVisites:visites.filter(v=>v.offre_id===o.id).length,
      nbVues:vues.filter(v=>v.offre_id===o.id).length,
    }))
    .sort((a,b)=>{
      if(sort==="visites") return b.nbVisites-a.nbVisites;
      if(sort==="vues") return b.nbVues-a.nbVues;
      return new Date(b.created_at)-new Date(a.created_at);
    });

  const openDetail=async(o)=>{
    setDetail({...o});
    setEditMode(false);
    setSaveMsg("");
    const toD=(d)=>d?String(d).substring(0,10):"";
    const {data}=await db().from("offres").select("*, prestataires(nom,ville,type_metier)").eq("id",o.id).single();
    if(data){
      setDetail({...data, nbVisites:o.nbVisites, nbVues:o.nbVues});
      setEditDates({debut:toD(data.date_debut), fin:toD(data.date_fin)});
      setEditPhotos(data.photos||[]);
    } else {
      setEditDates({debut:toD(o.date_debut), fin:toD(o.date_fin)});
      setEditPhotos(o.photos||[]);
    }
  };

  const uploadPhoto=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    setUploading(true);
    try{
      const ext=file.name.split(".").pop();
      const path=`offres/${detail.id}/${Date.now()}.${ext}`;
      const {error:upErr}=await db().storage.from("siok-offer-photos").upload(path,file,{upsert:true});
      if(upErr) throw upErr;
      const {data}=db().storage.from("siok-offer-photos").getPublicUrl(path);
      setEditPhotos(prev=>[...prev,{url:data.publicUrl,path}]);
    }catch(e){alert("Erreur upload : "+e.message);}
    setUploading(false);
    e.target.value="";
  };

  const deletePhoto=async(photo)=>{
    try{
      await db().storage.from("siok-offer-photos").remove([photo.path]);
    }catch(e){console.warn("Storage delete:",e);}
    setEditPhotos(prev=>prev.filter(p=>p.path!==photo.path));
  };

  const saveOffre=async()=>{
    setSaving(true); setSaveMsg("");
    try{
      const updates={
        photos:editPhotos,
        date_debut:editDates.debut||null,
        date_fin:editDates.fin||null,
      };
      console.log("SAVE:", detail.id, JSON.stringify(updates));
      const {data,error}=await db().from("offres").update(updates).eq("id",detail.id).select();
      console.log("RESULT:", JSON.stringify({data,error}));
      if(error) throw error;
      if(!data||data.length===0) throw new Error("Aucune ligne modifiée — vérifier RLS");
      setSaveMsg("✅ Offre mise à jour");
      setDetail(d=>({...d,...updates}));
      setEditMode(false);
    }catch(e){setSaveMsg("❌ "+e.message);console.error("SAVE ERROR:",e);}
    setSaving(false);
  };

  if(detail) return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button onClick={()=>setDetail(null)} style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>← Liste offres</button>
        <button onClick={()=>setEditMode(!editMode)} style={{padding:"6px 14px",borderRadius:8,border:`1px solid ${editMode?"#0066FF":C.border}`,background:editMode?"rgba(0,102,255,0.08)":"transparent",color:editMode?"#0066FF":C.muted,fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:editMode?700:400}}>
          {editMode?"✕ Annuler":"✏️ Modifier"}
        </button>
      </div>

      {/* Infos offre */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{color:C.text,fontWeight:800,fontSize:18,marginBottom:4}}>{detail.titre}</div>
        <div style={{color:C.muted,fontSize:13,marginBottom:8}}>{detail.prestataires?.nom} · {detail.prestataires?.ville}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>
          {[{l:"Vues",v:detail.nbVues,c:"#6B7280"},{l:"Visites",v:detail.nbVisites,c:"#0066FF"},{l:"Conversion",v:detail.nbVues>0?Math.round(detail.nbVisites/detail.nbVues*100)+"%":"—",c:"#22C55E"}].map(s=>(
            <div key={s.l} style={{background:C.surface,borderRadius:10,padding:"10px",textAlign:"center",border:`1px solid ${C.border}`}}>
              <div style={{color:s.c,fontWeight:800,fontSize:20}}>{s.v}</div>
              <div style={{color:C.muted,fontSize:11}}>{s.l}</div>
            </div>
          ))}
        </div>
        {detail.description&&<div style={{color:C.muted,fontSize:13,lineHeight:1.6,padding:"10px 12px",background:C.surface,borderRadius:8}}>{detail.description}</div>}
      </div>

      {/* ── PANNEAU MODIFICATION ── */}
      {editMode&&(
        <div style={{background:C.card,border:`2px solid #0066FF`,borderRadius:14,padding:16,marginBottom:16}}>
          <div style={{color:"#0066FF",fontWeight:700,fontSize:14,marginBottom:14}}>✏️ Modifier l'offre</div>

          {/* Dates */}
          <div style={{marginBottom:16}}>
            <div style={{color:C.text,fontWeight:600,fontSize:13,marginBottom:8}}>📅 Dates</div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:140}}>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Date début</div>
                <input type="date" value={editDates.debut} onChange={e=>setEditDates(d=>({...d,debut:e.target.value}))}
                  style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
              </div>
              <div style={{flex:1,minWidth:140}}>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Date fin</div>
                <input type="date" value={editDates.fin} onChange={e=>setEditDates(d=>({...d,fin:e.target.value}))}
                  style={{width:"100%",padding:"8px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"}}/>
              </div>
            </div>
          </div>

          {/* Photos */}
          <div style={{marginBottom:16}}>
            <div style={{color:C.text,fontWeight:600,fontSize:13,marginBottom:8}}>🖼️ Photos ({editPhotos.length})</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
              {editPhotos.map((p,i)=>(
                <div key={i} style={{position:"relative",width:80,height:80,borderRadius:8,overflow:"hidden",border:`1px solid ${C.border}`}}>
                  <img src={p.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                  <button onClick={()=>deletePhoto(p)}
                    style={{position:"absolute",top:2,right:2,width:20,height:20,borderRadius:"50%",background:"rgba(239,68,68,0.9)",border:"none",color:"white",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>✕</button>
                </div>
              ))}
              {editPhotos.length===0&&(

            const fin=o.date_fin?new Date(o.date_fin):null;
            const isAVenir=o.active&&debut&&debut>now2;
            const isExpiree=o.active&&fin&&fin<now2;
            const isActive=o.active&&!isAVenir&&!isExpiree;
            const statut=!o.active
              ?{bg:"rgba(107,114,128,0.1)",color:"#6b7280",label:"⏸ Inactive"}
              :isAVenir
              ?{bg:"rgba(59,130,246,0.1)",color:"#3b82f6",label:"🔜 À venir"}
              :isExpiree
              ?{bg:"rgba(239,68,68,0.1)",color:"#ef4444",label:"⌛ Expirée"}
              :{bg:"rgba(34,197,94,0.1)",color:"#22c55e",label:"✓ Active"};

            return(
            <tr key={o.id} onClick={()=>openDetail(o)} style={{borderBottom:`1px solid ${C.border}`,cursor:"pointer"}}

              <td style={{padding:"10px 12px",color:C.text,fontWeight:600,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.titre}</td>

              <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{o.prestataires?.ville||"—"}</td>
              <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{o.type_offre}</td>
              <td style={{padding:"10px 12px"}}><span style={{background:"rgba(0,102,255,0.1)",color:"#0066FF",fontWeight:700,fontSize:12,padding:"2px 8px",borderRadius:16}}>-{o.promo_pct}%</span></td>
              <td style={{padding:"10px 12px",color:"#9CA3AF",fontWeight:700}}>{o.nbImpressions||0}</td>
              <td style={{padding:"10px 12px",color:"#6B7280",fontWeight:700}}>{o.nbVues}</td>
              <td style={{padding:"10px 12px",color:"#0066FF",fontWeight:700}}>{o.nbVisites}</td>
              <td style={{padding:"10px 12px",color:C.muted,fontSize:12,whiteSpace:"nowrap"}}>
                {o.permanente

              <td style={{padding:"10px 12px"}}>
                <span style={{background:statut.bg,color:statut.color,fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>{statut.label}</span>

            </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}


/* ══ DRILL IMPRESSIONS ══════════════════════════════ */
function SIOKDrillImpressions({impressions,offres}){
  // Compter par offre
  const parOffre={};
  impressions.forEach(i=>{parOffre[i.offre_id]=(parOffre[i.offre_id]||0)+1;});
  const sorted=Object.entries(parOffre)
    .map(([id,nb])=>({id,nb,offre:offres.find(o=>o.id===id)}))
    .sort((a,b)=>b.nb-a.nb);

  // Par mois
  const now=new Date();
  const parMois=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const m=d.getMonth(),y=d.getFullYear();
    const label=d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
    const nb=impressions.filter(v=>{const vd=new Date(v.created_at);return vd.getMonth()===m&&vd.getFullYear()===y;}).length;
    parMois.push({label,nb});
  }
  const maxM=Math.max(...parMois.map(m=>m.nb),1);

  return(
    <div>
      <div style={{color:C.muted,fontSize:13,marginBottom:16}}>
        {impressions.length} impression{impressions.length>1?"s":""} enregistrée{impressions.length>1?"s":""}
      </div>

      {/* Graphe par mois */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>📅 Impressions par mois</div>
        <div style={{display:"flex",gap:8,alignItems:"flex-end",height:60}}>
          {parMois.map(m=>(
            <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{color:C.muted,fontSize:10,fontWeight:700}}>{m.nb}</div>
              <div style={{width:"100%",background:"#9CA3AF",borderRadius:"3px 3px 0 0",height:`${Math.max(3,m.nb/maxM*50)}px`}}/>
              <div style={{color:C.muted,fontSize:9}}>{m.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Top offres par impressions */}
      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:10}}>Top offres</div>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
          {["Offre","Prestataire","Ville","Impressions"].map(h=>(
            <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {sorted.map(({id,nb,offre})=>(
            <tr key={id} style={{borderBottom:`1px solid ${C.border}`}}>
              <td style={{padding:"10px 12px",color:C.text,fontWeight:600,fontSize:13}}>{offre?.titre||"—"}</td>
              <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{offre?.prestataires?.nom||"—"}</td>
              <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{offre?.prestataires?.ville||"—"}</td>
              <td style={{padding:"10px 12px",color:"#9CA3AF",fontWeight:700,fontSize:15}}>{nb}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ══ DRILL CA / ECO ═════════════════════════════════ */
function SIOKDrillCA({visites, label, field, color}){
  const now=new Date();
  const getVal=(v)=>field==="eco"?(v.montant_normal||0)-(v.montant_remise||0):(v[field]||0);
  const total=visites.reduce((s,v)=>s+getVal(v),0);
  const mois=visites.filter(v=>new Date(v.created_at).getMonth()===now.getMonth()).reduce((s,v)=>s+getVal(v),0);
  const avecMontant=visites.filter(v=>getVal(v)>0);
  return(
    <div>
      <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>{label}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[{l:"Ce mois",v:mois},{l:"Total",v:total}].map(s=>(
          <div key={s.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px",textAlign:"center"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
              <i className="ti ti-currency-euro" style={{fontSize:18,color}}/>
              <span style={{color,fontWeight:800,fontSize:20}}>{s.v.toFixed(2)}</span>
            </div>
            <div style={{color:C.muted,fontSize:11,marginTop:3}}>{s.l}</div>
          </div>
        ))}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
          {["Offre","Prestataire","Date","Montant"].map(h=>(
            <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase"}}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {avecMontant.slice(0,50).map(v=>(
            <tr key={v.id} style={{borderBottom:`1px solid ${C.border}`}}>
              <td style={{padding:"9px 12px",color:C.text,fontSize:12,fontWeight:600}}>{v.offres?.titre||"—"}</td>
              <td style={{padding:"9px 12px",color:C.muted,fontSize:11}}>{v.prestataires?.nom||"—"}</td>
              <td style={{padding:"9px 12px",color:C.muted,fontSize:11}}>{new Date(v.created_at).toLocaleDateString("fr-FR")}</td>
              <td style={{padding:"9px 12px"}}>
                <span style={{color,fontWeight:700}}>{getVal(v).toFixed(2)}€</span>
                {field==="eco"&&v.montant_normal&&<span style={{color:C.muted,fontSize:10,marginLeft:4}}>({v.montant_normal}→{v.montant_remise}€)</span>}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

  prestataires.forEach(p=>{const k=parPlan[p.plan]!==undefined?p.plan:"autre";parPlan[k]++;});
  const visitesParPrest={};
  visites.forEach(v=>{if(v.prestataire_id)visitesParPrest[v.prestataire_id]=(visitesParPrest[v.prestataire_id]||0)+1;});
