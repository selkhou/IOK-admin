                <td style={{padding:"8px 10px",color:C.text,fontWeight:700}}>{tot}</td>
                <td style={{padding:"8px 10px",color:"#22c55e",fontWeight:700}}>{act}</td>
                <td style={{padding:"8px 10px",color:"#6b7280"}}>{tot-act}</td>
                <td style={{padding:"8px 10px",color:"#6B7280"}}>{vues.filter(v=>offres.filter(o=>o.prestataire_id===p.id).map(o=>o.id).includes(v.offre_id)).length}</td>
                <td style={{padding:"8px 10px",color:"#6B7280"}}>{vues.filter(v=>{const ids=offres.filter(o=>o.prestataire_id===p.id).map(o=>o.id);return ids.includes(v.offre_id);}).length}</td>
                <td style={{padding:"8px 10px",color:"#7C3AED",fontWeight:700}}>{vis}</td>
                <td style={{padding:"8px 10px",color:"#F5A623",fontWeight:600}}>{noteMoy!=="-"?`★ ${noteMoy}`:"-"}</td>
              </tr>);
            })}
          </tbody>
        </table>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16,marginBottom:16}}>
        <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>📅 Visites par mois (6 derniers mois)</div>
        <div style={{display:"flex",gap:8,alignItems:"flex-end",height:80}}>
          {visMois.map(m=>(
            <div key={m.label} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
              <div style={{color:C.muted,fontSize:10,fontWeight:700}}>{m.nb}</div>
              <div style={{width:"100%",background:"#0066FF",borderRadius:"4px 4px 0 0",height:`${Math.max(4,m.nb/maxVis*60)}px`}}/>
              <div style={{color:C.muted,fontSize:9}}>{m.label}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
          <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>🏆 Top prestataires (visites)</div>
          {topPrestataires.map((p,i)=>(
            <div key={p.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
              <span style={{color:i<3?"#F59E0B":C.muted,fontSize:12,fontWeight:700}}>#{i+1} {p.nom}</span>
              <span style={{color:"#7C3AED",fontWeight:700}}>{p.nb}</span>
            </div>
          ))}
        </div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:16}}>
          <div style={{color:C.text,fontWeight:700,fontSize:14,marginBottom:12}}>⭐ Top étudiants (points)</div>
          {topEtudiants.map((e,i)=>(
            <div key={e.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
              <div><span style={{color:i<3?"#F59E0B":C.muted,fontSize:12,fontWeight:700}}>#{i+1} {e.prenom}</span><div style={{color:C.muted,fontSize:10}}>{visitesParEt[e.id]||0} visite{(visitesParEt[e.id]||0)>1?"s":""}</div></div>
              <span style={{color:"#F59E0B",fontWeight:700}}>⭐ {e.points||0}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:"linear-gradient(135deg,rgba(245,158,11,0.1),rgba(245,158,11,0.05))",border:"1px solid rgba(245,158,11,0.2)",borderRadius:14,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{color:"#F59E0B",fontWeight:800,fontSize:20}} onClick={()=>console.log("ETUDIANTS:",etudiants.map(e=>({p:e.prenom,pts:e.points})))}>⭐ {etudiants.reduce((s,e)=>s+(e.points||0),0)} points distribués</div>
            <div style={{color:C.muted,fontSize:12,marginTop:2}}>dont {visites.filter(v=>v.avis).length} avis · {visites.filter(v=>v.photo_url).length} photos</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:C.muted,fontSize:11}}>Moy. points/étudiant</div>
            <div style={{color:"#F59E0B",fontWeight:800,fontSize:18}}>{etudiants.length>0?(visites.reduce((s,v)=>s+(v.points||0),0)/etudiants.length).toFixed(1):0}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══ SIOK SETTINGS MANAGER ═══════════════════════════ */
function SIOKSettingsManager(){
  const [params,setParams]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(null);
  const [success,setSuccess]=useState("");
  const [types,setTypes]=useState([]);
  const [loadingTypes,setLoadingTypes]=useState(true);
  const [newType,setNewType]=useState({id:"",label:"",emoji:"🎯",groupe:"restauration",ordre:99});
  const [editType,setEditType]=useState(null);
  const [showAddForm,setShowAddForm]=useState(false);

  const GROUPES_META=[
    {id:"restauration",label:"Resto"},
    {id:"soins",label:"Soins"},
    {id:"loisirs",label:"Loisirs"},
    {id:"sport",label:"Sport"},
    {id:"services",label:"Services"},
    {id:"sante",label:"Santé"},
    {id:"hebergement",label:"Hébergement"},
  ];

  const SIOK_META={
    fond_couleur:             {label:"Couleur du fond app étudiant",       unit:"",       icon:"🎨", type:"color",   default:"#F5F5F5",    section:"App"},
    fond_couleur_presta:      {label:"Couleur du fond app prestataire",    unit:"",       icon:"🎨", type:"color",   default:"#0C0D0F",    section:"App"},
    fond_header_presta:       {label:"Couleur bandeau haut prestataire",   unit:"",       icon:"🎨", type:"color",   default:"#15171A",    section:"App"},
    visibilite_anticipee_h:   {label:"Visibilité anticipée des offres",    unit:"heures", icon:"🔜", type:"number",  min:1, max:72,  default:24,    section:"App"},
    duree_max_offre_jours:    {label:"Durée maximum d'une offre",          unit:"jours",  icon:"📅", type:"number",  min:1, max:30,  default:7,     section:"App"},
    test_mode:                {label:"Mode test (IOK + SIOK)",             unit:"",       icon:"🧪", type:"toggle",  options:["true","false"], default:"true", section:"App"},
    base_mensuel_prix:        {label:"Base — Prix mensuel",                unit:"€/mois", icon:"📦", type:"decimal", min:0, max:999, default:0,     section:"Tarifs"},
    base_annuel_prix:         {label:"Base — Prix annuel (par mois)",      unit:"€/mois", icon:"📦", type:"decimal", min:0, max:999, default:0,     section:"Tarifs"},
    base_commission:          {label:"Base — Commission par vente",        unit:"%",      icon:"💰", type:"decimal", min:0, max:100, default:15,    section:"Tarifs"},
    standard_mensuel_prix:    {label:"Standard — Prix mensuel",            unit:"€/mois", icon:"📊", type:"decimal", min:0, max:999, default:49.90, section:"Tarifs"},
    standard_annuel_prix:     {label:"Standard — Prix annuel (par mois)",  unit:"€/mois", icon:"📊", type:"decimal", min:0, max:999, default:39.90, section:"Tarifs"},
    standard_commission:      {label:"Standard — Commission par vente",    unit:"%",      icon:"💰", type:"decimal", min:0, max:100, default:9,     section:"Tarifs"},
    premium_mensuel_prix:     {label:"Premium — Prix mensuel",             unit:"€/mois", icon:"🤖", type:"decimal", min:0, max:999, default:79.90, section:"Tarifs"},
    premium_annuel_prix:      {label:"Premium — Prix annuel (par mois)",   unit:"€/mois", icon:"🤖", type:"decimal", min:0, max:999, default:59.90, section:"Tarifs"},
    premium_commission:       {label:"Premium — Commission par vente",     unit:"%",      icon:"💰", type:"decimal", min:0, max:100, default:5,     section:"Tarifs"},
  };

  const loadParams=async()=>{setLoading(true);const {data}=await db().from("parametres").select("*").order("cle");if(data)setParams(data);setLoading(false);};
  const loadTypes=async()=>{setLoadingTypes(true);const {data}=await db().from("types_metier").select("*").order("groupe").order("ordre");if(data)setTypes(data);setLoadingTypes(false);};
  const saveParam=async(cle,valeur)=>{
    setSaving(cle);
    await db().from("parametres").upsert({cle,valeur:String(valeur),updated_at:new Date().toISOString()});
    setParams(ps=>{
      const exists=ps.find(p=>p.cle===cle);
      if(exists) return ps.map(p=>p.cle===cle?{...p,valeur:String(valeur)}:p);
      return [...ps,{cle,valeur:String(valeur)}];
    });
    setSuccess("✅ Mis à jour");
    setTimeout(()=>setSuccess(""),2000);
    setSaving(null);
  };

  const addType=async()=>{
    if(!newType.id.trim()||!newType.label.trim()) return setSuccess("❌ ID et label requis");
    const {error}=await db().from("types_metier").insert({
      id:newType.id.trim().toLowerCase().replace(/\s+/g,"_"),
      label:newType.label.trim(),
      emoji:newType.emoji||"🎯",
      groupe:newType.groupe,
      categorie:GROUPES_META.find(g=>g.id===newType.groupe)?.label||newType.groupe,
      actif:true,
      ordre:parseInt(newType.ordre)||99,
      color:"#0066FF"
    });
    if(error){setSuccess("❌ "+error.message);return;}
    setSuccess("✅ Type ajouté");
    setNewType({id:"",label:"",emoji:"🎯",groupe:"restauration",ordre:99});
    setShowAddForm(false);
    loadTypes();
    setTimeout(()=>setSuccess(""),3000);
  };

  const updateType=async()=>{
    if(!editType) return;
    const {error}=await db().from("types_metier").update({
      label:editType.label,
      emoji:editType.emoji,
      groupe:editType.groupe,
      ordre:parseInt(editType.ordre)||99,
    }).eq("id",editType.id);
    if(error){setSuccess("❌ "+error.message);return;}
    setSuccess("✅ Type mis à jour");
    setEditType(null);
    loadTypes();
    setTimeout(()=>setSuccess(""),2000);
  };

  const toggleType=async(t)=>{
    await db().from("types_metier").update({actif:!t.actif}).eq("id",t.id);
    setTypes(ts=>ts.map(x=>x.id===t.id?{...x,actif:!t.actif}:x));
  };

  useEffect(()=>{loadParams();loadTypes();},[]);

  const allParams=Object.entries(SIOK_META).map(([cle,meta])=>({cle,valeur:params.find(p=>p.cle===cle)?.valeur??String(meta.default),meta}));
  const inputStyle={background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"8px 12px",color:"#F1F5F9",fontSize:14,outline:"none",fontFamily:"inherit",width:80,textAlign:"center"};
  const fieldStyle={width:"100%",padding:"8px 10px",borderRadius:8,border:`1px solid ${C.border}`,background:C.surface,color:C.text,fontSize:13,fontFamily:"inherit",outline:"none"};

  return(
    <div>
      <div style={{color:C.text,fontSize:20,fontWeight:800,marginBottom:4}}>⚙️ Paramètres StuDiscount</div>
      <div style={{color:C.muted,fontSize:13,marginBottom:20}}>Ces valeurs s'appliquent à l'application étudiante.</div>
      {success&&<div style={{background:success.startsWith("✅")?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",borderRadius:8,padding:"8px 14px",marginBottom:14,color:success.startsWith("✅")?"#22c55e":"#ef4444",fontSize:13}}>{success}</div>}

      {/* ── PARAMÈTRES APP + TARIFS ── */}
      {loading?<div style={{color:C.muted}}>Chargement…</div>:
        <div>
          {["App","Tarifs"].map(section=>{
            const sectionParams = allParams.filter(({meta})=>meta.section===section||(!meta.section&&section==="App"));
            return(
              <div key={section} style={{marginBottom:20}}>
                <div style={{color:C.muted,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:10}}>{section}</div>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {sectionParams.map(({cle,valeur,meta})=>(
                    <div key={cle} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:18}}>{meta.icon}</span>
                        <div><div style={{color:C.text,fontSize:13,fontWeight:600}}>{meta.label}</div>{meta.unit&&<div style={{color:C.muted,fontSize:11}}>{meta.unit}</div>}</div>
                      </div>
                      {(meta.type==="number"||meta.type==="decimal")&&<div style={{display:"flex",alignItems:"center",gap:6}}>
                        <input type="number" step={meta.type==="decimal"?"0.01":"1"} value={valeur}
                          onChange={e=>setParams(ps=>ps.map(p=>p.cle===cle?{...p,valeur:e.target.value}:p))}
                          onBlur={e=>saveParam(cle,e.target.value)}
                          style={inputStyle} min={meta.min} max={meta.max}/>
                      </div>}
                      {meta.type==="color"&&<div style={{display:"flex",alignItems:"center",gap:8}}>
                        <input type="color" value={valeur||meta.default}
                          onChange={e=>{
                            const v=e.target.value;
                            setParams(ps=>ps.map(p=>p.cle===cle?{...p,valeur:v}:p));
                            saveParam(cle,v);
                          }}
                          style={{width:40,height:32,borderRadius:8,border:"none",cursor:"pointer",padding:2}}/>
                        <span style={{color:C.muted,fontSize:12,fontFamily:"monospace"}}>{valeur||meta.default}</span>
                      </div>}
                      {meta.type==="toggle"&&<div onClick={()=>saveParam(cle,valeur==="true"?"false":"true")} style={{width:44,height:24,borderRadius:12,background:valeur==="true"?"#22c55e":"#374151",cursor:"pointer",position:"relative",transition:"background 0.2s"}}><div style={{position:"absolute",top:2,left:valeur==="true"?22:2,width:20,height:20,borderRadius:"50%",background:"white",transition:"left 0.2s"}}/></div>}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      }

      {/* ── TYPES & MÉTIERS ── */}
      <div style={{marginTop:28}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <div style={{color:C.muted,fontSize:11,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>Types & Métiers</div>
            <div style={{color:C.muted,fontSize:12,marginTop:2}}>{types.length} types · chargés depuis Supabase</div>
          </div>
          <button onClick={()=>setShowAddForm(!showAddForm)}
            style={{padding:"7px 14px",borderRadius:8,border:"none",background:"#0066FF",color:"white",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {showAddForm?"✕ Annuler":"+ Nouveau type"}
          </button>
        </div>

        {/* Formulaire ajout */}
        {showAddForm&&(
          <div style={{background:C.card,border:`2px solid #0066FF`,borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{color:"#0066FF",fontWeight:700,fontSize:13,marginBottom:12}}>+ Nouveau type</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>ID (snake_case)</div>
                <input value={newType.id} onChange={e=>setNewType(t=>({...t,id:e.target.value}))}
                  placeholder="ex: libanais" style={fieldStyle}/>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Label</div>
                <input value={newType.label} onChange={e=>setNewType(t=>({...t,label:e.target.value}))}
                  placeholder="ex: Libanais" style={fieldStyle}/>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Emoji</div>
                <input value={newType.emoji} onChange={e=>setNewType(t=>({...t,emoji:e.target.value}))}
                  placeholder="🎯" style={{...fieldStyle,width:80}}/>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Catégorie</div>
                <select value={newType.groupe} onChange={e=>setNewType(t=>({...t,groupe:e.target.value}))} style={fieldStyle}>
                  {GROUPES_META.map(g=><option key={g.id} value={g.id}>{g.label}</option>)}
                </select>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Ordre</div>
                <input type="number" value={newType.ordre} onChange={e=>setNewType(t=>({...t,ordre:e.target.value}))}
                  style={{...fieldStyle,width:80}}/>
              </div>
            </div>
            <button onClick={addType}
              style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#0066FF",color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              💾 Ajouter
            </button>
          </div>
        )}

        {/* Formulaire édition */}
        {editType&&(
          <div style={{background:C.card,border:`2px solid #F59E0B`,borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{color:"#F59E0B",fontWeight:700,fontSize:13,marginBottom:12}}>✏️ Modifier — {editType.id}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Label</div>
                <input value={editType.label} onChange={e=>setEditType(t=>({...t,label:e.target.value}))} style={fieldStyle}/>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Emoji</div>
                <input value={editType.emoji} onChange={e=>setEditType(t=>({...t,emoji:e.target.value}))} style={{...fieldStyle,width:80}}/>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Catégorie</div>
                <select value={editType.groupe} onChange={e=>setEditType(t=>({...t,groupe:e.target.value}))} style={fieldStyle}>
                  {GROUPES_META.map(g=><option key={g.id} value={g.id}>{g.label}</option>)}
                </select>
              </div>
              <div>
                <div style={{color:C.muted,fontSize:11,marginBottom:4}}>Ordre</div>
                <input type="number" value={editType.ordre} onChange={e=>setEditType(t=>({...t,ordre:e.target.value}))} style={{...fieldStyle,width:80}}/>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={updateType} style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#F59E0B",color:"white",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>💾 Sauvegarder</button>
              <button onClick={()=>setEditType(null)} style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Annuler</button>
            </div>
          </div>
        )}

        {/* Liste des types par groupe */}
        {loadingTypes?<div style={{color:C.muted,fontSize:13}}>Chargement…</div>:(
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {GROUPES_META.map(g=>{
              const gtypes=types.filter(t=>t.groupe===g.id);
              if(!gtypes.length) return null;
              return(
                <div key={g.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden"}}>
                  <div style={{padding:"10px 14px",background:C.surface,borderBottom:`1px solid ${C.border}`,color:C.text,fontWeight:700,fontSize:13}}>
                    {g.label} <span style={{color:C.muted,fontWeight:400}}>({gtypes.length})</span>
                  </div>
                  <div>
                    {gtypes.map(t=>(
                      <div key={t.id} style={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,borderBottom:`1px solid ${C.border}`,opacity:t.actif?1:0.5}}>
                        <span style={{fontSize:20,width:28}}>{t.emoji}</span>
                        <div style={{flex:1}}>
                          <div style={{color:C.text,fontSize:13,fontWeight:600}}>{t.label}</div>
                          <div style={{color:C.muted,fontSize:11}}>{t.id} · ordre {t.ordre}</div>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={()=>setEditType({...t})}
                            style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${C.border}`,background:"transparent",color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>✏️</button>
                          <button onClick={()=>toggleType(t)}
                            style={{padding:"4px 10px",borderRadius:6,border:"none",background:t.actif?"rgba(239,68,68,0.1)":"rgba(34,197,94,0.1)",color:t.actif?"#ef4444":"#22c55e",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                            {t.actif?"⏸":"▶️"}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── SIOK ADMIN TAB ────────────────────────────────────────────
function SIOKAdminTab(){
  const [tab,setTab]=useState("etudiants"); // etudiants | prestataires | offres
  const [etudiants,setEtudiants]=useState([]);
  const [prestataires,setPrestataires]=useState([]);
  const [offres,setOffres]=useState([]);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{loadAll();},[]);

  const loadAll=async()=>{
    setLoading(true);
    try{
      const [e,p,o]=await Promise.all([
        db().from("etudiants").select("*").order("created_at",{ascending:false}).limit(200),
        db().from("prestataires").select("*").order("created_at",{ascending:false}).limit(200),
        db().from("offres").select("*, prestataires(nom)").order("created_at",{ascending:false}).limit(500),
      ]);
      setEtudiants(e.data||[]);
      setPrestataires(p.data||[]);
      setOffres(o.data||[]);
    }catch(err){console.error(err);}
    setLoading(false);
  };

  const validerEtudiant=async(id,statut)=>{
    await db().from("etudiants").update({statut_validation:statut}).eq("id",id);
    setEtudiants(es=>es.map(e=>e.id===id?{...e,statut_validation:statut}:e));
  };

  const [TYPES,setTYPES]=useState([
    {id:"restaurant",emoji:"🍽️",label:"Restaurant"},
    {id:"autre",emoji:"🎯",label:"Autre"},
  ]);
  const getType=(id)=>TYPES.find(t=>t.id===id)||{id:"autre",emoji:"🎯",label:id};
  useEffect(()=>{
    db().from("types_metier").select("*").eq("actif",true).order("ordre")
      .then(({data})=>{if(data&&data.length)setTYPES(data);});
  },[]);

  const tabs=[
    {v:"etudiants",l:`🎓 Étudiants (${etudiants.length})`},
    {v:"prestataires",l:`🏪 Prestataires (${prestataires.length})`},
    {v:"offres",l:`🎯 Offres (${offres.length})`},
  ];

  return(
    <div>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <div style={{color:C.text,fontSize:22,fontWeight:800,letterSpacing:-0.5}}>🎓 StuDiscount — Students</div>
          <div style={{color:C.muted,fontSize:13,marginTop:2}}>Gestion de la plateforme étudiante</div>
        </div>
        <div style={{display:"flex",gap:12}}>
          <div style={{background:"rgba(0,102,255,0.1)",border:"1px solid rgba(0,102,255,0.2)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
            <div style={{color:"#0066FF",fontWeight:800,fontSize:18}}>{etudiants.filter(e=>e.statut_validation==="en_attente").length}</div>
            <div style={{color:C.muted,fontSize:11}}>En attente</div>
          </div>
          <div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
            <div style={{color:"#22c55e",fontWeight:800,fontSize:18}}>{offres.filter(o=>o.active).length}</div>
            <div style={{color:C.muted,fontSize:11}}>Offres actives</div>
          </div>
        </div>
      </div>

      {/* Sous-onglets */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {tabs.map(t=>(
          <button key={t.v} onClick={()=>setTab(t.v)}
            style={{padding:"8px 16px",borderRadius:10,border:`1px solid ${tab===t.v?"rgba(0,102,255,0.5)":C.border}`,background:tab===t.v?"rgba(0,102,255,0.1)":"transparent",color:tab===t.v?"#0066FF":C.muted,fontSize:12,fontWeight:tab===t.v?700:400,cursor:"pointer",fontFamily:"inherit"}}>
            {t.l}
          </button>
        ))}
      </div>

      {loading&&<div style={{textAlign:"center",padding:40,color:C.muted}}>Chargement…</div>}

      {/* ÉTUDIANTS */}
      {!loading&&tab==="etudiants"&&(
        <div>
          {etudiants.filter(e=>e.statut_validation==="en_attente").length>0&&(
            <div style={{background:"rgba(234,179,8,0.08)",border:"1px solid rgba(234,179,8,0.2)",borderRadius:12,padding:"10px 16px",marginBottom:16,color:"#eab308",fontSize:13}}>
              ⏳ {etudiants.filter(e=>e.statut_validation==="en_attente").length} étudiant(s) en attente de validation
            </div>
          )}
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Prénom","Téléphone","INE","Établissement","Carte","Statut","Actions"].map(h=>(
                  <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase",letterSpacing:1}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {etudiants.map(e=>{
                const sc={
                  en_attente:{bg:"rgba(234,179,8,0.1)",color:"#eab308",label:"⏳ En attente"},
                  valide:{bg:"rgba(34,197,94,0.1)",color:"#22c55e",label:"✅ Validé"},
                  refuse:{bg:"rgba(239,68,68,0.1)",color:"#ef4444",label:"✗ Refusé"},
                }[e.statut_validation]||{bg:"rgba(107,114,128,0.1)",color:"#6b7280",label:"—"};
                return(
                  <tr key={e.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:"10px 12px",color:C.text,fontWeight:600}}>{e.prenom}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{e.telephone}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{e.numero_ine||"—"}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.etablissement||"—"}</td>
                    <td style={{padding:"10px 12px"}}>
                      {e.photo_carte_url
                        ?<a href={e.photo_carte_url} target="_blank" rel="noopener"
                            style={{color:"#0066FF",fontSize:12,fontWeight:600}}>📷 Voir</a>
                        :<span style={{color:C.muted,fontSize:12}}>—</span>
                      }
                    </td>
                    <td style={{padding:"10px 12px"}}>
                      <span style={{background:sc.bg,color:sc.color,fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20}}>{sc.label}</span>
                    </td>
                    <td style={{padding:"10px 12px"}}>
                      <div style={{display:"flex",gap:6}}>
                        {e.statut_validation!=="valide"&&(
                          <button onClick={()=>validerEtudiant(e.id,"valide")}
                            style={{padding:"4px 10px",borderRadius:6,border:"1px solid rgba(34,197,94,0.3)",background:"rgba(34,197,94,0.1)",color:"#22c55e",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>
                            ✓ Valider
                          </button>
                        )}
                        {e.statut_validation!=="refuse"&&(
                          <button onClick={()=>validerEtudiant(e.id,"refuse")}
                            style={{padding:"4px 10px",borderRadius:6,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.08)",color:"#ef4444",fontSize:11,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>
                            ✗ Refuser
                          </button>
                        )}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* PRESTATAIRES */}
      {!loading&&tab==="prestataires"&&(
        <div>
          {/* Formulaire création prestataire */}
          <PrestataireCreator onCreated={loadAll}/>

          {/* Liste prestataires */}
          <div style={{color:C.text,fontSize:14,fontWeight:700,marginBottom:12,marginTop:24}}>
            Prestataires enregistrés ({prestataires.length})
          </div>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Nom","Type","Ville","Email / Login","Offres","Plan","Auth","Depuis"].map(h=>(
                  <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase",letterSpacing:1}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {prestataires.map(p=>{
                const t=getType(p.type_metier);
                const nbOffres=offres.filter(o=>o.prestataire_id===p.id).length;
                return(
                  <tr key={p.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:"10px 12px",color:C.text,fontWeight:600}}>{p.nom}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:13}}>{t.emoji} {t.label}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:13}}>{p.ville||"—"}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{p.email||"—"}</td>
                    <td style={{padding:"10px 12px"}}><span style={{color:"#0066FF",fontWeight:700}}>{nbOffres}</span></td>
                    <td style={{padding:"10px 12px"}}>
                      <span style={{background:p.plan==="trial"?"rgba(34,197,94,0.1)":"rgba(0,102,255,0.1)",color:p.plan==="trial"?"#22c55e":"#0066FF",fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20}}>
                        {p.plan==="trial"?"🎁 Essai":"⚡ "+p.plan}
                      </span>
                    </td>
                    <td style={{padding:"10px 12px"}}>
                      <span style={{background:p.auth_id?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",color:p.auth_id?"#22c55e":"#ef4444",fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20}}>
                        {p.auth_id?"✅ Actif":"❌ Sans compte"}
                      </span>
                    </td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>
                      {p.created_at?new Date(p.created_at).toLocaleDateString("fr-FR"):"—"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* OFFRES */}
      {!loading&&tab==="offres"&&(
        <div>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${C.border}`}}>
                {["Titre","Type","Prestataire","Prix","Remise","Dates","Statut"].map(h=>(
                  <th key={h} style={{padding:"8px 12px",color:C.muted,fontSize:11,fontWeight:600,textAlign:"left",textTransform:"uppercase",letterSpacing:1}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {offres.map(o=>{
                const t=getType(o.type_offre);
                const now=new Date();
                const debut=o.date_debut?new Date(o.date_debut):null;
                const fin=o.date_fin?new Date(o.date_fin):null;
                const isActive=o.active&&(o.permanente||((!debut||debut<=now)&&(!fin||fin>=now)));
                const isAVenir=o.active&&debut&&debut>now;
                const isExpiree=o.active&&fin&&fin<now;
                const statut=!o.active
                  ?{bg:"rgba(107,114,128,0.1)",color:"#6b7280",label:"⏸ Inactive"}
                  :isAVenir
                  ?{bg:"rgba(59,130,246,0.1)",color:"#3b82f6",label:"🔜 À venir"}
                  :isExpiree
                  ?{bg:"rgba(239,68,68,0.1)",color:"#ef4444",label:"⌛ Expirée"}
                  :{bg:"rgba(34,197,94,0.1)",color:"#22c55e",label:"✓ Active"};
                const fmtD=(d)=>d?new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}):"—";
                return(
                  <tr key={o.id} style={{borderBottom:`1px solid ${C.border}`}}>
                    <td style={{padding:"10px 12px",color:C.text,fontWeight:600,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.titre}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:13}}>{t.emoji} {t.label}</td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12}}>{o.prestataires?.nom||"—"}</td>
                    <td style={{padding:"10px 12px",color:C.text,fontWeight:700}}>{o.prix?`${o.prix}€`:"—"}</td>
                    <td style={{padding:"10px 12px"}}>
                      <span style={{background:"rgba(0,102,255,0.1)",color:"#0066FF",fontWeight:900,fontSize:13,padding:"3px 10px",borderRadius:20}}>-{o.promo_pct}%</span>
                    </td>
                    <td style={{padding:"10px 12px",color:C.muted,fontSize:12,whiteSpace:"nowrap"}}>
                      {o.permanente
                        ?<span style={{color:"#22c55e",fontWeight:600}}>✓ Permanente</span>
                        :<span>{fmtD(o.date_debut)} → {fmtD(o.date_fin)}</span>
                      }
                    </td>
                    <td style={{padding:"10px 12px"}}>
                      <span style={{background:statut.bg,color:statut.color,fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,whiteSpace:"nowrap"}}>
                        {statut.label}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── ROOT ─────────────────────────────────────────────────────
/* ══ CHOIX APPLICATION ══════════════════════════════ */
function AppChooser({admin, onChoose, onLogout}){
  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,position:"relative"}}>
      <div style={{position:"absolute",top:16,right:16}}>
        <span style={{fontSize:9,fontWeight:700,color:"#9CA3AF",letterSpacing:0.5}}>#328</span>
      </div>
      <div style={{textAlign:"center",marginBottom:40}}>
        <div style={{color:C.text,fontSize:28,fontWeight:900,letterSpacing:-1,marginBottom:8}}>Administration</div>
        <div style={{color:C.muted,fontSize:14}}>Choisissez l'application à gérer</div>
      </div>
      <div style={{display:"flex",gap:20,flexWrap:"wrap",justifyContent:"center",maxWidth:520}}>
        {/* IOK */}
        <button onClick={()=>onChoose("iok")}
          style={{width:220,padding:"32px 20px",borderRadius:24,border:"2px solid rgba(255,92,58,0.3)",background:"linear-gradient(135deg,rgba(255,92,58,0.12),rgba(255,140,66,0.06))",cursor:"pointer",fontFamily:"inherit",textAlign:"center",transition:"all 0.2s"}}>
          <div style={{fontSize:52,marginBottom:12}}>🍽️</div>
          <div style={{color:"#FF5C3A",fontWeight:900,fontSize:20,marginBottom:6}}>IOK</div>
          <div style={{color:C.muted,fontSize:12,lineHeight:1.6}}>Restaurants · Réservations · Clients</div>
        </button>
        {/* IOK'S */}
        <button onClick={()=>onChoose("siok")}
          style={{width:220,padding:"32px 20px",borderRadius:24,border:"2px solid rgba(0,102,255,0.3)",background:"linear-gradient(135deg,rgba(0,102,255,0.12),rgba(51,153,255,0.06))",cursor:"pointer",fontFamily:"inherit",textAlign:"center",transition:"all 0.2s"}}>
          <div style={{fontSize:52,marginBottom:12}}>🎓</div>
          <div style={{color:"#0066FF",fontWeight:900,fontSize:20,marginBottom:6}}>StuDiscount</div>
          <div style={{color:C.muted,fontSize:12,lineHeight:1.6}}>Prestataires · Étudiants · Offres</div>
        </button>
      </div>
      <button onClick={onLogout} style={{marginTop:40,color:C.muted,fontSize:13,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit"}}>
        Se déconnecter
      </button>
    </div>
  );
}

function App(){
  const [admin,setAdmin]=useState(null);
  const [appChoice,setAppChoice]=useState(null); // null | "iok" | "siok"
  if(!admin) return <AdminLogin onSuccess={setAdmin}/>;
  if(!appChoice) return <AppChooser admin={admin} onChoose={setAppChoice} onLogout={()=>setAdmin(null)}/>;
  if(appChoice==="siok") return <SIOKAdminApp admin={admin} onLogout={()=>setAdmin(null)} onBack={()=>setAppChoice(null)}/>;
  return <AdminApp admin={admin} onLogout={()=>setAdmin(null)} onBack={()=>setAppChoice(null)}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
